      stepsTitle: The basics
      step1: "Take a job from any board you've visited. You can have <c>{count}</c> at once."
      step2: Gather the items. Carry them, or keep them in your bank if the job board location has one.
      step3: Go to the job board location and hand the items in to collect your rewards.
      cardTitle: Reading a job
      cardAsk: The item the job asks for. Tap it to see where you can find it.
      cardCount: "How many you have, out of how many the job asks for."
      cardLabel: "The quality the job asks for, or <itemTag tag=\"fine\"/> when it asks for a Fine item. Other qualities don't count, except the better ones the job takes as substitutes."
      cardBank: "How many your bank holds. Tap it to see what you own of the quality required and of every substitute."
      cardRewards: What the job pays. Tap the job to see every reward and the qualities it takes.
      cardStrip: "A green edge means the job is ready: you can hand it in at its job board with what you have. A brown one means you've taken it, but it still needs items."
      qualitiesTitle: Better qualities
      qualitiesText: "A job that asks for a crafted item can also take a better quality of it instead. Hand in one quality for the whole job: you can't mix them. A quality you have enough of is ticked."
      fineTitle: Fine items
      fineText: "<itemTag tag=\"fine\"/> items only count for jobs that ask for Fine.\n<bp/>Find them while gathering. The odds are 1 in 100 by default.\n<bp/><stat s=\"fineMaterialFind\"/> on your gear and tools improves those odds."
