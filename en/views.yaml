      acceptTitle: Accept
      accept: "Accepts the job. You don't need to be at the job board location, as long as you've visited it."
      handInTitle: Hand in
      handIn: "Hands the items in at the job board location and collects your rewards."
      withdrawTitle: Withdraw
      withdraw: Takes the items the job needs out of your bank, so you can carry them to the job board location.
      withdrawSomeTitle: Withdraw some
      withdrawSome: "Shows instead of Withdraw when you don't have everything a job needs. Takes what your bank has toward it, so you can carry it to the job board location."
      abandonTitle: Give up
      abandon: Gives up the job and frees its slot for another one.
      dismissButtonTitle: Dismiss
      dismissButton: "Hides a job you haven't taken from the boards."
      locked: "The job needs items you've protected: a locked item, or one your job board settings keep. Tap it to see why."
      handInAllText: "Hands in every job that's ready at this board at once. You see a dialog first of the items you're handing in."
      dismissedTitle: Dismissed jobs
      dismissedText: "Dismiss a job you don't want and it's hidden from the boards. You can bring them back from job board settings."
      marksTitle: Item marks
      markLocked: "Locked. A locked item is never handed in or withdrawn for a job."
      markInUse: "In use by your current crafting, activity or food."
      markFavorite: "Favourited. A job asks before handing it in."
