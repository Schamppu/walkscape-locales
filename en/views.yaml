      collectibleItems: Collectible items are rare drops you can obtain in the game mainly from activities. <c i=0>Each collectible grants you</c> <c i=1>one</c> <icon i="Achievement Point"/> <c i=1>Achievement Point</c>. Collectibles don't take any inventory space and they're always with your character.
      loreItems: Lore items are items such as books, letters and other written materials that you can find. They don't take any inventory space and you can read them at any time.
