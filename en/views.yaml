      levelsText: "Some jobs need a higher level with the board's faction, but they also pay more. They're listed at the end of each board, grouped by the level they need. Boards you haven't visited stay locked until you go there."
      confirmTitle: Confirm
      confirmText: "Your changes show right away, but nothing is sent until you press Confirm. If you close the job boards with unconfirmed changes, you'll be asked whether to confirm or discard them."
