singulars:
  smithing:
    name: 鍛冶
    desc: 燃えさかる鍛冶場で鉱石を製錬してインゴットにし、それを打ち鍛えて防具にしたり、役に立つ道具を作ったりする。
  agility:
    name: 俊敏性
    desc: 自然の中で体を動かして新鮮な空気を吸い込み、アレヌムを冒険して宝を見つけ出す！
  carpentry:
    name: 木工
    desc: 生の丸太を正確な寸法の部品に加工し、役に立つ品を作る。
  cooking:
    name: 調理
    desc: 自然の食材を丁寧に選び、お腹が鳴りよだれが出るほどのおいしいごちそうに仕上げる。
  crafting:
    name: クラフト
    desc: 尽きない創造力と確かな技で部品を組み合わせ、職人ならではの道具や装備を作り出す。
  fishing:
    name: 釣り
    desc: 網や釣り糸を投げ入れ、アレヌムの水面下に暮らす数えきれないほどの生き物を探す。
  foraging:
    name: 採集
    desc: 草木に埋もれたものから砂に埋まったものまで、アレヌムのさまざまな場所に眠る資源やお宝を探し出す。
  mining:
    name: 採掘
    desc: 山を越え、洞窟を抜けて、貴重な鉱石や宝石を掘り出す。
  woodcutting:
    name: 伐採
    desc: アレヌムの広大な森から木材を切り出し、世界の産業に欠かせない原材料を得る。
  tailoring:
    name: 裁縫
    desc: 針と糸と布を手に織機へ向かい、あらゆる環境に合った服を作る。
  trinketry:
    name: 細工
    desc: 錬石術、宝石学、宝飾細工の技。貴石から美しく価値ある品を生み出す。
  hunting:
    name: 狩り
    desc: 素手や弓で荒野に分け入り、あらゆる生き物を追い、罠にかけ、狙いを定める。
