singulars:
  service:
    text: <serviceTier tier="{tier}" />以上の<object id="{obj}" />施設が必要です。
  skillLevel:
    text: <skill skill="{skill}" level="{level}" needed/>以上が必要です。
  mainSkill:
    text: <skill skill="{skill}"/>の実行中。
  craftingType:
    textSkill: <skill skill="{skill}" />でクラフト中<numberProgress 
      current="{current}" max="{max}" />。
  workEfficiencyAt:
    text: 作業効率が<numberProgress current="{current}" max="{max}" />%以上の間。
  keywordEquipped:
    text: 装備中の<object id="{obj}" />が必要です。
  minimumSkillLevel:
    text: すべてのスキルでレベル<numberProgress current="{current}" max="{max}" />以上が必要です。
  itemQualityEquipped:
    text: 装備中の<itemQuality quality="{quality}" 
      type="{type}"/>アイテムが<numberProgress current="{current}" max="{max}" 
      />個以上必要です。
  distinctItemsEquippedKeyword:
    text: 装備中の<object id="{obj}" />が<numberProgress current="{current}" 
      max="{max}" />種類必要です。
