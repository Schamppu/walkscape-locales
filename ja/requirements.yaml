singulars:
  service:
    text: <serviceTier tier="{tier}" />以上の<object id="{obj}" />施設が必要です。
  skillLevel:
    text: <skill skill="{skill}" level="{level}" needed/>以上が必要です。
  mainSkill:
    text: <skill skill="{skill}"/>の実行中。
  craftingType:
    textSkill: <skill skill="{skill}" />でクラフト中<numberProgress 
      current="{current}" max="{max}" />。
  workEfficiencyAt:
    text: 作業効率が<numberProgress current="{current}" max="{max}" />%以上の間。
  keywordEquipped:
    text: 装備中の<object id="{obj}" />が必要です。
  minimumSkillLevel:
    text: すべてのスキルでレベル<numberProgress current="{current}" max="{max}" />以上が必要です。
  itemQualityEquipped:
    text: 装備中の<itemQuality quality="{quality}" 
      type="{type}"/>アイテムが<numberProgress current="{current}" max="{max}" 
      />個以上必要です。
  distinctItemsEquippedKeyword:
    text: 装備中の<object id="{obj}" />が<numberProgress current="{current}" 
      max="{max}" />種類必要です。
  achievementPointsPercent:
    text: 実績ポイント<icon i="achievement point"/><numberProgress current="{current}"
      max="{max}" />（全体の{percentage}%）が必要です。
  itemEquipped:
    text: 装備中の<item id="{item}"/>が必要です。
  factionReputations:
    erdwiseReputation: <realm 
      realm="faction-erdwise-697ae8a6-491e-46fd-8a05-4b744f9630eb" 
      />の派閥評判<numberProgress current="{current}" max="{max}" />が必要です。
    jarvoniaReputation: <realm 
      realm="faction-jarvonia-1b061315-a63d-4dc1-a8ba-10902a83c5db" 
      />の派閥評判<numberProgress current="{current}" max="{max}" />が必要です。
    syrenthiaReputation: <realm 
      realm="faction-syrenthia-6e9359fa-597b-4448-9df5-cc3fff9a5108" 
      />の派閥評判<numberProgress current="{current}" max="{max}" />が必要です。
