maps:
  tips:
    "18": 
      スキルレベルが<hl>アクティビティ</hl>のメインスキル条件を上回ると、1レベルごとにその作業の<hl>作業効率</hl>が+1.25%上がります（最大20レベル分）。
    "2": ほとんどの宝箱を見つける基本確率は<hl>1/250</hl>です。より良い装備やツールで上げられます。
    "0": 重量過多になってもアクティビティが遅くなるだけで、移動には影響しません。
    "4": 所持品でアイテムを長押しすると、複数選択のオプションが開きます。
singulars:
  info:
    attributeTypes: |
      <bp/><icon i="Gear alt"/>  <c i=0>装備品</c>：現在装備している装備品の特性。

      <bp/><icon i="Tools alt"/>  <c i=1>装備中のツール</c>：現在装備しているツールの特性。

      <bp/><icon i="Collectible"/>  <c i=2>コレクション</c>：コレクションによる永続的な特性。

      <bp/><icon i="Dev services"/>  <c i=3>施設</c>：現在地にある施設の特性。

      <bp/><icon i="Pets"/>  <c i=4>ペット</c>：召喚中のペットの特性。

      <bp/><icon i="Fine material"/>  <c i=5>上質素材ボーナス</c>：上質素材を使うことで得られるボーナス。

      <bp/><icon i="Material"/>  <c i=6>投入素材</c>：アクティビティで選択した投入物の特性。

      <bp/><icon i="Consumables"/>  <c i=7>消耗品</c>：消費中の消耗品の特性。

      <bp/><icon i="Level up"/>  <c i=8>スキルレベル</c>：スキルレベルによる特性（例：必要スキルレベルを上回っている場合）。

      <bp/><icon i="Abilities"/>  <c i=9>能力</c>：能力による特性。

      <bp/><icon i="Player effect"/>  <c i=10>発動中の効果</c>：現在発動中の効果による特性。
    worldMapIcons: |-
      <image id="bank"/> <hl>銀行</hl>：銀行でアイテムを預けたり引き出したりできます。

      <image id="deposit"/> <hl>預け箱</hl>：銀行と同じですが、預けることしかできません。

      <image id="store"/> <hl>ショップ</hl>：いろいろな物を売り買いできます！

      <image id="mysteriousMerchant"/> <hl>謎の商人</hl>：珍しい品々を扱う、目利きの商人です。

      <image id="jobBoard"/> <hl>依頼掲示板</hl>：報酬と評判を求める旅人のための、日替わりの依頼です。

      <image id="barber"/> <hl>理髪店</hl>と<image id="wardrobe"/><hl>クローゼット</hl>：見た目を変えられます。

      <image id="forge"/> <image id="kitchen"/><image id="workshop"/> <image id="sawmill"/><image id="loom"/> <image id="trinketry"/> <hl>クラフト施設</hl>：鍛冶、調理、クラフト、木工、裁縫、細工のレシピを作れます。

      アイコンの枠の色は施設のランクを表します：<image id="forge"/><serviceTier tier="basic"/>、<image id="forgeAdvanced"/><serviceTier tier="advanced"/>。

      <icon path="assets/icons/location_badges/unexplored_badge.png" size="16"/> <hl>未探索</hl>：まだ訪れていない場所です。

      <icon path="assets/icons/location_badges/rumor_badge.png" size="16"/> <hl>うわさ</hl>：うわさを聞いたことがある場所です。
    lockFavoriteItem: |-
      <icon i="Favorited"/> <c i=0>お気に入り</c>：このアイテムは捨てることも売ることもできません。クラフト、依頼、その他の行動には引き続き使えます。

      <icon i="Locked"/> <c i=1>ロック</c>：ロック中は、このアイテムを売る、捨てる、預けることができません。クラフト、依頼、その他の行動には引き続き使えます。

      ロックやお気に入り登録は、所持品と銀行にある同じ種類のアイテムすべてに適用されます。ロックやお気に入りの解除も、所持品または銀行から行えます。
