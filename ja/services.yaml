singulars:
  cosmetics:
    wardrobe:
      name: クローゼット
      desc: 自分のクローゼットを使い、持っている着せかえで見た目を自由に変えられる。
  cooking:
    basicKitchen:
      name: 初級キッチン
      desc: 質素なキッチン。シンプルで体にやさしい料理を作れる。
    azurazeraKitchen:
      name: 灯火キッチン（初級）
      desc: 料理人たちが腕を上げようと、互いに料理の経験を分かち合っている共同キッチン。
    eberhartMansionKitchen:
      name: エーベルハルト邸のキッチン（上級）
      desc: 
        エーベルハルト家は、人に与える者に与える。地元の煮炊き厨房に尽くしてきた証があれば、彼らが扉を開き、共用のキッチンで手を貸してくれる理由としては十分すぎるほどだ。
    underwaterKitchen:
      name: 水中キッチン（初級）
      desc: 水中での調理に合わせて調整された、さまざまな調理器具がそろったキッチン。
    cursedKitchen:
      name: 呪われたキッチン（上級）
  carpentry:
    basicSawmill:
      name: 初級製材所
      desc: 丸太を基本的な木材に加工する、簡素な製材施設。
    underwaterSawmill:
      name: 水中製材所（初級）
      desc: 木のようなサンゴの加工にぴったりの製材所。どんな丸太でも板材にできる道具もそろっている。
    barbantokSawmill:
      name: バルバントックの製材所（初級）
      desc: 卓越した職人技で知られた伝説の大工、バルバントックの幽霊が出るとうわさされる製材所。
    sawInHalfMill:
      name: ハンパない製材所（上級）
    cursedSawmill:
      name: 呪われた製材所（上級）
  smithing:
    basicForge:
      name: 初級鍛冶場
      desc: 初心者向けの鍛冶場。シンプルなアイテム作りに最適だ。
    frozenForge:
      name: 氷の鍛冶場
      desc: 氷でできた鍛冶場。全体に小さなペンギンの彫刻が施されている。
    underwaterForge:
      name: 水中鍛冶場（初級）
      desc: この水中鍛冶場は、金属を溶かすのに十分な熱を生む高温の蒸気噴出孔で稼働している。
    heatstrokeMetalworks:
      name: 熱中症金属工房（上級）
      desc: 火力の強さで名高い、ミリアディアン・アークの鍛冶場。砂漠にいてもなお、その周りで熱を感じられるほどだ。
    cursedForge:
      name: 呪われた鍛冶場（上級）
  crafting:
    basicWorkshop:
      name: 初級ワークショップ
      desc: シンプルで実用的なアイテム作りのために設計された、初級ワークショップ。
    tidalWorkshop:
      name: 潮流ワークショップ（上級）
      desc: 常に潮流の影響を受けているワークショップ。ものづくりに必要な道具はすべてそろっている。
    cursedWorkshop:
      name: 呪われたワークショップ（上級）
  tailoring:
    basicLoom:
      name: 初級織機
      desc: 頑丈な織機と使い込まれた裁縫台を備えた質素な工房。さまざまな布や道具であふれ、服作りの技を学びたい駆け出しの仕立て屋にぴったりだ。
    underwaterLoom:
      name: 水中織機（初級）
      desc: 海のファッションが求める過酷な水中環境に合わせて調整された織機。
    markedTextiles:
      name: マーク織物工房（上級）
      desc: このウレントマークの織物工場には最新鋭の織機と裁縫用具がそろい、砂漠の最新トレンドを生み出せるよう整えられている。
    cursedLoom:
      name: 呪われた織機（上級）
  trinketry:
    basicTrinketryBench:
      name: 初級細工台
      desc: 宝石のカットや簡単な小物作りのために設計された作業台。
    ruinedTrinketryBench:
      name: 朽ちた細工台（初級）
      desc: 冬の終わりの廃墟の中に、苔とキノコに覆われた古代の細工台がある。
    granularFacetingFacility:
      name: 精密研磨工房（上級）
      desc: 錬石術を極めた選りすぐりの職人たちが集う、傑出した細工施設。
    erdwissTrinketryFactory:
      name: エルドウィス細工工場（上級）
  misc:
    mysteriousMerchant:
      name: 謎の商人
      desc: 珍しいサービスを提供する謎めいた人物。
maps:
  tiers:
    "basic": 初級
    "advanced": 上級
