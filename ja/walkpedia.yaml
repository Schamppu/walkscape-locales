singulars:
  contentPages:
    skill:
      info:
        ofTotalSteps: 総歩数に占める割合
        stepsWalked: 歩いた歩数
        xpTo99: レベル99までのXP
        unlocks: すべての解放
        unlocksDesc: このスキルのレベルを上げると解放されるコンテンツを確認できます。
        level: レベル
        statistics: 統計
        guide: ガイド
        lastUnlock: 直近の解放
        nextUnlock: 次の解放
        xpToNext: 次のレベルまでのXP
        fromLevelToLevel: レベル<c>{from}</c>からレベル<c>{to}</c>まで
  pages:
    home:
      info:
        title: ウォークペディア
    keywordList:
      info:
        title: キーワード
        description: 
          キーワードは、多くのアイテム、場所、施設、アクティビティに使われています。たとえば、どのアイテムが光源として扱われるかを、ここで簡単に確認できます。
    locationList:
      info:
        title: 場所
        description: 場所は、世界の中で訪れることができる地点です。キャラクターが利用できる施設やアクティビティがあります。
    recipeList:
      info:
        title: レシピ
        description: レシピは、アイテムを自分で作るための方法です。たいてい素材と施設が必要です。
    itemList:
      info:
        title: アイテム
        description: 
          アイテムは、集めたり、使ったり、売ったりできる物です。世界で見つけたり、商人から買ったり、プレイヤーが自分で作ったりして手に入れます。
    shopList:
      info:
        title: ショップ
        description: ショップは、アイテムを売買できる場所です。たいてい建物の中にあります。
    skillList:
      info:
        title: スキル
        description: 
          スキルは、関連するアクティビティを行うとレベルが上がります。レベルが上がると新しいコンテンツが解放され、効率も上がります。
    activityList:
      info:
        title: アクティビティ
        description: 
          アクティビティは、現実世界で歩くことで世界の中で行える、繰り返しの作業です。アイテムを手に入れたり、スキルのレベルを上げたりする主な手段です。
    buildingList:
      info:
        title: 建物
        description: 建物は世界にある建造物で、多くの場合、ショップや銀行などの施設があります。
    characterList:
      info:
        title: キャラクター
        description: キャラクターは、世界で出会える人々です。クエストをくれたり、アイテムを売ってくれたりします。
    serviceList:
      info:
        title: 施設
        description: 施設は、その場所でさまざまな恩恵を与えてくれます。多くの場合、施設があるとアイテムを作れるようになります。
plurals:
  skillUnlocks:
    itemRequirementsMet:
      other: アイテム条件<c>{}</c>件達成
    recipeRequirementsMet:
      other: レシピ条件<c>{}</c>件達成
    activityRequirementsMet:
      other: アクティビティ条件<c>{}</c>件達成
