singulars:
  jarvonia:
    kallaheim:
      name: カラハイム
      desc: 
        カラハイムは北の国ジャーボニアの首都で、寒く雪深い気候で知られている。厳しい天候にもかかわらず、街は活気にあふれ、にぎわう市場、名高い鍛冶師、腕利きの木工職人がそろっている。カラハイムはジャーボニアの政治の中心であり、宗教の中心はアズラゼラである。
    norsackPlains:
      name: ノーサック平原
      desc: 草に縁どられた川と凍てつく峰が入り混じる地。だが寒気はたいてい深い谷の上を素通りし、谷に暮らす者には氷の手も届かない。
    portSkildar:
      name: スキルダー港
      desc: 
        厚い服と毛皮に身を包んだたくましい人々が暮らす港。町の道はいつも、シャベルで雪かきされているか、行き交う人々の足で踏み固められている。ひときわ目を引くのは、船乗りたちを陸へと導くそびえ立つ灯台だ。
    azurazera:
      name: アズラゼラ
      desc: 
        巨大な城壁でさえ、この街の大きく魔法めいた建物を隠しきれない。通りの角には商人の屋台が並び、ここでは魔法がごく当たり前のものらしい。魔法の言葉のつぶやきがかすかに耳をかすめても、すぐに街の喧騒にかき消されてしまう。
    frusenholm:
      name: フリューゼンホルム
      desc: 
        数ある街道の一つに沿ってひっそりとたたずむ町。町の背後の山々には、フリューゼンホルムの労働者たちの作業歌が響き、ふもとまでこだましている。多くの人が歌と品物を交換しにここを訪れる。
    barbantok:
      name: バルバントック
      desc: 
        森の奥にひっそりとたたずむ町。周りを囲む森を切り開いて作られた。近づくと、肥えた農地と礼拝堂が目に入る。森の縁には切り株がたくさん残っている。
    beachOfWoes:
      name: 嘆きの浜
      desc: 岩だらけの浜辺は雪に覆われている。冷たい波が海岸に打ち寄せ、心地よい音を立てている。潮風が爽やかさを添えている。
    hornOfRespite:
      name: 安息の角笛
      desc: 
        雪に覆われたこの半島の海岸に、古くて頑丈な木の小屋が建っている。窓からは暖かな明かりがこぼれ、煙突からは白い煙が立ちのぼっている。辺りの空気は澄みきって冷たい。
    centaham:
      name: センタハム
      desc: 
        ジャーボニアに入った多くの人が最初に出会う町で、できた当初よりも大きく発展した。この寒冷の地の都市をすべて結ぶ街道に沿って、建物が建ち並んでいった。行商人や商人がよくここに立ち寄って商売をしている。
    disenchantedForest:
      name: 魔法の解けた森
      desc: 
        魔法の解けた森は、雪と寒さに覆われた冬の森だ。木々は節くれ立って凍りつき、澄んだ冷たい空気にはどこか神秘的な気配が漂う。木を切るにはよさそうな場所だ。
    frostbiteMountain:
      name: 霜焼山
      desc: 
        ほかのどの山よりも高くそびえる一つの山が、ジャーボニアの道しるべとなっている。一面の雪の間から、どっしりとした赤い岩が顔をのぞかせている。この地を訪れた者は誰しも、天に届くこの山を前に畏怖の念を抱かずにはいられない。
    coldington:
      name: コールディントン
      desc: 
        この素朴な町のおもな建物は、小さな礼拝堂だ。賛美歌が通りに静かに響き渡る。この町の人々は寒さに震えていても、その魂は希望と信仰の光で温められている。
    nomadWoods:
      name: 放浪の森
      desc: うっそうとした森。迷い込んだ者を、開けた土地の冷たい風から守ってくれる。枝に積もった雪が、外の世界の音を閉じ込める。穏やかで、静かだ。
    pitOfPittance:
      name: 雀の涙の穴
      desc: 
        雪の森の真ん中にある、かなり大きな穴。ごつごつした岩の出っ張りと岩壁が一面に広がっている。どうやら銅やスズ、それに塩まで採掘できる塊が含まれているようだ……塩？
    sanguineHills:
      name: 紅の丘
      desc: 雪をかぶった峰もある大きな山脈。風がうなりを上げ、舞い上がる粉雪も太陽のぬくもりも、分厚い突風に乗せて吹き飛ばしていく。
    noiselessPass:
      name: 静寂の山道
      desc: 
        丘が連なる長い山道。両側の山が厳しい風をほとんどさえぎってくれる。だが吹きだまる雪とともに、しばしば霜がそっと身を包み込む。この道は不気味な静けさに包まれ、風の音さえ谷底までは届かないようだ。
    casbrantFields:
      name: カスブラント平原
      desc: 
        巨大な骨、見張り塔、曲がりくねった道が、どこまでも広がる平原をかたちづくっている。雪のキルトの間から、ところどころ緑がのぞいている。ここではときおり突風が吹く以外、風はほとんどない。
    winterWavesGlacier:
      name: 氷波の氷河
      desc: 
        この氷河にはペンギンたちが暮らしている。遠くにはイグルーが見える。果てしない氷原のどこかに眠るといううわさの伝説の宝を求めて、多くの冒険者がここを訪れる。
    wintersEnd:
      name: 冬の終わり
      desc: 
        満開の春の花の濃い香りが辺りに満ちている。そびえ立つ断崖の上には、ジャーボニアの最南端を示す古い塔が立っている。海の向こうを見渡すと、遠くにワリシアのシルエットが見える。
    blackEyePeak:
      name: 黒眼峰
      desc: 
        険しい山々の中心に、古代の火山の火口が口を開けている。活動していた日々はとうに忘れ去られ、今では完全に凍りついている。その暗い穴は、気味が悪いほど人を誘うように感じられる。
    nurturingNookSprings:
      name: 秘境癒しの湯
      desc: 湯は鮮やかな青にきらめき、辺りを硫黄の匂いがする蒸し暑い湯気で包んでいる。温泉は現在改修中で、まもなく営業を再開する予定だ！
    fortOfPermafrost:
      name: 永久凍土の砦
      desc: 
        周りの大地と同じくらい冷たい大きな橋。その先の砦はかすかに風の音を響かせ、氷の鎧と力強い気配をしっかりとまとっている。それは築いた者たちの偉業の証だ。
  gdte:
    mangroveForest:
      name: マングローブの森
      desc: 
        川が流れ込むこの場所には木々が豊かに生い茂っているが、不気味な静けさに包まれている。太い根が草やほかの植物を締め出し、鳥はさえずらず、そよ風は葉一枚揺らさない。
    granfiddich:
      name: グランフィディック
      desc: 
        大きな城壁と城が、この町が栄えていることを物語っている。にぎやかな市場は明るい笑顔であふれ、毎朝、鐘の最後の音が鳴り終わると、教会から賛美歌が響いてくる。
    salsfirth:
      name: サルスファース
      desc: 
        農民と商人が集まる、落ち着いた町。建物は分厚い石造りで、多くの建物の赤い瓦屋根は頑丈でどっしりしている。この素朴で平和な町の人々と同じように。
    bilgemontPort:
      name: ビルゲモント港
      desc: 
        この港は、近くの別の街との交易によく赤の渡しを使っている。とはいえ海に近いせいか、ゆっくりと南へ流れる波が運ぶ潮の香りが、町じゅうに染みわたっている。
    granfiddichShores:
      name: グランフィディックの浜
      desc: 明るい太陽の下で焼けつくように熱い広い浜辺は、ハーフリングと人間でにぎわっている。
    blackspellPort:
      name: 黒魔港
      desc: 
        波止場のすぐ先に、灯台のある小島が浮かんでいる。この街の人々は港と交易にとても熱心なようで、早朝には波止場に沿って商品の木箱がずらりと並ぶ。
    everhaven:
      name: 永楽園
      desc: 
        石の城壁にも森にも隔てられていない半島の都市。その代わり、街の奥には巨大な城がそびえている。この街はほかのどの街よりもずっと穏やかなようだ。市民たちは、ほとんど音も立てずに商いや仕事にいそしみ、一日を過ごしている。
    farsandCoast:
      name: ファーサンド海岸
      desc: 
        この海岸の縁には多くの川が切り込み、ゆっくりと海へ流れ込んでいる。近くの森は木々がうっそうと茂り、野生動物も多い。浜辺に打ち寄せる波だけが、世界のほかのものよりずっとゆっくりと寄せては返しているようだ。
    oldArenaRuins:
      name: 古闘技場跡
      desc: 
        闘技場の石の床には、数々の激しい戦いの跡が刻まれている。この一帯はすでに自然に取り戻されている。風がちょうどよく吹くと、過去の戦いのこだまが聞こえてくるという。
    warrenField:
      name: ウォレンフィールド
      desc: 
        背の伸びた葦と草に縁取られた、流れる川。夕暮れどきには、カエルとコオロギの声が圧倒されそうなほど響く。夜に見える星があまりに多くて目がくらむほどだ、とささやく者も多い。
    bogTop:
      name: 沼の上
      desc: 
        暖かく濁った沼地。分厚くふかふかした地面が足元で揺れ、空気は腐ったような湿った匂いで重い。節くれ立った根を持つ、ひょろりと背の高い木々が、暗く静かな水面に覆いかぶさっている。奇妙な球根状の植物が点在し、どんよりと曇った空を映している。
    halflingCampgrounds:
      name: ハーフリングの野営地
      desc: 
        森の茂みの中に、ささやかな野営地がある。小さく、この場所の自然をほとんど乱していない。火がたかれ、料理が作られ、日が木々の梢の向こうに沈むころには、陽気な宴が始まるらしい。
    witchsForest:
      name: 魔女の森
      desc: 
        ねじれた木々が長く不気味な影を落とす、暗く陰鬱な沼地。節くれ立った木の高みに建つ魔女の小屋が、よどんだ水を見下ろしている。腐敗の匂いが重く漂う空気には、すすり泣く悲しげな声が満ちている。
    halfmawHideout:
      name: ハーフモーの隠れ家
      desc: 
        隠された沼地は、悪名高い大蛇ハーフモーの縄張りだ。沼の奥深くにたたずむ趣のある丸太小屋が、穏やかな隠れ家となっている。風雨にさらされた木材と石の煙突を持つその小屋は、周りの自然にすっかり溶け込んでいる。
    bogBottom:
      name: 沼の底
    redCoast:
      name: 赤い海岸
  wallisia:
    wraithwater:
      name: 亡霊ヶ淵
      desc: 
        かつて海賊たちが、幽霊となった住民から奪い取った水没した古い町。その海賊たちも今では亡霊と化している。彼らの気配によって、あたり一帯はエクトプラズムに満ちている。
    tentenWetriceFields:
      name: テンドン水田
      desc: 
        水に浸かった古い農地。湿って入り組んだ水辺のあちこちに、青々とした植物や水生の生き物が散らばっている。農地の外れには住まいが一軒建っている。
    kildomeCross:
      name: キルドーム十字路
    stalkingYewWoods:
      name: 付きまとうイチイの森
    blackrane:
      name: ブラックレイン
    blackwaterFields:
      name: 黒水原
    stoneSlingersCamp:
      name: 石投げ団の野営地
  wrentmark:
    myriadianArc:
      name: ミリアディアン・アーク
      desc: 
        ウレントマークの首都で、砂漠を旅する者たちにとってのオアシスとなっている。店や施設のあいだを人々が品物の仕入れや配達に駆け回り、街は活気にあふれている。忙しい職人たちは、高度な品を仕上げるために常に新しい素材を求めている。
    crownOfCinders:
      name: 燃え殻の冠
    cactusCanyonMirage:
      name: サボテン峡谷
  syrenthia:
    vastalumeCity:
      name: バスタルーム
      desc: 
        海中の岩の谷に、さまざまな建物が築かれている。谷の中央には、宮殿をいただく大きな岩が浮かんでいる。いくつもの橋がそれを街のほかの場所とつないでいる。にぎやかな海中都市を、魚もマーフォークも泳ぎ回っている。
    kelpForest:
      name: 昆布の森
      desc: 
        海底には、さまざまな形と大きさの昆布が豊かに生い茂っている。小魚たちが昆布の群生の間を絶えず行き交い、もっと小さな植物や魚をついばもうとしている。
    darkDepths:
      name: 暗潮海溝
    casbrantsGrave:
      name: カスブラントの墓
      desc: 
        巨大な難破船が砂の上に横たわっている。いったいいつからここにあるのだろう？魚やほかの生き物たちが住みかにしている。色とりどりの海中植物が難破船の上やその周りに生え、見事な光景を作り出している。
    underwaterCave:
      name: 海中洞窟
      desc: 
        海中洞窟には大きな入口があり、貴重な鉱石や岩でいっぱいだ。洞窟の壁に沿って美しい海中植物が生えている。洞窟のさらに奥へ続く道がいくつもあるが、探索するのは危険だ。
    fertileShallows:
      name: エララのラグーン
      desc: 浅瀬では、陽の光を浴びて生命が栄えている。誘うような潮の流れに身をまかせて泳ぐか、それともマーフォークの農場を手伝うか？
