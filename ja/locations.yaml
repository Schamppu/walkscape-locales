      name: スキルダー港
      desc: 
        厚い服と毛皮に身を包んだたくましい人々が暮らす港。町の道はいつも、シャベルで雪かきされているか、行き交う人々の足で踏み固められている。ひときわ目を引くのは、船乗りたちを陸へと導くそびえ立つ灯台だ。
