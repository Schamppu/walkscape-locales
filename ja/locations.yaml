singulars:
  jarvonia:
    kallaheim:
      name: カラハイム
      desc: 
        カラハイムは北の国ジャーボニアの首都で、寒く雪深い気候で知られている。厳しい天候にもかかわらず、街は活気にあふれ、にぎわう市場、名高い鍛冶師、腕利きの木工職人がそろっている。カラハイムはジャーボニアの政治の中心であり、宗教の中心はアズラゼラである。
    norsackPlains:
      name: ノーサック平原
      desc: 草に縁どられた川と凍てつく峰が入り混じる地。だが寒気はたいてい深い谷の上を素通りし、谷に暮らす者には氷の手も届かない。
    portSkildar:
      name: スキルダー港
      desc: 
        厚い服と毛皮に身を包んだたくましい人々が暮らす港。町の道はいつも、シャベルで雪かきされているか、行き交う人々の足で踏み固められている。ひときわ目を引くのは、船乗りたちを陸へと導くそびえ立つ灯台だ。
    azurazera:
      name: アズラゼラ
    frusenholm:
      name: フリューゼンホルム
    barbantok:
      name: バルバントック
    beachOfWoes:
      name: 嘆きの浜
    hornOfRespite:
      name: 安息の角笛
    centaham:
      name: センタハム
      desc: 
        ジャーボニアに入った多くの人が最初に出会う町で、できた当初よりも大きく発展した。この寒冷の地の都市をすべて結ぶ街道に沿って、建物が建ち並んでいった。行商人や商人がよくここに立ち寄って商売をしている。
    disenchantedForest:
      name: 魔法の解けた森
    frostbiteMountain:
      name: 霜焼山
    coldington:
      name: コールディントン
    nomadWoods:
      name: 放浪の森
    pitOfPittance:
      name: 雀の涙の穴
    sanguineHills:
      name: 紅の丘
    noiselessPass:
      name: 静寂の山道
    casbrantFields:
      name: カスブラント平原
    winterWavesGlacier:
      name: 氷波の氷河
    wintersEnd:
      name: 冬の終わり
