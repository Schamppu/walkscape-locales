singulars:
  confirmations:
    toggleAgilityXp:
      text: 
        移動による俊敏性の経験値獲得を無効にしてもよろしいですか？あとで設定から再び有効にできます。この設定は、俊敏性の経験値を獲得しない特化型キャラクターを作りたい人向けです。
  errors:
    gameError:
      stepLoadingFailed:
        text: 
          ゲームクライアントが歩数を読み込めませんでした。エラーと端末の詳細を添えて、Discordで開発者に報告してください。ゲームを開き直すと、歩数が正常に読み込まれるかもしれません。
        title: 歩数の読み込みに失敗しました
      stepLoadingInterruped:
        text: 歩数の読み込み中に、ゲームがバックグラウンドに移行したか中断されました。ゲームを開き直して、歩数を読み込んでください。
        title: 歩数の読み込みが中断されました
  messages:
    comingSoon:
      text: このコンテンツは現在のバージョンのWalkScapeでは<hl>利用できません</hl>。
      title: 近日公開
    workInProgress:
      text: 
        この機能はまだ開発中で、多くの機能は<hl>まだ利用できません</hl>。今すぐ試すこともできますので、完全に実装されたらまた来てください！
      title: 開発中
