        />を試してみな。かぶりゃあ水の中でも昼みてぇにはっきり見えるさ！ ほれ、やってみな！ 
        もっとも、もう全身一式はそろっちゃいねぇけどね……あのいまいましいギルドのバートに胴の取引を目の前でかっさらわれちまったし、脚装備を運んでた船は？
        海の底さ、呪われた宝箱ごと全部な。それでも兜が欲しいってんなら、寄る港はここしかねぇよ！
