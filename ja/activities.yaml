  agility:
    global:
      traveling:
        name: '移動をする'
        desc: ''
      sledding:
        name: 'そり滑りをする'
        desc: "そりの取っ手を握って地面を蹴ると、アドレナリンが全身を駆けめぐる。周りの景色がぼやけ、その一瞬だけは、雪に覆われた丘を制する冬のスピードスターだ。"
      guardDuty:
        name: '見張り番をする'
        desc: ""
      sandcastleBuilding:
        name: '砂の城作りをする'
        desc: "浜辺の砂の城作りで大事なのは、肩の力を抜いて自由に作ることだ。砂の作品は長くはもたないかもしれないが、その瞬間のささやかな楽しみになる。"
      scientificTinkering:
        name: ''
        desc: ''
      birdWatching:
        name: '野鳥観察をする'
        desc: ''
      frisbeeGolfingBeginner:
        name: 'ジャーボニアコースでスカイディスクゴルフをする'
        desc: "スカイディスクゴルフの初心者にとって、一投一投が新しい発見だ。風を読み、木々をよけることを覚え、ゲームのシンプルさと、ディスクがバスケットへ舞い上がっていくのを見る喜びを味わう。"
      frisbeeGolfingIntermediate:
        name: '大公国コースでスカイディスクゴルフをする'
        desc: ""
      frisbeeGolfingDifficult:
        name: ''
        desc: ''
      crossCountrySkiingBeginner:
        name: 'クラシカルスキーをする'
        desc: '初心者のクロスカントリースキーの旅では、ひと滑りごとに驚きがある。雪の小道は遊び場だ。スキーのリズムを覚え、冬の森の穏やかな美しさに浸る。'
      crossCountrySkiingIntermediate:
        name: 'スケーティングスキーをする'
        desc: ''
      crossCountrySkiingDifficult:
        name: ''
        desc: ''
      exploreArea:
        name: ''
        desc: ''
    jarvonia:
      mountainClimbingBeginner:
        name: '登山をする'
        desc: '登山の準備をする。日差しがあって風もない、よく晴れた日だ。それでも、ゆっくり登っていくうちに片足を滑らせ、心臓が跳ね上がる。肝が冷えた！ついに頂上にたどり着き、足元に広がる世界を誇らしげに見下ろす。'
      mountainClimbingIntermediate:
        name: '岩稜登りをする'
        desc: ''
      rooftopJumpingBeginner:
        name: '小屋の屋根駆けをする'
        desc: ""
      blackEyePeakSearchTeam:
        name: '捜索隊の仕事をする'
        desc: '冒険者ギルド出張所を手伝い、山から戻らない行方不明者の居場所を突き止め、手がかりを集める。'
      blackEyePeakRescueTeam:
        name: '救助隊の仕事をする'
        desc: '捜索隊の情報をもとに、自ら現場へ向かって救助活動を行う。'
    gdte:
      kayaking:
        name: 'カヤックをする'
        desc: ""
