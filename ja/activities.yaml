singulars:
  woodcutting:
    jarvonia:
      cutPineTrees:
        name: 'マツの木を切る'
        desc: '斧を力強く振るい、決意を胸にマツの木を切り倒していく。'
      cutBirchTrees:
        name: 'シラカバの木を切る'
        desc: '渾身の力で斧を振るい、そびえ立つシラカバの木を切り倒そうと挑む。'
      cutSpruceTrees:
        name: 'トウヒの木を切る'
        desc: '斧をしっかりと握りしめ、全身の力を込めて、そびえ立つトウヒの木に打ち込む。'
      cutMapleTrees:
        name: 'カエデの木を切る'
        desc: ''
      cutOakTrees:
        name: 'オークの木を切る'
        desc: "そびえ立つオークの木に、黙々と斧を打ち込んでいく。大きく広がる枝は、まるで自然が腕を広げて抱きしめているかのようだ。"
      cutTeakTrees:
        name: 'チークの木を切る'
        desc: ''
      cutWillowTrees:
        name: 'ヤナギの木を切る'
        desc: ''
      cutMangroveTrees:
        name: 'マングローブの木を切る'
        desc: '絡み合う根につまずかないよう気をつけながら、この不思議な形の木から丸太を取ろうと奮闘する。'
      firewoodMaking:
        name: '薪を割る'
        desc: "忍耐と汗と努力、そして頼れる手斧で、丸太を容赦なく割っていく。素手で割れたらいいのに。そんなことができるのは、控えめに言ってもスーパーヒーローくらいだろう。"
      branchTrimming:
        name: '枝を切る'
        desc: '地面近くの枝を払っておけば、このあたりでは森林火災の予防になる。'
    syrenthia:
      coralCutting:
        name: 'サンゴを切る'
        desc: ""
    global:
      cutBambooLogs:
        name: '竹を切る'
        desc: ''
      cutEctoTrees:
        name: エクトプラズムの木を切る
      cutYewTrees:
        name: イチイの木を切る
  mining:
    global:
      mineCopperOre:
        name: '銅鉱石を採掘する'
        desc: 'ツルハシが岩肌を打つリズミカルな音があたりに響く。根気よく銅鉱石を掘り進めていく。'
      mineTinOre:
        name: 'スズ鉱石を採掘する'
        desc: 'ツルハシの音が採掘場に響き渡る。休むことなく岩を削り、発見を待つスズ鉱石の隠れた鉱脈を掘り当てていく。'
      mineIronOre:
        name: '鉄鉱石を採掘する'
        desc: 'ツルハシを振るうたびに、鉄鉱石の素朴な美しさが姿を現す。幅広い用途を持つ、頼れる資源だ。'
      mineCoal:
        name: '石炭を採掘する'
        desc: "頼れるツルハシを打ち込むたびに、石炭の鉱脈が現れる。王国を守る武器や鎧を鍛える鍛冶屋たちにとって、欠かせない燃料だ。"
      mineTarsiliumOre:
        name: 'タルシリウム鉱石を採掘する'
        desc: ''
      mineFarganiteOre:
        name: 'ファーガナイト鉱石を採掘する'
        desc: ''
      mineTarsiliumOreUnderwater:
        name: 'タルシリウム鉱石を採掘する（水中）'
        desc: ""
    jarvonia:
      goldPanning:
        name: '砂金をすくう'
        desc: '川の堆積物を利用した、原始的な金の採取法だ。まず皿を川底の砂に沈める。次に手で揺すって砂利をほぐしていくと、最後には砂と、運がよければ金ナゲットだけが残る。'
      spelunking:
        name: '洞窟を探索する'
        desc: ''
      surfaceSaltMining:
        name: '露天で岩塩を採掘する'
        desc: '坑道での塩の採掘は重労働だ。塩に絶えず触れているせいで、すぐに体の水分を奪われてしまう。幸い、この岩塩（ハライト）の結晶は風通しのよい地上にあり、ツルハシで叩けば簡単に剥がれる。'
      stoneQuarrying:
        name: '石材を採掘する'
        desc: 'ロック・アンド・ストーン！'
      minePitCopperOre:
        name: 露天で銅鉱石を採掘する
        desc: まだ地上のまま、銅鉱石を含んでいそうな岩の露頭を掘る。岩は硬く、なかなか鉱石を手放さない。
      minePitTinOre:
        name: 露天でスズ鉱石を採掘する
        desc: 地上で、スズ鉱石を含んでいそうな岩の露頭を見つけた。掘り出すには、根性と粘り強さが必要だ。
    gdte:
      underwaterAqueductDigging:
        name: '水中で水路を掘る'
        desc: ''
    syrenthia:
      caveDiving:
        name: '洞窟に潜る'
        desc: ''
      mineVolcanicRock:
        name: '火山岩を採掘する'
        desc: ''
      mineTarsiliumOre:
        name: ''
        desc: ''
      fossilMining:
        name: '化石を採掘する'
        desc: ''
    wrentmark:
      mineSilverOre:
        name: 銀鉱石を採掘する
      mineGoldOre:
        name: 金鉱石を採掘する
      mineCrystalShards:
        name: 水晶炭を採掘する
      mineAdamantOre:
        name: アダマント鉱石を採掘する
    wallisia:
      mineEctoRocks:
        name: エクトプラズムの岩を採掘する
  fishing:
    jarvonia:
      pondFishing:
        name: ''
        desc: ''
      lakeFishing:
        name: '湖で魚を獲る'
        desc: 'かじかんだ指で慎重に餌を付け、穏やかな湖面へと投げ入れる。'
      seaFishingNet:
        name: '海で魚を獲る（漁網）'
        desc: '海岸沿いに人目につかない場所を見つけ、穏やかな海へ網を投げる。海釣りならではの静かなひとときを楽しむ。'
      seaFishingRod:
        name: '海で魚を獲る（釣り竿）'
        desc: '海岸沿いに人目につかない場所を見つけ、穏やかな海へ竿を振る。海釣りならではの静かなひとときを楽しむ。'
      seaFishingCage:
        name: '海で魚を獲る（漁かご）'
        desc: ''
      cleaningTheHolyFountain:
        name: 聖なる泉を掃除する
        desc: 
          神殿の指導者たちは、聖なる泉の手入れを任せるほど信頼を寄せてくれている。水をきれいに保つため、網で泉の中をさらうことを許され、彼らの敬意を勝ち取っていく。
    gdte:
      magnetFishing:
        name: '磁石で釣りをする'
        desc: ''
      bogFishingNet:
        name: '沼で魚を獲る（漁網）'
        desc: ''
      bogFishingSpear:
        name: '沼で魚を獲る（銛）'
        desc: ''
    syrenthia:
      seaFishingSpear:
        name: '海で魚を獲る（銛）'
        desc: ''
      predatorHunting:
        name: '捕食魚を獲る（銛）'
        desc: ''
    wallisia:
      floodedRiverFishingRod:
        name: 増水した川で魚を獲る（釣り竿）
      ectoFishing:
        name: エクトプラズムの魚を獲る
      isthmusSeaFishingNet:
        name: 地峡の海で魚を獲る（漁網）
  foraging:
    global:
      litterLooting:
        name: 'ゴミをあさる'
        desc: '都会の喧騒の中、捨てられたがらくたをくまなく調べ、ありふれたゴミの中から掘り出し物に出会えることを願う。'
    jarvonia:
      forestForaging:
        name: '森で採集する'
        desc: "冬の森の中、鋭い目を光らせて歩き回り、雪の下に隠れた宝物を探して採集する。自然の恵みを見つける喜びを味わう。"
      cliffForaging:
        name: '崖で採集する'
        desc: 'そびえ立つ崖のふちに身を置き、険しい地形を慎重に探る。野生の山菜や、たくましいキノコなど、この高地で育つ食べられる宝物を探していく。'
      plainsForaging:
        name: '平原で採集する'
        desc: '平原をゆったり歩くたび、自然の恵みに包まれる。足もとの土で育った野生のベリー、種、やわらかな新芽を摘み集めていく。'
      coastForaging:
        name: ''
        desc: ''
      seashellSearching:
        name: '貝殻を採集する'
        desc: '価値のある貝殻や真珠がないか、海岸沿いを丹念に探す。'
      glacierForaging:
        name: '氷河で採集する'
        desc: ''
      caveForaging:
        name: '春の洞窟で採集する'
        desc: ""
      hornOfRespiteTreasureHunt:
        name: '宝探しをする'
        desc: "冒険者ギルドが、安息の角笛の周辺で特別なアイテムを探し出すという課題を出している。すべて見つけるまでに、どれくらいかかるだろうか？"
