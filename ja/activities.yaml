      butterflyCatching:
        name: 'チョウを採集する'
        desc: ''
      trellinDumpsterDiving:
        name: 'トレリンのゴミ箱で採集する'
        desc: ''
      erdwiseDumpsterDiving:
        name: 'エルドワイズのゴミ箱で採集する'
        desc: ''
