        name: 海岸線の岩場渡りをする
  cooking:
    jarvonia:
      vegetableChopping:
        name: '野菜の下ごしらえをする'
        desc: "料理長に怒鳴られ、何をすればいいのかもわからない、ストレスだらけの現場だ。それでも、ときどき野菜を正しく刻めることがある。"
      soupKitchenVolunteering:
        name: '煮炊き厨房の手伝いをする'
        desc: '普段着のままエプロンをつけ、料理長の指示に従って、温かいスープを最も必要としている人々に配り始める。全員に配り終えると、誇らしさと謙虚さ、そして仲間とのつながりが入りまじった気持ちになる。'
    gdte:
      wineGrapeStomping:
        name: 'ワイン用のブドウ踏みをする'
        desc: '種をつぶさないよう、裸足でブドウを踏む。圧搾桶の中央から端へと移動していくことで発酵を促す。果実に圧力をかけると、発酵を担う酵母と触れ合うからだ。'
  smithing:
    jarvonia:
      flameStoking:
        name: '炉の火の番をする'
        desc: 'ヘルガが鐘を鳴らしたら、炎をかき立てる。シンプルな暮らしだ。'
      horseshoeMaking:
        name: '蹄鉄作りをする'
        desc: "頑丈な金属を使い、硬めの地面で馬のひづめを守る蹄鉄を鍛える。固定には釘を使うが、ひづめには感覚がないため馬は痛がらない。人間のとても分厚い爪のようなものだ。"
  carpentry:
    jarvonia:
      shipRepairBeginner:
        name: 'ブリッグ船の修理をする'
        desc: '小型船の傷みや消耗の修理に加わる。木材、釘、索具、金具、ロープが自由に使える。親方が指示を出し、それを見事にこなしていく。いつかは自分が指示を出す側になるかもしれない。'
      woodCarving:
        name: '木彫りをする'
        desc: 'ナイフのような鋭い道具で木を形づくる木彫りは、古くから伝わる職人技だ。小さな人形やおもちゃから、儀式用や戦の仮面、大きなモザイクやそびえ立つトーテムポールまで、作品や図像は多種多様だ。'
      iceSculpting:
        name: 氷の彫刻をする
        desc: 
          氷を削る道具とのこぎりを手に、氷の塊を実用品や芸術品へと生まれ変わらせる。この芸術のはかなさは周りの気温しだいで、数分で消えることもあれば、溶けずに残り続けることもある。
    gdte:
      shipRepairIntermediate:
        name: '船体の修理をする'
        desc: ''
      underwaterAqueductConstruction:
        name: '水中水道橋の建設をする'
        desc: ''
  crafting:
    jarvonia:
      apprenticeForLoif:
        name: 'ロイフの見習いをする'
        desc: 'ロイフ・ウルフランド老人の頼みごとは、温かい飲み物に道具の研ぎ、散髪までと、山ほどある。それでも、彼が眠り込んだすきに、道具をいじって経験を積めることがある。'
      iceSculpting:
        name: ''
        desc: ''
      tinkering:
        name: 'がらくた修理をする'
        desc: "このがらくたをどう直すか、あごをかきながら考える。方法は千通りも思いつくが、そのほとんどは部品が足りない。目当てのものを探して、ワークショップを見回す。あった！さあ、取りかかろう。"
    syrenthia:
      underwaterBasketWeaving:
        name: '水中でかご編みをする'
        desc: ''
  hunting:
    jarvonia:
      rabbitTracking:
        name: 'ウサギの追跡をする'
        desc: 'かじられた植物や折れた小枝、地面のウサギの足跡に目を配りながら、小さな獲物を探す。'
      wolfHunting:
        name: 'オオカミ狩りをする'
        desc: '地面に残る大きな足跡をたどり、森のあちこちに潜む狩人、オオカミを探す。弓に矢をつがえ、いつでも一頭を仕留められるよう構えている。'
      bearHunting:
        name: 'クマ狩りをする'
        desc: ''
      deerHunting:
        name: 'シカ狩りをする'
        desc: ''
      birdFeeding:
        name: 鳥の餌付けをする
        desc: 
          手持ちの植物で地元の鳥をおびき寄せ、観察できるほど近くまで呼び込む。鳥たちは差し出したものをくわえると、散らかった羽根を残して去っていく。
      squirrelHunting:
        name: リス狩りをする
        desc: いつも見かけていたのに、今はこちらから隠れようとする。リスは獲物であり、こちらの矢が仕留めるのだ。
    gdte:
      lizardHunting:
        name: 'トカゲ狩りをする'
        desc: ''
      halfmawHunt:
        name: ''
        desc: ''
      invasiveSpeciesHunting:
        name: ''
        desc: ''
      alligatorHunting:
        name: ワニ狩りをする
      halfmawTracking:
        name: ハーフモーの追跡をする
    syrenthia:
      driftNetHunting:
        name: '流し網猟をする'
        desc: ''
    global:
      crabTracking:
        name: 'カニの追跡をする'
        desc: '浜辺を歩きながら、近くにいるカニの手がかりを探す。カニは砂に独特の足跡を残すが、あいにく潮の満ち引きで洗い流されてしまうことが多い。'
      birdhouseTrappingBeginner:
        name: ''
        desc: ''
      birdhouseTrappingIntermediate:
        name: ''
        desc: ''
      boxTrapping:
        name: '箱罠猟をする'
        desc: ''
    wallisia:
      ectoSlimeHunting:
        name: エクトプラズムスライム狩りをする
      unicornHunting:
        name: ユニコーン狩りをする
  tailoring:
    jarvonia:
      sailRepairBeginner:
        name: '小さな帆の修繕をする'
        desc: '丈夫な針と糸で、何枚もの当て布を丁寧に縫いつけて船の帆を直す。新品同様とはいかないが、しばらくは持つはずだ。'
    gdte:
      sailRepairIntermediate:
        name: '大きな帆の修繕をする'
