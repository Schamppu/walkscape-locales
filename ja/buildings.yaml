  buildings:
    jarvonia:
      frosthookEmporium:
        name: 霜鉤大商店
        desc: 
          年季の入った海賊の女が小さくうなずいて出迎える。木の床に義足をコツコツと鳴らしながら、彼女はカウンターの奥へと滑り込む。壁にも棚にも、釣り道具がところ狭しと並んでいる。驚いたことに、壁の一つには巨大なサメの頭が飾られており、その下の名札には「ブルース」と書かれている。
      northstarMercantile:
        name: 北極星商店
        desc: 
          北極星商店は今の場所で繁盛しており、多くの人がひっきりなしに出入りしている。奥の壁の暖炉は静かにパチパチと音を立て、売り物は棚にきちんと並べられている。
      frostyFinds:
        name: カラハイムの雑貨屋フロスティー
        desc: 旅人が冒険で必要とするあらゆる日用品を扱っている。
      icyGoblet:
        name: 氷の杯
        desc: 
          酒場「氷の杯」では、凍えるほど冷たい酒が惜しみなく振る舞われ、伝説が現実へと溶け出す。店内は、凍てつく冒険談を語り合う冒険者たちの笑い声で満ちている。
      frozenCapital:
        name: 凍結資本銀行
        desc: ジャーボニアで名の知れた、影響力のある銀行。凍結資本銀行が持ち物を安全に預かってくれる。
      jarvoJoy:
        name: ジャーボジョイ
        desc: 
          がっしりとした恰幅のいいドワーフが、カウンターの奥で踏み台の上に立っているようだ。顔には治りかけの傷がいくつもあり、ひげもかなり焦げている。彼の周りには、スキー板やスカイディスクをはじめ、さまざまなスポーツ用品が並んでいる。
      tutorialCabin:
        name: 助っ人のハーバートの小屋
        desc: 
          魔法の解けた森の中に、質素な小屋が建っている。いくつかの切り株と、椅子が二脚置かれた屋外のテーブルがあり、そこに男が一人座っている。テーブルの上のチェス盤をじっと見つめているようだ。
      tundraTrends:
        name: ツンドラ・トレンド
        desc: 
          ツンドラ・トレンドでは、遊び心を効かせた最新の冬のファッションを扱っている。鮮やかなマフラー、ファンキーな帽子、雪の中で目を引くカラフルなコートが並ぶ。
      polarPruning:
        name: 極地カット理容室
        desc: 
          極地カット理容室は、アズラゼラの中心にたたずむ居心地のいい理髪店だ。中に入れば、腕利きの理髪師が髪を正確に整えてくれる。壁は装飾で彩られ、店内にはマツのさわやかな香りが漂っている。
      templeOfAzurazera:
        name: アズラゼラ神殿
        desc: 
          大きな神殿には香炉の煙と聖なる言葉のささやきが満ちている。多くの者が青く揺らめく巨大な石に近づき、祈りを捧げているようだ。その大石は床からはるか上まで伸び、空そのものを貫かんばかりだ。それでいて表面はどこまでも滑らかで、力が脈打っている。
      azurazeraBank:
        name: 誓いの冷蔵金庫
        desc: 
          外の雪がなぜか入り込まない、とても清潔な銀行。たいまつの炎まで青く燃えていて、まるで青いレンズ越しに見ているかのようだ。ジャーボニア人から厚く信頼された者しか、ここに入ることは許されない。
