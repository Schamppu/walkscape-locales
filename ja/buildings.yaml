singulars:
  buildings:
    jarvonia:
      frosthookEmporium:
        name: 霜鉤大商店
        desc: 
          年季の入った海賊の女が小さくうなずいて出迎える。木の床に義足をコツコツと鳴らしながら、彼女はカウンターの奥へと滑り込む。壁にも棚にも、釣り道具がところ狭しと並んでいる。驚いたことに、壁の一つには巨大なサメの頭が飾られており、その下の名札には「ブルース」と書かれている。
      northstarMercantile:
        name: 北極星商店
        desc: 
          北極星商店は今の場所で繁盛しており、多くの人がひっきりなしに出入りしている。奥の壁の暖炉は静かにパチパチと音を立て、売り物は棚にきちんと並べられている。
      frostyFinds:
        name: カラハイムの雑貨屋フロスティー
        desc: 旅人が冒険で必要とするあらゆる日用品を扱っている。
      icyGoblet:
        name: 氷の杯
        desc: 
          酒場「氷の杯」では、凍えるほど冷たい酒が惜しみなく振る舞われ、伝説が現実へと溶け出す。店内は、凍てつく冒険談を語り合う冒険者たちの笑い声で満ちている。
      frozenCapital:
        name: 凍結資本銀行
        desc: ジャーボニアで名の知れた、影響力のある銀行。凍結資本銀行が持ち物を安全に預かってくれる。
      jarvoJoy:
        name: ジャーボジョイ
        desc: 
          がっしりとした恰幅のいいドワーフが、カウンターの奥で踏み台の上に立っているようだ。顔には治りかけの傷がいくつもあり、ひげもかなり焦げている。彼の周りには、スキー板やスカイディスクをはじめ、さまざまなスポーツ用品が並んでいる。
      tutorialCabin:
        name: 助っ人のハーバートの小屋
        desc: 
          魔法の解けた森の中に、質素な小屋が建っている。いくつかの切り株と、椅子が二脚置かれた屋外のテーブルがあり、そこに男が一人座っている。テーブルの上のチェス盤をじっと見つめているようだ。
      tundraTrends:
        name: ツンドラ・トレンド
        desc: 
          ツンドラ・トレンドでは、遊び心を効かせた最新の冬のファッションを扱っている。鮮やかなマフラー、ファンキーな帽子、雪の中で目を引くカラフルなコートが並ぶ。
      polarPruning:
        name: 極地カット理容室
        desc: 
          極地カット理容室は、アズラゼラの中心にたたずむ居心地のいい理髪店だ。中に入れば、腕利きの理髪師が髪を正確に整えてくれる。壁は装飾で彩られ、店内にはマツのさわやかな香りが漂っている。
      templeOfAzurazera:
        name: アズラゼラ神殿
        desc: 
          大きな神殿には香炉の煙と聖なる言葉のささやきが満ちている。多くの者が青く揺らめく巨大な石に近づき、祈りを捧げているようだ。その大石は床からはるか上まで伸び、空そのものを貫かんばかりだ。それでいて表面はどこまでも滑らかで、力が脈打っている。
      azurazeraBank:
        name: 誓いの冷蔵金庫
        desc: 
          外の雪がなぜか入り込まない、とても清潔な銀行。たいまつの炎まで青く燃えていて、まるで青いレンズ越しに見ているかのようだ。ジャーボニア人から厚く信頼された者しか、ここに入ることは許されない。
      bigloo:
        name: ビッグルー
        desc: 
          ビッグルーは意外なほど広々としたイグルーだ。氷にまつわる風変わりな品々と心温まるもてなしがそろっており、そのすべてを蝶ネクタイと陽気なよちよち歩きで知られる愛嬌たっぷりのペンギンの店主が取り仕切っている。
      hornOfRespiteOutpost:
        name: 冒険者ギルド出張所
        desc: 
          冒険者ギルド出張所は、冒険者たちが集まって土産話を語り合い、助言を求め、次の旅に備える場所だ。壁は地図や武器、過去の遠征の記念品で飾られている。
      fortofPermafrost:
        name: 永久凍土の砦
        desc: 
          目の前に巨大な砦がそびえている。ジャーボニアとトレリン・エルドワイズ大公国の間に建つ砦だ。この堅固な砦では、ジャーボニアの凍てつく地へ入る前にゲームをひと勝負しなければならないことで知られている。
      notAShop:
        name: 店ではない
        desc: 
          村の中で、ひときわ目を引く奇妙な建物が建っている。中に入ると、サルミアッキの入った瓶でもてなされる。壁には「WalkScape」と書かれた垂れ幕が掛かっているが、その意味はよくわからない。中はオフィスのようで、カンバンボード、スタンディングデスク、そして風鋳城製の真新しいウォーキングマシンが置かれている。
      woodcuttersCabin:
        name: きこりの小屋
        desc: 
          深い森の中の小さな空き地に、切り倒した木で作られた小屋が建っている。地面には切り株がいくつも散らばっている。それぞれの切り株のそばには、細い枝や小枝の小さな山がきちんと整えられていたり、より糸でしっかり束ねられていたりする。
      watchtowerOfWinter:
        name: 冬の見張り塔
    gdte:
      goldnGrailBilgemont:
        name: ゴールデン・グレイル・ビルゲモント店
        desc: 
          ビルゲモント港で人気の酒場チェーン。名物の料理と飲み物を金の杯で出している。この店は、客たちが身にまとう高価な香水越しにも、あたりの潮の香りが漂ってくる。
      bilgemontCastle:
        name: ビルゲモント城
        desc: 
          大きな城は豪華絢爛で、ほとんど非の打ちどころがない。石にはひび一つなく、焦げ跡も見当たらない。ここに住む統治者たちは見事な宝飾品と富で知られており、城があまりに手入れが行き届いているため、ほとんど人が住んでいないようにさえ見える。
      foodMarketStall:
        name: 食べ物の屋台
        desc: 
          食べ物の屋台の周りには、焼きたてのパンや焼き菓子のすばらしい香りが漂っている。瓶詰めや漬物もたくさん売られているようだ。ありがたいことに、シュールストレミングは置いていないらしい。
      toolMarketStall:
        name: 道具の屋台
        desc: 
          道具の屋台は古い革の布で覆われ、道具は何やらこだわりのある順番で並べられている。屋台の天井からはいくつかのランタンが下がり、ほかの道具も丁寧に結ばれたロープやかごに入れられて、商人の頭上にぶら下がっている。
      animalShelter:
        name: ワンニャン広場
        desc: 
          店内はさまざまな動物でいっぱいで、毛や鱗が色とりどりのものもいる。壁の一つには、ここにいるペットの多くは捨てられたり迷子になったりしたところを沼地から保護されたのだと説明する張り紙がある。
      bureauOfMoss:
        name: 苔の役所
        desc: 
          酒場の壁は苔と沼地をテーマにした装飾で埋め尽くされ、そうでないのは食器くらいのものだ。隅の暖炉の横には小さな池があり、何匹かのカエルがその中でくつろいでいるようだ。吟遊詩人が奇妙な楽器で穏やかな旋律を奏でている。ギターのような音だが、中に水が入っているようだ。
      fishMarketStall:
        name: 魚の屋台
        desc: 
          魚の屋台は女性が切り盛りしているようで、大きな魚や切り身が氷の上にあふれんばかりに並んでいる。ほかにも、さまざまな丸ごとの魚が詰まったかごや、餌の入ったバケツまで置かれている。
      quagmireCouture:
        name: 沼地の流行工房
        desc: 
          沼地の流行工房は、沼地をモチーフにした服を専門に扱うサルスファースのファッションブティックだ。どんな場面にもぴったりのおしゃれな服がそろっている。
      maritimeFortuneBank:
        name: 海事繁栄銀行
        desc: 
          金の縁取りに大理石の床、天井からは巨大な照明までぶら下がっている。金といくつかの宝石で作られているようで、小さな炎を通して宝石本来の色を映し出している。店員を呼ぶための呼び鈴まで金でできている。
      bogAndBlade:
        name: 沼とカミソリ理髪店
        desc: 
          沼とカミソリ理髪店は、サルスファースで一流のヘアカットを提供している。胴付き長靴をはいた理髪師たちが、ユーモアを添えて最高の身だしなみを整えてくれる。髪を整えてもらう間、座り心地のいい椅子でくつろぎながら紅茶を楽しめる。
      bogsideBankOfProsperity:
        name: 栄光のボッグサイド金庫
        desc: 
          銀行に入ると、床には苔色の敷物が敷かれていて、踏むたびにぐしゅっと音がする。梁には何匹かのカエルが潜んでいるようで、蚊を寄せつけずにいる。行員の一人が軽く会釈して出迎える。その行員の帽子の下からも時おりカエルが顔を出し、ひらひらと飛び回る大きな蛾にぱくりと食いつこうとしている。
      goldnGrailEverhaven:
        name: ゴールデン・グレイル・永楽園店
        desc: 永楽園で人気の酒場チェーン。名物の料理と飲み物を金の杯で出している。この店はなぜか、ほかの店よりも少しチーズのにおいが強い。
      mossyMerchantsBreezeMart:
        name: 苔商人のそよ風市場
        desc: 
          苔商人のそよ風市場はいくつもの窓が開け放たれ、店内を風がゆっくりと吹き抜けていく。そよ風とともに、外の物音も運ばれてくる。棚の多くは、興味深くて珍しい品々でいっぱいだ。
      witchsHut:
        name: 魔女の小屋
      halfmawOutpost:
        name: 冒険者ギルド沼地出張所
      goldnGrailBlackspell:
        name: ゴールデン・グレイル・黒魔港店
    syrenthia:
      vastalumeClothingShop:
        name: ヒレ映え衣装店
        desc: 
          スレンティア族の多くは貝殻で作った衣装を好むため、この店はかなり閑散としている。店内に並ぶ布や衣装はわずかだ。客のほとんどは、有名なマーフォークの踊り子ドレスがお目当てである。
      vastalumeGeneralStore:
        name: 沈み錨
        desc: 
          砂の上に錆びた錨が横たわっている。小さな店には棚がいくつかと、商品の入った樽が置かれている。壁の穴や割れ目からは泡が立ちのぼっている。壁に掛かった絵に描かれた山々には、見覚えがある気がする。
      vastalumeSpecializedStore:
        name: 底流ショップ
        desc: 
          入口のすぐそばにスレンティアの旗が掲げられていて、スレンティア族に信頼された者しか入れないことを示している。中には、くつろぎスペース、壁に掛けられた道具、さらには水中の盆栽まで、何でも少しずつそろっている。
      vastalumeTavern:
        name: 海の真珠
        desc: 
          床一面が砂に覆われている。カウンターの奥では、オレンジ色のタコが飲み物を混ぜたり、カップに注いだりしている。部屋の隅には、見たこともないほど大きな真珠が置かれている。
      throneOfTheNeverdrown:
        name: 溺れざる者の玉座
        desc: 
          入口では目ざといタコが見張っている。ロイヤルブルーの絨毯が玉座まで続き、玉座はうごめく何本もの触手で飾られている。玉座の間全体に不気味な空気が漂い、無害なカニにまで見張られているような気がする。
      vastalumeBank:
        name: タラサ波金庫
        desc: 大きな真っ黄色のヘビが、砂の床をするすると這っている。水中の岩壁には円形の扉があり、巨大な鍵穴の先が金庫に通じている。
      vastalumeBarber:
        name: 流れのまま理髪店
        desc: 
          ぎっしりと詰め込まれたこの理髪店には、カット台がいくつも並んでいる。客がひっきりなしに出入りしているところを見ると、バスタルームでは人気の理髪店なのだろう。
      casbrantsSunkenShip:
        name: カスブラントの沈没船
        desc: 
          船のメインマストは根元から折れている。難破船は穴と割れた板だらけで、そこから小さな泡が無数に立ちのぼっている。別の何かがここにいて、じっと見つめながら待っているような気配がする。
    wallisia:
      lostSoulsourcing:
        name: 迷える魂商会
        desc: 
          外から見てもおんぼろの店で……正直、中も同じくらいおんぼろだ。だが文字どおりのゴーストタウンに何を期待するというのか。この交易所を出入りする幽霊の町人たちが残したエクトプラズムが、あちこちに筋を描いている。
      brokenSpiritSavings:
        name: 失意の霊魂銀行
        desc: 
          銀行の朽ち果てた残骸。全盛期には立派な保管庫だったのかもしれないが、今ではただの抜け殻で、アイテムを預けることすらできない。幽霊たちには硬貨などほとんど用がないのだ。
      restoredSpiritSavings:
        name: 再起の霊魂銀行
        desc: 
          銀行に欠かせない設備が元どおりになり、建物は再び品物を預かる場所として使えるようになった。まだあちこち傷んでいるが、修理のおかげでこの店にも少し魂が戻ってきた。
      innerPeaceEats:
        name: 心やすらぎ食堂
      theFinalDeposit:
        name: 最期の預金所
    wrentmark:
      southernGem:
        name: 南の宝石
      jeweledOasisBank:
        name: 宝石オアシス銀行
        desc: 
          ウレントマークの豪華な首都銀行で、街の中でもひときわ注目を集める存在だ。建物そのものに宝石が使われており、それが外されないよう大勢の衛兵が守っている。ここなら貴重品が安全なのは間違いない。
