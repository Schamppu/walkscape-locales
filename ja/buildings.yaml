singulars:
  buildings:
    jarvonia:
      frosthookEmporium:
        name: 霜鉤大商店
        desc: 
          年季の入った海賊の女が小さくうなずいて出迎える。木の床に義足をコツコツと鳴らしながら、彼女はカウンターの奥へと滑り込む。壁にも棚にも、釣り道具がところ狭しと並んでいる。驚いたことに、壁の一つには巨大なサメの頭が飾られており、その下の名札には「ブルース」と書かれている。
      northstarMercantile:
        name: 北極星商店
      frostyFinds:
        name: カラハイムの雑貨屋フロスティー
        desc: 旅人が冒険で必要とするあらゆる日用品を扱っている。
      icyGoblet:
        name: 氷の杯
        desc: 
          酒場「氷の杯」では、凍えるほど冷たい酒が惜しみなく振る舞われ、伝説が現実へと溶け出す。店内は、凍てつく冒険談を語り合う冒険者たちの笑い声で満ちている。
      frozenCapital:
        name: 凍結資本銀行
        desc: ジャーボニアで名の知れた、影響力のある銀行。凍結資本銀行が持ち物を安全に預かってくれる。
      jarvoJoy:
        name: ジャーボジョイ
        desc: 
          がっしりとした恰幅のいいドワーフが、カウンターの奥で踏み台の上に立っているようだ。顔には治りかけの傷がいくつもあり、ひげもかなり焦げている。彼の周りには、スキー板やスカイディスクをはじめ、さまざまなスポーツ用品が並んでいる。
      tutorialCabin:
        name: 助っ人のハーバートの小屋
