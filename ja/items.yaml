          desc: 料理を焦がさないことに気を取られているうちに、鍋ややかんの間にいつの間にか現れていた大きな鋳鉄の鍋。
      tailoring:
        tailoringChest:
          name: 裁縫の宝箱
          desc: この巨大な紡錘には鍵がかかっている。こじ開ければ、役に立つ裁縫のアイテムが入っているかもしれない！
      woodcutting:
        woodcuttingChest:
          name: 伐採の宝箱
          desc: さまざまな樹皮で飾られた、美しく華やかな木の宝箱。切り倒した木の根の間に隠されていた。
        birdNest:
          name: 鳥の巣
          desc: 鳥がこしらえた巣。持ち主にはもう見つけられないだろうから、中身を確かめてみてもいいだろう。
      carpentry:
        carpentryChest:
          name: 木工の宝箱
          desc: 木工道具をあさっていて見つけた木箱。見事な細工から、腕利きの大工が作ったものだとわかる。
      agility:
        agilityChest:
          name: 俊敏性の宝箱
          desc: 運動中、すぐそばに落ちてきた茶色の革のブーツ。周りには誰もいないようだった。よく見ると、中に何かが隠されているようだ。
      trinketry:
        trinketryChest:
          name: 細工の宝箱
  consumables:
    cooking:
      bread:
        name: パン
        desc: 食品ピラミッドの土台。
      porridge:
        name: 麦がゆ
        desc: 立派な朝食だ！ほかに本当に何も見つからなければ、だが……
      saltrum:
        name: ソルトラム
        desc: 魚さえ酔わせる、強い蒸留酒。
      beer:
        name: ビール
        desc: 発酵は、火よりも偉大な発見だったのかもしれない。
      wine:
        name: ワイン
        desc: 貴族にも冒険者にも愛される美酒。杯を掲げて乾杯する者に、過去と現在の両方の味わいを約束する。
      potato:
        name: ジャガイモ
        desc: ジャ・ガ・イ・モ。
      tomato:
        name: トマト
        desc: 果物なのか、野菜なのか？
      dynamite:
        name: ダイナマイト
        desc: なんだ、このロウソクは？ディー・ナ・ミー・テイ！きっとウレントマーク産だ。
      salmonPie:
        name: サーモンパイ
        desc: パイに魚、なんてこった！
      friedFishSandwich:
        name: 魚フライのサンドイッチ
        desc: 揚げた魚をのせたサンドイッチ。小骨に注意！
      kelpRolls:
        name: 昆布巻き
        desc: スレンティアの名物料理。昆布を丁寧に正しい形に巻いて作られる。
      troutSoup:
        name: マスのスープ
        desc: かなりマスマスしいスープ。
      spicyPumpkinJuice:
        name: スパイスパンプキンジュース
        desc: 秋になると、アレヌムの人々はこの飲み物が恋しくなる。
      jarvonianPastry:
        name: ジャーボニア風ペストリー
        desc: 北の人々に愛される、温かいペストリー。
      nettleTea:
        name: イラクサ茶
        desc: 寒い場所で飲む温かい飲み物。
      schnitzel:
        name: シュニッツェル
        desc: エウェレティエンの歴史家によれば、シュニッツェルはサルスファースとグランフィディックの中間にある小さな小屋で生まれたという。
      underwaterSalad:
        name: 水中サラダ
        desc: 水中の野菜を混ぜ合わせたサラダ。格別にさっぱりしている。
      cremeBrulee:
        name: クレームブリュレ
        desc: 焦がしたクリームがこれほど美味しいことはない。エルドワイズの国民食だ。
      pancake:
        name: パンケーキ
        desc: トッピング次第で無限に楽しめる土台。
      chocolate:
        name: チョコレート
        desc: とろけるほど柔らかい、美味しいミルクチョコレートの大きな板。ひと口ごとに舌の上で溶けていく。
      mushroomCurry:
        name: キノコカレー
        desc: 香辛料とキノコの香り高い組み合わせ。しっかり食べたいときにぴったりだ。
      jellySandwich:
        name: ジャムサンドイッチ
        desc: 甘いジャムをたっぷり挟んだサンドイッチ。年齢を問わず愛される定番だ。
      sweetCarrotPie:
        name: 甘いニンジンパイ
        desc: パイにニンジン、なんてこった！
      bagel:
        name: ベーグル
        desc: 穴の空いたパン。実のところ、砂糖抜きのドーナツにすぎない。
      chocolateMilk:
        name: チョコレートミルク
        desc: ミルクにチョコレートを入れる魔法を最初に見つけたのは、ハーフリングだった。
      egg:
        name: 卵
        desc: 太古の昔から、数えきれないほどのレシピに使われてきた卵。
      mudPie:
        name: 泥だんご
        desc: 泥と想像力から作られた、素朴で土の香りのするおやつ。
      pickles:
        name: ピクルス
        desc: いちばん酸っぱいおやつ。
      fortifiedWine:
        name: 酒精強化ワイン
      roastedBellPepper:
        name: ローストパプリカ
      jerky:
        name: ジャーキー
        desc: 塩漬けにして干した、大きな肉の切れ端。傷みにくく、長旅の良いタンパク源になる。
      veggieSoup:
        name: 野菜スープ
        desc: 一杯の野菜スープ。質素ながら満足感があり、アレヌムの多くの人々に親しまれている。
      baconWeave:
        name: ベーコン編み
      cookedMeat:
        name: 調理済みの肉
      fireballWine:
        name: 火球ワイン
      beefStew:
        name: ビーフシチュー
      tastyBreakfast:
        name: ごちそう朝食
      friedNoodles:
        name: 焼きそば
      fruitCake:
        name: フルーツケーキ
      crabRolls:
        name: カニロール
    cookedFish:
      cookedShrimp:
        name: 調理済みのエビ
        desc: 柔らかくてみずみずしい、極上の海の幸。繊細な風味と、ほのかな甘みがある。
      cookedShark:
        name: 調理済みのサメ
        desc: 引き締まった食感と、力強くやや癖のある風味。網焼きから煮込みまで、さまざまに調理できる万能な魚だ。
      cookedPerch:
        name: 調理済みのパーチ
        desc: フライパンで焼いても網で焼いても、ほろりとほぐれる身と、穏やかでほのかに甘い味わいが楽しめる。軽い食事にぴったりだ。
      cookedCarp:
        name: 調理済みのコイ
        desc: 調理しても穏やかな風味はそのまま。焼いても揚げても、さまざまな料理に使える。柔らかな身は、料理人の腕の見せどころだ。
      cookedSalmon:
        name: 調理済みのサケ
        desc: バターのようになめらかな身と濃厚な風味を持つ、贅沢なごちそう。魚介好きに人気の一品だ。
      cookedSwordfish:
        name: 調理済みのメカジキ
        desc: ほのかに甘い風味。香ばしい焼き目をつけるため網焼きや強火で焼かれることが多く、ミディアムレアで食べるのが一番だ。
      cookedPike:
        name: 調理済みのカワカマス
        desc: 網焼きでも焼き目をつけても、ほろりとほぐれる身と、穏やかでほのかに甘い味わいが楽しめる。いろいろな料理に使える万能な魚だ。
      cookedTrout:
        name: 調理済みのマス
        desc: マスだ。
      cookedLobster:
        name: 調理済みのロブスター
        desc: みずみずしく旨みたっぷりの身。硬い殻と力強いハサミが、どこか懐かしさを誘う。定番の魚介料理だ。
      cookedJellyfish:
        name: 調理済みのクラゲ
        desc: 独特の珍味に生まれ変わったクラゲ。不思議な食感とほのかな海の風味で、好みが分かれる一品だ。
      cookedSquid:
        name: 調理済みのイカ
      cookedLargemouthBass:
        name: 調理済みのオオクチバス
      cookedAnglerfish:
        name: 調理済みのアンコウ
      cookedStingray:
        name: 調理済みのエイ
    memosphere:
      agilityMemosphere:
        name: 俊敏性の経験値オーブ
        desc: ガラス玉の中に、レースのゴールラインを駆け抜けた記憶が見える。
      carpentryMemosphere:
        name: 木工の経験値オーブ
        desc: ガラス玉の中に、製材所で美しい家具を作り上げた記憶が見える。
      fishingMemosphere:
        name: 釣りの経験値オーブ
        desc: ガラス玉の中に、漁師たちを驚かせた記録級の大物を釣り上げた記憶が見える。
      foragingMemosphere:
        name: 採集の経験値オーブ
        desc: ガラス玉の中に、満開のベリーの茂みを見つけた記憶が見える。
      miningMemosphere:
        name: 採掘の経験値オーブ
        desc: ガラス玉の中に、豊かな鉱脈を掘り当てた記憶が見える。
      smithingMemosphere:
        name: 鍛冶の経験値オーブ
        desc: ガラス玉の中に、恐るべき武器と頑丈な鎧を鍛え上げた記憶が見える。
      woodcuttingMemosphere:
        name: 伐採の経験値オーブ
        desc: ガラス玉の中に、斧で大木を切り倒した記憶が見える。
      craftingMemosphere:
        name: クラフトの経験値オーブ
        desc: ガラス玉の中に、作業台でいじくり回し、ついに見事な品を作り上げた記憶が見える。
      huntingMemosphere:
        name: 狩りの経験値オーブ
        desc: ガラス玉の中に、獲物の足跡を追った記憶が見える。
      tailoringMemosphere:
        name: 裁縫の経験値オーブ
      cookingMemosphere:
        name: 調理の経験値オーブ
        desc: ガラス玉の中に、大きな鍋でみんなのために食べごたえのあるスープを作った記憶が見える。
      trinketryMemosphere:
        name: 細工の経験値オーブ
    misc:
      driedFruit:
        name: ドライフルーツ
      nutMix:
        name: ミックスナッツ
  looted:
    skilling:
      fishing:
        rustyFishingNet:
          name: 錆びた漁網
          desc: 錆びつき、ほつれた小さな漁網。今でも漁には使えるので、ないよりはましだ。
        rustyFishingRod:
          name: 錆びた釣り竿
          desc: 
            古くてボロボロの釣り竿で、錆びついたうえに糸もかろうじてつながっている程度。今でも釣りには使えるが、アタリすら来ないかもしれない！
        catchBucket:
          name: 釣果バケツ
          desc: 釣り上げたばかりの獲物を入れておく、ほどよい大きさのバケツ。
        squishyFlipFlops:
          name: ぷにぷにビーチサンダル
          desc: 柔らかな布の層が足と焼けた砂のあいだの盾となり、ウレントマークのどれほど暑い浜辺でも平気だ。
        frozenBait:
          name: 冷凍餌
          desc: 大きな魚をおびき寄せる、ちっぽけな小魚だ。どこかに教訓が隠れていそうだが……
        sturdyFishingRodRest:
          name: 頑丈な竿掛け
          desc: 地面に突き刺して釣り竿を支え、水中の仕掛けの位置を保てる。辛抱が尽きかけたときに便利だ。
        coolSunglasses:
          name: かっこいいサングラス
          desc: とてもおしゃれなサングラスで、夕暮れの浜辺での釣りがぐっと快適になる。
        breezyShirt:
          name: 風通しのいいシャツ
          desc: この軽いシャツを着れば、どんな浜辺でも目立つこと間違いなしだ。
        eyePatch:
          name: 眼帯
        fishermansHat:
          name: 漁師の帽子
          desc: この帽子は、釣り人の忍耐と、絶え間なく流れる自然とのつながりを象徴している。
        babyPenguinIceLure:
          name: 子ペンギンの氷ルアー
          desc: 生きたルアーとして釣りを手伝うことに同意してくれた子ペンギン。その使命は明確で、極上の魚だけを見つけてくることだ。
        iceNetRod:
          name: 氷の網竿
          desc: 投げ込む糸に氷のような網が絡めてある釣り竿。上質な魚をできるだけ多く獲るために、ペンギンたちが考え出した巧みな仕組みだ。
        fishermansTrousers:
          name: 漁師のズボン
          desc: 丈夫な防水素材で作られており、風雨から身を守りつつ、軽快に動ける。
        wadingShoes:
          name: ウェーディングシューズ
          desc: この軽い靴は、釣りの冒険にうってつけだ。
        fishingGuidebook:
          name: 釣りのガイドブック
          desc: この本にはさまざまな魚の絵が載っており、それぞれに合った餌やルアーが紹介されている。
        shinySpinner:
          name: ピカピカのスピナー
          desc: 魚を捕るためのものではないが、ハンドスピナーとしてなら使える。
        anglerGloves:
          name: 釣り人の手袋
          desc: 本当に実在したのだ！指先が光る伝説の手袋で、その魅力であらゆる獲物を引き寄せる。
        tripleRodRest:
          name: 三本竿掛け
          desc: この竿掛けは釣り竿を3本支えられるが、なぜか一度に2本以上の竿は扱えない。まあ、シカの角のようで見た目は悪くない。
        bugBait:
          name: 虫餌
          desc: 虫は魚の夕食になり、魚は自分の夕食になる。では、自分は誰の夕食になるのだろう？
        pirateHat:
          name: 海賊帽
        fishingStringer:
          name: ストリンガー
      carpentry:
        simpleSaw:
          name: 簡素なのこぎり
          desc: もっといいものが手に入るまでは、十分に切れるのこぎりだ。
        woodworkingGlasses:
          name: 木工用メガネ
          desc: このメガネをかけると、あらゆる板材に秘められた複雑な模様と物語が見えてくる。
        compressedCharcoal:
          name: 圧縮木炭
          desc: 厚みのある木炭のかけらで、寸法を測ったり切ったりする際に木に印をつけるのにぴったりだ。
        protectiveGloves:
          name: 保護手袋
          desc: のこぎりで指を切り落とす可能性は、0%に減らしておくに越したことはない。
        simpleRuler:
          name: ぺらぺらの定規
          desc: 木の定規で、大工の道具箱には欠かせない。ものを測ったり、まっすぐな線を引いたりできる。
        protractor:
          name: 分度器
          desc: 角度を測る道具で、木工仕事でよく使われる。
        preciseRuler:
          name: 精密な定規
          desc: 目盛りが木にきれいに刻まれており、センチとインチの両方が表示されている。
        protectiveGlasses:
          name: 保護メガネ
          desc: このメガネが、高速で飛んでくるものから目を守ってくれる。たぶん。
        handsaw:
          name: 手のこぎり
          desc: このこぎりは職人と自然の調和を体現しており、木を正確かつ優美に形作れる。
        protectiveShirt:
          name: 保護シャツ
          desc: このシャツには保護パッドが縫い付けられている。
        protectivePants:
          name: 保護ズボン
          desc: このズボンには保護パッドが縫い付けられている。
        dullChisel:
          name: なまくらノミ
          desc: 木の柄となまくらな鋼の刃が付いているが、それでも美しい作品を生み出せる。
        carpentersClogs:
          name: 大工の木靴
          desc: 熟練の技で削り出された木靴。一歩ごとに、作り手のひたむきさを伝えるような音が響く。
        iceSaw:
          name: 氷切り
          desc: 氷を切るのにぴったりで、イグルーを作りたいならとても便利な道具だ。
        goldenChisel:
          name: 金のノミ
          desc: 金のなる木ならぬ、金のなるノミがあったとは。
        sharpChisel:
          name: 鋭いノミ
          desc: 彫刻や成形に使う鋭い道具。
        hookhat:
          name: フック帽
      agility:
        birchSkis:
          name: シラカバのスキー板
          desc: 初心者用のスキー板。操作しにくく、あまり速くないが、雪の斜面を歩くよりは早く下りられる。
        oakSkis:
          name: オークのスキー板
          desc: 重いスキー板で、そのぶんスピードは出るが曲がりにくい。少なくとも頑丈なので、転んでも簡単には折れない！
        simpleTorch:
          name: 簡素なたいまつ
          desc: 木の棒と布、それに燃えやすいものがあれば、持ち運べる明かりの出来上がり。これ以上簡単なものはない。
        goldenFrisbee:
          name: 金のスカイディスク
          desc: 金メッキにすぎないので、かなり軽いが丈夫だ。投げたら虹色の軌跡が出ることを期待してしまうが、残念ながら出ない。
        toughRope:
          name: 丈夫なロープ
          desc: この頑丈なロープがあれば、どんなに高い山でも登れる。
        walkingStick:
          name: ウォーキングステッキ
          desc: 握りやすい金属の持ち手が付いた頑丈な木製のステッキ。歩く冒険の支えになってくれる。
        clayFrisbee:
          name: 粘土のスカイディスク
          desc: かなり重くて壊れやすい。近くにクレー射撃をしている人がいないことを祈ろう！
        pineSkis:
          name: マツのスキー板
          desc: 頑丈で軽いスキー板。避けようとしているまさにその木から作られている。
        medievalSneakers:
          name: 中世のスニーカー
          desc: 一歩ごとに、静かで軽やかな足取りをもたらす。古代と現代の世界をまたぎ、時代の隔たりに橋を架ける一足だ。
        waterBottle:
          name: 水筒
          desc: 新鮮できれいな飲み水を満たしたガラス瓶。水分補給を忘れずに！
        runningShorts:
          name: ランニングショーツ
          desc: 着心地がよくて履きやすい！鮮やかな青色なので、周りからも目立つ。
        mapOfArenum:
          name: アレヌムの地図
          desc: アレヌムの地図。手持ちの詳細な地図を書き込むほど、既知の世界の全体像が広がる。
        runningShirt:
          name: ランニングシャツ
          desc: 走りに出かけるときは、きちんとした服装がとても大事だ。こんなシャツは欠かせない。
        simpleRope:
          name: 簡素なロープ
          desc: ロープには多くの使い道がある。たとえば登山だ。
        parkourGloves:
          name: パルクールの手袋
          desc: この手袋はグリップ力を800%向上させる。少なくとも、ラベルにはそう書いてある。
        mapOfJarvonia:
          name: ジャーボニアの地図
          desc: ジャーボニア大陸の土地と都市が描かれている。
        toeShoes:
          name: 五本指シューズ
          desc: 足の指一本一本を入れる場所がある靴。見た目より機能を優先した典型だ。
        ironThermos:
          name: 鉄の魔法瓶
          desc: 
            コーヒー、牛乳、ワイン、ブランデーなど、思いつくかぎりのどんな液体でも入れられ、いくつか混ぜることもできる。あるいは水を入れて、遠征から無事に帰ってくることもできる。
        mapOfHalfling:
          name: ハーフリング反乱軍の地図
          desc: 大きな地図から破り取られた中央の一片で、ハーフリング反乱軍の地域が詳しく描かれている。
        mapOfTrellin:
          name: トレリンの地図
          desc: 大きな地図から破り取られた西側の一片で、トレリン地方が詳しく描かれている。
        stepring:
          name: ステップリング
          desc: 血のつながらない指輪。いわゆるステップファミリーだ。
        exerciseHeadband:
          name: 運動用ヘッドバンド
          desc: 
            このヘッドバンドは、強さはひたむきな努力から生まれること、そして心の中の戦士はどんなに途方もない試練でも乗り越えられることを思い出させてくれる。
        mapOfErdwise:
          name: エルドワイズの地図
          desc: 大きな地図から破り取られた東側の一片で、エルドワイズ地方が詳しく描かれている。
        grapplingHook:
          name: 鉤縄
          desc: ロープの先に、四つ又の金属の鉤が付いている。
        mapOfSyrenthia:
          name: スレンティアの地図
          desc: スレンティア一帯の、波の下にある都市と地域が詳しく描かれている。
        featherCape:
          name: 羽根のマント
        mountaineeringGuidebook:
          name: 登山のガイドブック
        flowyTrousers:
          name: ゆったりズボン
      crafting:
        simpleWrench:
          name: 簡素なレンチ
          desc: 駆け出しの職人にぴったりの道具。
        simpleChisel:
          name: 簡素なノミ
          desc: この道具があれば、わずかな手間賃で世界を形作れる。
        craftingPants:
          name: クラフトのズボン
          desc: ゆったりしたズボンで、クラフトの腕をより快適に振るえる。
        slideRuler:
          name: 計算尺
          desc: 高度な機械式計算器で、複雑な計算を可能にし、作品の開発を助けてくれる。
        craftingShirt:
          name: クラフトのシャツ
          desc: 職人にふさわしいシャツ。汚れが落ちやすく、クラフト道具でつきがちな傷にもかなり強い。
        wireSaw:
          name: ワイヤーソー
          desc: 
            このこぎりはワイヤーを使い、石、木、ガラス、コンクリート、金属などの硬い素材を機械的に切断する。ワークショップでの効率を上げるのにぴったりだ。
        craftingBoots:
          name: クラフトのブーツ
          desc: 分厚い靴底が付いており、ワークショップで何時間も歩き回っても平気だ。
        adjustableWrench:
          name: モンキーレンチ
          desc: ブレメルシア産の高級鋼だけで作られており、まず壊れることはない。
        craftingGuidebook:
          name: クラフトのガイドブック
          desc: 果てしない創造力が詰まったクラフトのガイドブック。何世代にもわたって職人や発明家たちが受け継いできた、知識の宝庫だ。
        grippyGloves:
          name: グリップ手袋
          desc: この手袋は世界をしっかりつかんでくれる。ネジや小さな部品を一度も落とさなくなるといううわさだ。
        carvingKnife:
          name: 彫刻ナイフ
        modifiedPlatformShoes:
          name: 改造厚底靴
          desc: 気分しだいで高さを変えられる調節式の靴。これまで手の届かなかった棚の上の物を取るのに大活躍する。
        candlehat:
          name: ろうそく帽
      mining:
        iceAxe:
          name: 氷の斧
          desc: 触れると焼けつくように痛い。手袋をはめること！
        rustyPickaxe:
          name: 錆びたツルハシ
          desc: かつては見事なツルハシだったが、すっかり錆びついている。今でも採掘には使えるが、この状態ではうまく掘れない。
        fingerpick:
          name: フィンガーピック
          desc: いちばん小さな石のための、いちばん小さなツルハシ。
        goldPan:
          name: 砂金皿
          desc: 石と水を入れてぐるぐる回せば、金の塊が姿を現す。
        simpleGoldPan:
          name: 簡素な砂金皿
          desc: この皿があれば、川で金を見つけやすくなる。
        steelToeBoots:
          name: 鋼先芯のブーツ
          desc: トロッコに足の指を潰されるどころか、このブーツならトロッコのほうを脱線させてしまう。
        handLantern:
          name: 手提げランタン
          desc: 予備のマッチを持ってきているといいのだが。洞窟の奥深くでろうそくが消えたら、一巻の終わりだ。
        simpleMiningShovel:
          name: 軽量の採掘シャベル
          desc: これで鉱石だらけの地面から瓦礫を少し取り除けば、貴重な鉱物を見つけやすくなる。
        minersMagnet:
          name: 鉱夫の磁石
          desc: 岩壁に隠れた貴金属を探すのに、とても役立つ。
        miningHelm:
          name: 採掘ヘルメット
          desc: 地中深くを照らす道しるべ。採掘ヘルメットは安定した光を放ち、地下世界の闇を貫く。
        miningCartpack:
          name: 採掘トロッコパック
          desc: 背負えるように改造されたトロッコ。まさに革新を前へと押し進める発明だ。
        minersShirt:
          name: 鉱夫のシャツ
          desc: よく目立つシャツ。採掘洞窟の迷路で案の定迷子になったとき、すぐに見つけてもらえる。
        minersPants:
          name: 鉱夫のズボン
          desc: 膝にパッドが入っているので、足元の鉱石を掘りながら膝をついても痛くならない。
        simpleMagnet:
          name: 簡素な磁石
          desc: これで釣りもできるが、魚は期待しないこと。
        minersBeard:
          name: 鉱夫のひげ
          desc: ひげのない鉱夫など、本当に鉱夫と呼べるだろうか？
        heavyPickHandle:
          name: 重いツルハシの柄
          desc: ツルハシに取り付けられる、特に重量のある柄。
        shovelAxe:
          name: シャベル斧
          desc: 地中に埋もれた秘密を掘り起こし、降りかかる危険から身を守りたい冒険者にとって、欠かせない相棒だ。
      woodcutting:
        rustyHatchet:
          name: 錆びた手斧
          desc: かつては見事な手斧だったが、すっかり錆びついている。今でも伐採には使えるが、全盛期はとうに過ぎている。
        lumberjackSandals:
          name: きこりのサンダル
          desc: 
            このつま先の開いた靴を履くと、自然とのつながりをより強く感じられる。まるで周囲のエネルギーが足から心臓へと伝わってくるかのようだ。
        lumberjackBoots:
          name: きこりのブーツ
          desc: 耐久性と実用性を兼ね備えたきこりのブーツは、魔法の森（あるいは魔法の解けた森）の奥地に挑む者たちに愛用されている。
        lumberjackPants:
          name: きこりのズボン
          desc: 夜はぐっすり眠り、昼はしっかり働くきこりのためのズボン。なかなかOKな一着だ。
        logBasket:
          name: 丸太かご
          desc: 持ち手の付いた木製の台。丸太を運ぶのにぴったりだが、ほかのアイテムにも使える。たとえば、別の丸太かごとか。
        lumberjackHat:
          name: きこりの帽子
          desc: 伐採の冒険にふさわしい帽子。
        heavyAxeHandle:
          name: 重い斧の柄
          desc: 斧に取り付ける頑丈な柄。
        logSplitter:
          name: 薪割り斧
          desc: 刃が幅広いため、丸太を割るのに効果的だ。
        forestersPants:
          name: 森番のズボン
          desc: この緑のズボンは、小枝や枝による擦り傷やひっかき傷に耐えられるよう作られている。
        forestersFlannelShirt:
          name: 森番のネルシャツ
          desc: この緑のネルシャツは暖かく快適だ。自然の奥深くでの作業によく合う。
        forestersHat:
          name: 森番の帽子
          desc: 羊毛の裏地が付いたこの緑の帽子は、冬の天候にぴったりだ。
        forestersBoots:
          name: 森番のブーツ
          desc: このブーツはほぼ完全な防水仕様だ。丈夫でおしゃれでもある。
        lumberjackShirt:
          name: きこりのシャツ
          desc: 頑丈なチェック柄で、風雨を防ぐ盾であると同時に、きこりのたくましさの証でもある。
        woodcuttingGuidebook:
          name: 伐採のガイドブック
          desc: この本には、あらゆる地で見られるさまざまな木の絵が載っている。
      tailoring:
        safetyScissors:
          name: 安全はさみ
          desc: 正しい使い方を覚えるまで手を切らないよう、刃をあまり鋭くしていないはさみ。
        markingChalk:
          name: 印つけチャコ
          desc: 布用の、時間がたつと消える印つけチャコ。生地を傷めずに正確な線を引ける。
        simpleSewingNeedle:
          name: 簡素な縫い針
          desc: 基本的な縫い物に使える、ごく簡素な針。
        precisionPins:
          name: 精密待ち針
          desc: 鋭い待ち針。形を整えているあいだ、どんなに言うことを聞かない素材でもずれないよう押さえてくれる。
        practicePins:
          name: 練習用の待ち針
          desc: 布をしっかり留められて、うっかり自分に刺さることも少ない待ち針。
        fabricCuttingMat:
          name: 高耐久の布用カッティングマット
          desc: 作業に没頭するあいだ、切り損じも落ちてくる待ち針もすべて受け止めてくれるマット。
        clingyMeasuringTape:
          name: くっつくメジャー
          desc: 当てた面に何にでも張りつくらしいメジャー。採寸にぴったりで、自分の体を測るときにも使える。
        keenEyeLenses:
          name: 鋭眼レンズ
          desc: 裁縫に使う植物を見つけやすくなるといわれるレンズ。少なくとも、流行る前から目をつけていたように見せてはくれる。
        tailorsMoccasins:
          name: 仕立て屋のモカシン
          desc: 皮で作られた丈夫な履物で、待ち針や縫い針から足を守ってくれる。これさえあれば、針のむしろも怖くない。
        silverScissors:
          name: 銀のはさみ
          desc: よく切れる銀のはさみ。布も素材もすいすい切り進める。
        sewingGuidebook:
          name: 裁縫のガイドブック
        needlecase:
          name: 底なしの針入れ
        pincushionBeret:
          name: 針山ベレー帽
      smithing:
        simpleHammer:
          name: 簡素なハンマー
          desc: ごく普通のハンマー。鋼の頭と木の柄が付いている。確かに簡素だが、ハンマーがないよりはましだ。
        forgeBellows:
          name: 鍛冶場のふいご
          desc: 鍛冶場に空気を送り込み、文字どおり熱を上げるために使う。
        jarvonianPoker:
          name: ジャーボニアのポーカー
          desc: カードゲームではなく、火かき棒だ。服は脱がなくていい。
        smithsPants:
          name: 鍛冶師のズボン
          desc: かなり暑いが、一日中炉の前にいても脚が焼けずに済む。
        metalworkingGloves:
          name: 金属加工の手袋
          desc: これをはめていれば、燃え盛る炉に手を突っ込んでも水ぶくれはできない。もっとも、腕のほうはそうはいかないが。
        wolfJawTongs:
          name: 狼あごのトング
          desc: これを使えば、湯気の立つほど熱い金属も扱える。このアイテムの製作にあたり、狼は一匹も傷つけられていない。
        smithsApron:
          name: 鍛冶師のエプロン
          desc: 鍛冶場で身を守るエプロン。耐久性と職人技の結晶だ。
        smeltingGoggles:
          name: 製錬ゴーグル
          desc: 溶けた金属の焼けつくような輝きを、目を傷めずに見つめられるゴーグル。
        blacksmithsHandbook:
          name: 鍛冶のガイドブック
          desc: この本にはさまざまな鍛冶場やハンマー、ふいごの絵が載っている。鍛冶の技術がとても詳しく解説されている。
        fireResistantCloak:
          name: 耐火マント
          desc: 特に飛び散る火花から、火が燃え移るのを防いでくれる。ただし、周囲から向けられる視線までは防げない。
        jarvonianSmithsHammer:
          name: ジャーボニアの鍛冶ハンマー
          desc: 氷のような青色をした長柄のハンマー。一振りごとにさらに力を込められる。
        meltdownMask:
          name: メルトダウンマスク
          desc: 鍛冶場にうってつけのマスク。視界がずっとよくなり、加工中の金属をほとんど本能的に引き寄せる力がある。
      cooking:
        florasSilverSpoon:
          name: フローラの銀のスプーン
          desc: 特別な銀のスプーン。フローラがいつかキッチンでなくしたのだろう。今やこちらのものだ！
        simplePan:
          name: 簡素なフライパン
          desc: 焦げつき防止加工はないが、いざという時には役に立つ。
        chefsHat:
          name: コック帽
          desc: この風変わりな帽子は台所の魔法を呼び込むようで、フライ返しを振るたびに料理の奇跡を生み出す。
        sharpKnife:
          name: 鋭いナイフ
          desc: 素朴な木の持ち手が付いており、刃は最近研がれたばかりのようだ。
        dullKnife:
          name: なまくらナイフ
          desc: なまくらナイフほど危ないものはない。……と、よく言われる。
        ovenMittens:
          name: オーブンミトン
          desc: ほどよく温かいが、これが必要になるものほど熱くはない。
        cuttingBoard:
          name: まな板
          desc: 肉や果物、野菜を刻むための四角い木の板。
        flippySpatula:
          name: くるくるフライ返し
          desc: ただのフライ返しではない。くるくるフライ返しだ。1回ひっくり返すあいだに何回転させられるだろう？
        sturdyWhisk:
          name: 頑丈な泡立て器
          desc: 鋼のワイヤーが滑りにくい持ち手にしっかり固定されていて、これなら卵を何千個でも泡立てられそうだ。
        chefsLegApron:
          name: コックの脚エプロン
          desc: 脚に着けるエプロンで、キッチン道具を入れるポケットが付いている。
        nonSlipShoes:
          name: 滑り止めの靴
          desc: おしゃれとは言いがたいが、グリップ力は抜群で、すってんころりんも減る。
        largePot:
          name: 大きな鍋
          desc: 鋼でできていて、十数人分の料理が入るほど大きい。
        chefsApron:
          name: コックのエプロン
          desc: このエプロンがあれば、どの食事も傑作に、どの料理も芸術作品になる。
        meatCleaver:
          name: 肉切り包丁
          desc: 鋭い鋼の刃で、肉を細かく切り分けられる。気をつけないと、指も細かくなる。
        eberhartCorkscrew:
          name: エーベルハルトのコルク抜き
        northernSpices:
          name: 北方の香辛料
          desc: この香辛料の強い香りでお腹がぐうぐう鳴る。隠密任務の最中だったら、失敗間違いなしだ。
        recipeBook:
          name: レシピ本
          desc: この本には何百ものレシピが載っており、ジャーボニア料理からリド・ラダック料理まで、想像しうるあらゆる料理を網羅している。
        spiceRackpack:
          name: スパイスラックパック
      foraging:
        compassNecklace:
          name: 発見のアミュレット
          desc: 首に結べる紐が付いた、ちゃんと使えるコンパス。使い方さえわかれば、いつでも家に帰る道が見つかる。
        smallSack:
          name: 小さな袋
          desc: 持ち歩ける小さな麻袋で、アイテムを1つ余分に入れられる。
        rustySickle:
          name: 錆びた鎌
          desc: かつては見事な鎌だったが、すっかり錆びついている。今でも採集には使えるが、昔ほどの切れ味はない。
        halflingsFeetSlippers:
          name: ハーフリングの足スリッパ
          desc: ハーフリングの毛深い足をまねた、暖かくて愛らしいスリッパ。小さな足の指や遊び心あふれる細部まで再現されている。
        waterproofBoots:
          name: 防水ブーツ
          desc: カナリアのように黄色い長靴で、靴下を乾いたまま保ってくれる。濡れた靴下ほど不快なものはそうない。
        dullMachete:
          name: なまくらマチェーテ
          desc: 刃はひどい状態で、まるでいくつもの森をこれで切り開いてきたかのようだ。
        longSpade:
          name: 長いスコップ
          desc: 頑丈な木の柄とステンレス鋼の刃を備えた、どっしりしたスコップ。これなら大きな穴も掘れるだろう。
        wildernessGuideBook:
          name: 荒野のガイドブック
          desc: 動物、植物、水源などを網羅した、荒野で生き抜くための知恵が詰まっている。
        sharpMachete:
          name: 鋭いマチェーテ
          desc: 剃刀のように鋭い刃のおかげで、生い茂る草木をかき分けて進むのも朝飯前だ。
        foragingShirt:
          name: 採集のシャツ
          desc: 暑い場所で採集するときは涼しく、寒い場所では暖かく保ってくれる。
        foragingShorts:
          name: 採集のショートパンツ
          desc: 丈夫で快適なショートパンツ。どんな地形での採集にもぴったりだ。
        nonWaterproofBoots:
          name: 非防水ブーツ
          desc: 採集中の風や険しい地形からはある程度守ってくれるが、足が濡れない保証はない。
        pickersGloves:
          name: 摘み手の手袋
          desc: 着け心地のよい革の手袋。草木に隠れた宝を探すとき、トゲやそのほかの自然の防衛機構から手を守ってくれる。
        bigBasket:
          name: でかいかご
          desc: 籐で美しく編まれている。採集で見つけたものを楽々すべて入れられる。
        camouflageCape:
          name: 葉っぱのマント
          desc: 葉っぱだけで作られたマントで、採集にどっぷり没頭できる。燃えやすそうだが、葉っぱりやめられない。
        pointyShears:
          name: 尖った剪定ばさみ
          desc: これを使えば、茂みや草木にすっかり覆われてしまった宝が見つかるかもしれない。
        wildernessPants:
          name: 荒野のズボン
          desc: 自然の中を四つん這いで探し回っても平気なように作られた、緑のズボン。
        wildernessShirt:
          name: 荒野のシャツ
          desc: 着心地のよい緑のシャツに赤いネッカチーフを合わせた一着で、自然と一体になった気分になれる。
        gardeningGloves:
          name: 園芸用の手袋
          desc: 滑りにくく水を通さない手袋で、植え付け、水やり、剪定、草取りなど、あらゆる園芸作業にぴったりだ。
        simpleBugCatchingNet:
          name: 簡素な虫取り網
          desc: 大したものではないが、虫は捕れる。
        hatWithAFeather:
          name: 羽根つき帽子
          desc: この帽子は冒険心と遠い地への憧れを呼び起こす。どこでかぶろうとも、大胆な冒険譚が必ずついてくるだろう。
        blueIceSickle:
          name: 青氷の鎌
      hunting:
        skinnyFieldKnife:
          name: 細身のフィールドナイフ
          desc: 仕留めたばかりの獲物の皮をはいだり、さばいたりするのに使える細いナイフ。
        camoFacePaint:
          name: 迷彩フェイスペイント
          desc: 顔に塗っても肌が荒れにくいはずの迷彩塗料。見えにくいので、どうせ目に入ってしまうだろう。
        trappersCape:
          name: 罠師のマント
          desc: 厚手のマント。周囲の生き物から気配を少し隠し、罠にかかりやすくしてくれる。
        scentMaskingSpray:
          name: 匂い消しスプレー
          desc: 吹きかけると匂いを隠せる瓶入りの液体。中身が何かは聞かないでおく。
        huntingBestiary:
          name: 狩猟図鑑
          desc: 獣や小動物、あらゆる奇妙な生き物を収めた大きな書物。挿絵や解説、習性、生息地を記した貴重なページがぎっしり詰まっている。
        camoBoots:
          name: 迷彩ブーツ
          desc: 履けば足元が周囲の景色に溶けこむ迷彩ブーツ。残念ながら脱いでいるときは、なぜか片方をなくしがちだ。
        camoPants:
          name: 迷彩パンツ
          desc: 茂みや周囲の景色に脚を紛れこませる迷彩パンツ。礼服と間違えないように。
        camoShirt:
          name: 迷彩シャツ
          desc: ほとんどどんな場所でもうまく身を隠せる迷彩シャツ。なぜか雪の中でもよく効く。
        flashyFieldKnife:
          name: 派手なフィールドナイフ
          desc: 狩りの旅でどんな仕事を任せても、きっちりこなしてくれそうな優れたフィールドナイフ。
        duckDecoy:
          name: カモのデコイ
        huntingTripPack:
          name: 狩猟旅行用リュック
      trinketry:
        roughSandpaper:
          name: 粗い紙ヤスリ
          desc: 強く握りすぎると、この粗い紙ヤスリで手の皮がむけそうだ。
        prettyPliers:
          name: おしゃれなペンチ
          desc: エルドワイズで大人気！本日は細工工場にて10パーセント引きのセール中。
        gemTippedTweezers:
          name: 宝石付きのピンセット
          desc: 先端を小さな宝石のかけらで補強したピンセット。
        zipPouch:
          name: ジッパーポーチ
          desc: 高品質な宝石を作業台から市場まで安全に運べるポーチだ。
        handFile:
          name: 手になじむ手ヤスリ
    versatile:
      lifeVest:
        name: ライフジャケット
        desc: このジャケットの使命は命を守ること。守護天使だと思えばいい。
      herbertsCape:
        name: ハーバートのマント
        desc: 少しほこりをかぶっていて、ハーバートが長いこと使っていないのがわかる。第二の人生を与えてやれるかもしれない。
      herbertsHat:
        name: ハーバートの帽子
        desc: 耳まで温めてくれる茶色の毛糸帽。古いのではない、ヴィンテージなのだ。
      herbertsShirt:
        name: ハーバートのシャツ
        desc: 赤い長袖のシャツで、襟は立てられる。ボタンがいくつか取れているが、とりあえず着られはする。
      fishingLure:
        name: ルアー
        desc: 腕利きの職人による手作りで、日差しを受けると虹色の鱗のように色と模様がきらめく。
      warmBeanie:
        name: 暖かいニット帽
        desc: 霜に強い糸で編まれており、暖炉の火にやさしく抱きしめられるように頭を包みこむ。
      rustyDivingHelm:
        name: 錆びた潜水ヘルメット
        desc: 古くて錆びてはいるが、この潜水ヘルメットは潜水に使えそうだ。
      rustyDivingBody:
        name: 錆びた潜水胴衣
        desc: 古い潜水服の上半身部分。着ると重い。
      warmJacket:
        name: 暖かいジャケット
      herbertsBoots:
        name: ハーバートのブーツ
        desc: よく履きこまれた革のブーツ。少し磨いたほうがよさそうだが、作業用としては十分だ。
      herbertsPants:
        name: ハーバートのズボン
        desc: 古いジーンズで、ワンサイズ大きい。幸い革のベルトがついているので問題ない。
      zippyKicksled:
        name: 快速キックスレッド
      simpleLifeVest:
        name: 簡素なライフジャケット
        desc: カヤックにうってつけ。ふくらませるための吹き口がついている。
      trustyTent:
        name: 頼れるテント
        desc: この古いテントは何人もの持ち主に使われてきた。そして必ず、頼れるテントを必要とする者へと受け継がれていく。
      smellySocks:
        name: くさい靴下
        desc: しもべ妖精を自由にするのにぴったりの靴下。
      simpleAmulet:
        name: 簡素なアミュレット
        desc: 真鍮色のネックレスに、同じような色のペンダントがついている。ペンダントには、もっと明るい色の意味不明な模様が描かれている。
      rabbitEars:
        name: ウサギの耳
        desc: これをつけていると、動物たちの見る目が少し変わるようだ。少し身軽になった気がする。かわいさも増す。
      mosquitoNethat:
        name: 蚊よけネット帽
        desc: この帽子があれば、どんなに虫だらけの地域でも安心して旅ができ、自然の驚異に集中できる。
      properCape:
        name: 本格マント
      simpleRing:
        name: 簡素な指輪
        desc: ぴかぴかの真鍮色の指輪。凝った細工も美しい宝石もないが、その簡素さには品がある。
      kelpDivingMask:
        name: 昆布の潜水マスク
        desc: 硬化昆布で作られた軽い潜水マスク。
      kelpDivingLegs:
        name: 昆布の潜水パンツ
        desc: 脚にぴったり張りつく潜水パンツだが、水の抵抗はほとんど感じない。
      kelpDivingBody:
        name: 昆布の潜水シャツ
        desc: 昆布の潜水シャツは体にぴったりとフィットする。
      backpack:
        name: リュック
        desc: ポケットが多く収納もたっぷりの、高級革のリュック。
      properBoots:
        name: 本格ブーツ
      oldCopperRing:
        name: 古い銅の指輪
        desc: この指輪は見る影もない。質屋なら何かと引き換えてくれるかもしれない。あるいは、別の使い道があるかもしれない。
      oldSilverRing:
        name: 古い銀の指輪
        desc: 刻印がすり減り、黒ずんで見える指輪。いったいどれほど長くここにあったのだろう？
      properHat:
        name: 本格帽子
      treeScalingClaws:
        name: 木登り爪
        desc: この特製の爪を着ければ、どんな鳥の巣にも手が届く。
      oldGoldRing:
        name: 古い金の指輪
        desc: 金の輝きを失い、はっきりと傷みが見える指輪。きっと誰かにとって大切なものだったのだろう。
      properShirt:
        name: 本格シャツ
      finGloves:
        name: ヒレ手袋
      rustyDivingLegs:
        name: 錆びた潜水レギンス
        desc: 錆びた潜水服の下半身部分。かなり着心地は悪いが、水は一滴も漏れない。
      properPants:
        name: 本格パンツ
      screwdriver:
        name: ドライバー
        desc: ネジを締めるのはどっち回しだったか？いつも忘れてしまう。
      hydriliumDivingBody:
        name: ハイドリリウムの潜水胴衣
      hydriliumDivingLegs:
        name: ハイドリリウムの潜水レギンス
      hydriliumDivingHelm:
        name: ハイドリリウムの潜水ヘルメット
      capeOfTheTrailblazer:
        name: 先駆者のマント
      ringOfAsh:
        name: 灰の指輪
        desc: 圧縮した石炭で作られた指輪。決して壊れないが、はめた指には永遠に黒い跡が残る。
      hatOfWisdom:
        name: 知恵の帽子
      sailorsHat:
        name: 水兵帽
      adoringFanStatue:
        name: 熱烈なファンの像
      oxygenTank:
        name: 酸素ボンベ
      jellyfishingNet:
        name: クラゲ取り網
      merfolkDress:
        name: マーフォークのドレス
      flowingPocketwatch:
        name: 漂う懐中時計
      firefliesInJar:
        name: ホタルの瓶詰め
    achievements:
      ringOfHomesickness:
        name: 郷愁の指輪
        desc: この指輪を見ると、やっぱりおうちがいちばんだと思い出す。
      jugglingBalls:
        name: ジャグリングボール
        desc: 穀物を詰めた色とりどりの3つのボールは、ジャグリングにうってつけだ。
      pathfinder:
        name: 道しるべ
        desc: 首飾りには、最短ルートを示すミニチュアの地図が付いている。
      runningVisor:
        name: ランニングバイザー
        desc: この赤いバイザーは日差しから目を守りつつ、上が開いているので頭を冷やせる。
      rustySpyglass:
        name: 錆びた望遠鏡
        desc: この錆びた望遠鏡のように、使い込まれた道具にはある種の魅力がある。
      pantsOfHaste:
        name: 疾風のズボン
        desc: もっと速く、もっと遠くへ！
      omniTool:
        name: オムニツール
        desc: 前腕に装着できるこの道具は、命じるままにさまざまな作業を手伝ってくれる。
      tinyBackpack:
        name: ちっちゃなリュック
        desc: 子どもにとっては普通サイズのリュック。
      greedyPiggyBank:
        name: 欲張りなブタの貯金箱
      trekkingPoles:
        name: トレッキングポール
      treasureHunterHat:
        name: 宝探しの帽子
        desc: カウボーイハットなのかフェドーラなのかはっきりしないが、あの「インディ」らしい雰囲気は確かにある。
      trashGrabber:
        name: ゴミ拾いトング
        desc: 長く伸びたこの道具なら、かがまずに簡単にゴミを拾える。
      bootsOfSpeed:
        name: 俊足のブーツ
        desc: この靴を履くと足取りが軽くなり、歩みも速くなる。
      treasureHunterJacket:
        name: 宝探しのジャケット
      treasureHunterPants:
        name: 宝探しのズボン
      shoesOfEscape:
        name: 逃走の靴
        desc: この靴を履くと、ときどきものすごく速く走れる。
      conservationistHat:
        name: 自然保護官の帽子
      absorbingAmulet:
        name: 吸収のアミュレット
      conservationistBoots:
        name: 自然保護官のブーツ
      conservationistShirt:
        name: 自然保護官のシャツ
      treasureGrabber:
        name: お宝マジックハンド
      axeOfDestruction:
        name: 破壊の斧
        desc: この斧の刃は、木をむさぼろうと待ち構える口のような形をしている。
      ghostTrapPack:
        name: ゴーストトラップパック
        desc: このかさばるリュックには、幽霊の粒子を捕まえるためのチューブが付いている。
      shinyRing:
        name: ピカピカの指輪
        desc: いちばん上品な指輪とは言えないが、ピカピカなのは間違いない。
      adventurersGuildBuckler:
        name: 冒険用のバックラー
      boulderBoots:
        name: 大岩のブーツ
      globetrottersBackpack:
        name: 世界旅行者のリュック
      quickdrawMap:
        name: 早描きの地図
      travelersKit:
        name: 旅人のキット
      conservationistShorts:
        name: 自然保護官のショートパンツ
      gemBracelet:
        name: 宝石のブレスレット
    supporter:
      stickyFingerShorts:
        name: 手癖の悪い半ズボン
        desc: <i>「リクがこのポケットに何を入れたかは、誰にもわからない！」</i>
      woodpucker:
        name: ウッドパッカー
        desc: 
          <i>「伝説のホッケースティック、ウッドパッカーで氷上も森も制覇しよう。リンクの内外で最高のパフォーマンスを発揮するよう作られたこの革新的なスティックには、最先端技術TimberTechを搭載。強力な伐採道具としても使える。」</i>
      theKakesWalkingStick:
        name: 旅心のウォーキングステッキ
        desc: <i>「行かねばならぬ。客人は一つ所にいつまでも留まるべきではない。友の炉端に長く座りすぎれば、愛は失われる。」</i>
      alienSqueakyToy:
        name: エイリアンのピーピーおもちゃ
        desc: <i>「エメリーという子犬のお気に入りのピーピーおもちゃ。これを持っていると、エメリーがついてきて宝探しを手伝ってくれる。」</i>
      weightedVest:
        name: ウェイトベスト
        desc: 
          <i>「このベストで最初の一歩を踏み出すと、ふとある考えが頭をよぎる——鍛え抜かれた魂と同じ重さを、今や体も背負っているのだと。」</i>
      redSkydisc:
        name: 赤いスカイディスク
    equipmentSets:
      adventurersTools:
        adventuringSewingNeedle:
          name: 冒険用の縫い針
          desc: 冒険者ギルドの記章が入った縫い針。旅先で服を繕うのにうってつけだ。
        adventuringSickle:
          name: 冒険用の鎌
          desc: 刃に冒険者ギルドの紋章が刻まれた鎌。薬草などの植物の収穫に使える。
        adventuringHatchet:
          name: 冒険用の手斧
          desc: 冒険者ギルドの紋章が入った手斧。刃は鋭く、柄は頑丈だ。
        adventuringPickaxe:
          name: 冒険用のツルハシ
          desc: 冒険者ギルドの紋章がついた頑丈な柄のツルハシ。岩を砕き、鉱石を採掘するのにうってつけだ。
        adventuringFishingPole:
          name: 冒険用の釣り竿
          desc: 冒険者ギルドの紋章が入った釣り竿。野外で魚を釣るのにちょうどいい手ごたえだ。
        adventuringHuntingBow:
          name: 冒険用の狩猟弓
          desc: 冒険者ギルドの記章が入った狩猟弓。荒野での狩りに役立つ。
        adventuringSaw:
          name: 冒険用ののこぎり
          desc: 冒険者ギルドの紋章が入ったのこぎり。木を切るなら、冒険者はこれを選ぶ。
        adventuringHammer:
          name: 冒険用のハンマー
          desc: 柄の付け根に冒険者ギルドの紋章が刻まれたハンマー。鍛冶に使えそうだ。
        adventuringFryingPan:
          name: 冒険用のフライパン
          desc: 柄に冒険者ギルドの紋章が入ったフライパン。キャンプファイヤーでの調理にうってつけだ。
        adventuringWrench:
          name: 冒険用のレンチ
          desc: 冒険者ギルドの紋章で飾られたレンチ。野外での修理や調整に役立つ。
        adventurersAmulet:
          name: 冒険用のアミュレット
          desc: 冒険者ギルドのシンボルが入ったアミュレット。
        adventurersRing:
          name: 冒険用の指輪
          desc: 冒険者ギルドの紋章が刻まれた指輪。
        adventuringSander:
          name: 冒険用の研磨器
          desc: 冒険者ギルドの記章が入った研磨器。粗い表面を滑らかに整えられる。
    combat:
      swashbucklerSword:
        name: 荒くれ剣士の曲刀
    agGuildSpecials:
      bertssuperskis:
        name: バートのスーパースキー板
        desc: このスキー板は、スーパー雪の上で使うと最速だ。
      zorresDesertGourdpack:
        name: ゾーレの砂漠ひょうたんパック
        desc: 
          この奇妙なひょうたん形の容器は、大きな肩掛け紐で背負うものだ。中に砂が入り込みやすいことにかけては天下一品。きっと砂の精霊の仕業だろう。
      sethsSwampCompass:
        name: セスの沼地コンパス
        desc: このコンパスは常に沼地の中心を指す。一人前の冒険者を自負するなら必需品だ。
    regional:
      jarvonia:
        frostTouchedBoots:
          name: 霜纏いのブーツ
          desc: 銀色の金属のブーツが、青い光を帯びてきらめく。
        frostTouchedGauntlets:
          name: 霜纏いの籠手
          desc: 外側は冷たいのに、なぜか内側は温かく感じる籠手。
        frostTouchedLeggings:
          name: 霜纏いのレギンス
          desc: この風変わりな金属のレギンスは、まわりのものすべてを青く輝かせる。
        frostTouchedTorso:
          name: 霜纏いの胴鎧
          desc: この巨大な金属の胴鎧は、青みがかったオーラとともに周囲の光を反射する。
        handWarmingPack:
          name: 手温めカイロ
          desc: ひねると温かくなる小さなパック。なんと繰り返し使える！
        knittedMittens:
          name: 毛糸のミトン
          desc: さまざまな毛糸で、美しい白と青の模様に編まれたミトン。
        perfectSnowballs:
          name: 完璧な雪玉
          desc: ただの雪玉ではない。まん丸に固められた完璧な雪玉で、いつでも誰かに投げつけられる。
        wintryPan:
          name: 冬色の砂金皿
          desc: 青みがかった金属の皿。もとは砂金採り専用だったが、宝石を引き寄せるといわれている。
        frostTouchedHelm:
          name: 霜纏いの兜
          desc: ジャーボニアの鉱山の最深部に潜るのにうってつけの金属の兜。
      trellin:
        lindenLeafBoots:
          name: 菩提樹の葉のブーツ
          desc: これを履くと、両足に葉っぱの茂みをくっつけているように見える。
        lindenLeafGloves:
          name: 菩提樹の葉の手袋
          desc: この手袋をはめると、指が小枝になったような気分になる。
        lindenLeafShorts:
          name: 菩提樹の葉の半ズボン
          desc: この葉っぱの半ズボンをはくと、茂みになった気分になる。小枝や背の高い草のひっかき傷を防ぐには、まったく役に立たない。
        lindenLeafVest:
          name: 菩提樹の葉のベスト
          desc: ごつい茂みの着ぐるみだが、葉や枝は意外と着心地がいい。ひどくても、ときどき首筋がくすぐったい程度だ。
        fungalBackpack:
          name: キノコのリュック
          desc: この緑のリュックには、かすかに光る青いキノコがびっしり生えている。
        bugAttractingIncense:
          name: 虫寄せのお香
          desc: この緑のお香は、地元の昆虫学者たちに人気がある。
        bugRepellingIncense:
          name: 虫よけのお香
          desc: この赤いお香はユーカリの香りがし、虫を寄せつけないといわれている。
        firestarter:
          name: 火おこし器
          desc: 火をおこすための道具。ひねくれた火付け役にはもってこいだ。
        lindenLeafHat:
          name: 菩提樹の葉の帽子
          desc: こんな葉っぱの帽子を持てるのは、トレリンでも名士だけだ。名産のブドウのひと房まで飛び出している。
        trellinBeaver:
          name: トレリンビーバー
          desc: 
            ローテクな伐採方法と呼ばれている。機嫌を損ねないよう、ご褒美は欠かさないこと。木々としては、鎖のリードをしっかり締めておいてほしいところだ。
      halfling:
        bogwoodBoots:
          name: 沼木のブーツ
          desc: 頑丈で、ぬかるんだ場所で作業するときも快適に履けるよう作られたブーツ。
        bogwoodGloves:
          name: 沼木の手袋
          desc: どんな木材を扱うときでも、しっかり握れる手袋。
        bogwoodShorts:
          name: 沼木の半ズボン
          desc: 茶色と緑の半ズボンで、脚を楽に動かせる。板材切りに没頭しているときにぴったりだ。
        lilyPadRope:
          name: スイレンの葉ロープ
          desc: 花を咲かせたスイレンの葉に、その茎で作ったロープを結びつけたハーフリング独自の道具。沼地でぬかるみから抜け出すのに重宝する。
        bogwoodVest:
          name: 沼木のベスト
          desc: この緑のベストには、胸を横切って茶色のストラップが走っている。
        whollyRing:
          name: 一心同体の指輪
          desc: 
            この指輪は、沼地で結ばれた2人のハーフリングの絆から生まれたとうわさされている。愛の物語として語られることもあれば怪談として語られることもあり、どちらになるかは語り手しだいらしい。
        fingersaw:
          name: 指のこ
