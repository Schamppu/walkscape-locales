singulars:
  materials:
    woodcutting:
      birchLogs:
        name: シラカバの丸太
        desc: 滑らかで淡い色のシラカバの丸太。上品で飾り気のない趣がある。
      pineLogs:
        name: マツの丸太
        desc: 強靭で樹脂をたっぷり含んだマツの丸太は、独特の心地よい香りを放っている。
      coral:
        name: サンゴ
      sturdyBranch:
        name: 頑丈な枝
        desc: 異様なほど頑丈な枝。
      bambooLogs:
        name: 竹の丸太
        desc: 竹はしなやかでありながら丈夫で、さまざまな用途がある。
      spruceLogs:
        name: トウヒの丸太
        desc: 豊かで温かみのある色合いのトウヒの丸太。木本来の美しさと魅力にあふれている。
      oakLogs:
        name: オークの丸太
        desc: 独特の風格をまとったオークの丸太は、気高い存在感と色あせない気品を漂わせている。
      mangroveLogs:
        name: マングローブの丸太
      mapleLogs:
        name: カエデの丸太
        desc: カエデの丸太には豊かで心惹かれる木目が浮かび、どの一本にも自然の芸術が表れている。
      root:
        name: 根
      willowLogs:
        name: ヤナギの丸太
      teakLogs:
        name: チークの丸太
      ectoLogs:
        name: エクトプラズムの丸太
    mining:
      copperOre:
        name: 銅鉱石
        desc: 赤みを帯びた色の銅鉱石は、ひときわ目を引く鉱物だ。
      ironOre:
        name: 鉄鉱石
        desc: 鉄鉱石はざらりとして密度が高く、頑丈で荒削りな性質をよく表している。
      saltCrystal:
        name: 塩の結晶
        desc: 細かく砕けばさまざまに使え、原石のままでは複雑で美しい形をしている。
      tinOre:
        name: スズ鉱石
        desc: 簡素で飾り気のないスズ鉱石は、素朴な鉱物の成り立ちをそのまま見せている。
      opal:
        name: オパールの原石
        desc: 生まれた場所の砂と泥にまだ包まれた、繊細な宝石。磨けば現れる炎を内に秘めている。
      starPearl:
        name: 星真珠の原石
        desc: 磨かれていない生のままの真珠だが、真に見事な品になる可能性を秘めている。
      coal:
        name: 石炭
        desc: 控えめで飾らない石炭は、欠かせないエネルギー資源としての実用性を物語っている。
      ruby:
        name: ルビーの原石
        desc: 岩の内側から深紅の鉱物が突き出ている。その美しさと素朴さに目を奪われる。
      topaz:
        name: トパーズの原石
        desc: ほのかに金色を帯びた原石。まばゆい宝石へとカットされる時を待っている。
      wrentmarine:
        name: ウレントマリンの原石
        desc: このごつごつした石をのぞき込むと、波に反射する陽光のような青いきらめきが内側に見える。
      goldNugget:
        name: 金ナゲット
        desc: 金は最も価値の高い金属のひとつで、装身具づくりによく使われる。
      silverNugget:
        name: 銀ナゲット
        desc: 銀は非常に珍重される金属で、指輪やアミュレット、イヤリングなどの装身具によく使われる。
      largeStone:
        name: 大きな石
        desc: 普通より大きな石。
      sunStone:
        name: 太陽石の原石
        desc: この希少な二色の宝石は太陽そのもののかけらのようで、原石の状態でもほのかな光を放っている。
      tarsiliumOre:
        name: タルシリウム鉱石
        desc: タルシリウム鉱石のなめらかな表面は、まるで魔法のような輝きで周囲の景色を映し出す。
      farganiteOre:
        name: ファーガナイト鉱石
        desc: 揺るぎない強さと人を惹きつける青い光沢を持つファーガナイト鉱石は、不屈の決意の象徴となっている。
      ethernite:
        name: エーテル石の原石
        desc: 晶洞の中で育った、ぎざぎざした紫色の結晶。長く見つめていると落ち着かない気分になる。
      goldOre:
        name: 金鉱石
      ectoRock:
        name: エクトプラズムの岩
      jade:
        name: ヒスイの原石
      volcanicRock:
        name: 火山岩
      silverOre:
        name: 銀鉱石
    foraging:
      wheat:
        name: 小麦
        desc: 多くの文明の発展を支えてきた穀物。
      nettle:
        name: イラクサ
        desc: 背が高くほっそりとした植物で、ハート形の葉と強烈なとげを持つ。
      hemp:
        name: 麻
        desc: 背が高く葉の茂った植物で、細い茎を持つ。用途の広い繊維と実用性で知られている。
      stone:
        name: 石
        desc: 石。これで生き延びるための何かを作れるかもしれない。
      woodenStick:
        name: 木の棒
        desc: 先のとがった木切れ。これで生き延びるための何かを作れるかもしれない。
      grass:
        name: 草
        desc: みずみずしい緑の草。
      snowdrop:
        name: スノードロップ
        desc: 冬に咲く小さな白い花。希望と新たな始まりをそっと思い出させてくれる。
      moondaisy:
        name: ムーンデイジー
        desc: 闇の深い夜に月明かりを受けて光る、はかない花。
      thistle:
        name: アザミ
        desc: 頑丈な植物で、とげのある葉が色とりどりの花を守る盾のように囲んでいる。
      flax:
        name: 亜麻
        desc: 繊細な青い花から丈夫な糸が採れる。リネン作りにぴったりだ。
      berries:
        name: ベリー
        desc: いざという時にそこそこ腹を満たしてくれる。料理の食材として使ってもいい。
      hardenedKelp:
        name: 硬化昆布
        desc: さまざまな技法で普通の昆布を硬くしたもの。クラフトの素材として重宝される。
      seaCabbage:
        name: 海キャベツ
        desc: 水中で育つ人気の食べ物。スレンティア族はこれで海キャベツジャーキーを作る。
      seaSpinach:
        name: 海ほうれん草
        desc: 栄養豊富でおいしい食用植物。普通のほうれん草とはまったく違う味がする。
      underwaterLotus:
        name: 水中の蓮
        desc: スレンティアの詩によく登場する植物。その美しさと優雅さで知られている。
      sweetKelp:
        name: 甘い昆布
        desc: 甘い味のする昆布で、水中料理に使われる。独特の忘れられない風味を加えてくれる。
      saltyHops:
        name: 塩ホップ
      cattail:
        name: ガマ
      mud:
        name: 泥
      kelp:
        name: 昆布
      rotbud:
        name: 腐れ芽
      widowsKiss:
        name: 未亡人の口づけ
      milkweed:
        name: トウワタ
      waterLotus:
        name: 水面の蓮
      sunblossom:
        name: 太陽花
      pepper:
        name: コショウ
    rawFish:
      rawShrimp:
        name: 生のエビ
        desc: 見るからに新鮮なエビ。極上の海の幸が楽しめそうだ。
      rawTrout:
        name: 生のマス
        desc: マスの鱗は虹色に輝き、銀色や桃色の色合いと斑点が見事な模様を描いている。
      rawSalmon:
        name: 生のサケ
        desc: 汁気が多くバターのような身を持つサケは、濃厚でなめらかな食感で舌を楽しませる。
      rawJellyfish:
        name: 生のクラゲ
        desc: 珍しい食材のクラゲ。料理人の探究心をくすぐる。その奇妙な食感をどう生かすか、腕が試される。
      rawCarp:
        name: 生のコイ
        desc: コイのくせのない味は、さまざまな料理によく合う。よく跳ねる魚だ。
      rawPike:
        name: 生のカワカマス
        desc: ほろりとほぐれる柔らかな身を持つ生のカワカマスは、調理に向いている。
      rawPerch:
        name: 生のパーチ
        desc: 優美な曲線を描く俊敏なパーチは、釣りを始めたばかりの人にぴったりの魚だ。
      rawSquid:
        name: 生のイカ
        desc: イカは姿をくらます芸当で人を驚かせる。
      rawShark:
        name: 生のサメ
      rawCrab:
        name: 生のカニ
        desc: 広く見られる甲殻類で、短く丸い体に黒く小さな目がふたつ、大きく肉厚なはさみを持つ。そのはさみで挟んでくる。痛っ！
      rawAnglerfish:
        name: 生のアンコウ
      rawLobster:
        name: 生のロブスター
      rawLargemouthBass:
        name: 生のオオクチバス
      rawSwordfish:
        name: 生のメカジキ
      rawStreamEel:
        name: 生の渓流ウナギ
      ectoFish:
        name: エクトプラズムの魚
      rawStingray:
        name: 生のエイ
    misc:
      fishingLine:
        name: 釣り糸
        desc: これを自然から回収したことで、動物の命が救われたかもしれない。
      trash:
        name: ゴミ
        desc: 役に立たない、価値のない物の寄せ集め。なぜこんな物を拾ったのか？
      fishbone:
        name: 魚の骨
        desc: 少し気味が悪く、かなり臭うが、見た目はなかなか格好いい。
      seashell:
        name: 貝殻
        desc: きっと浜辺で誰かが売っていたものだ。
      unidentifiedRemains:
        name: 身元不明の遺骸
        desc: この骨の山を冒険者ギルド出張所に返せば喜ばれるだろう。未解決の依頼の解決に役立つかもしれない。
      adventurersPin:
        name: 冒険者のピンバッジ
        desc: 冒険者ギルドの紋章が入ったピンバッジ。少し錆びているが、まだ輝いている。冒険者ギルド出張所に返せば喜ばれるだろう。
      nameTag:
        name: 名札
        desc: とうの昔にいなくなった冒険者の名前が書かれた名札。冒険者ギルド出張所が興味を持つかもしれない。
      pearls:
        name: 真珠
        desc: 文字どおりの粒ぞろい。装身具を作るのにうってつけの素材だ。
      glacierMap:
        name: 謎の北方地図
        desc: ジャーボニアの北部に似た地図。赤い線で、イグルーのある氷河らしき場所への道が記されている。
      clam:
        name: 二枚貝の殻
        desc: 真珠のように白く、傷ひとつない。収集家にとって美しい標本だ。
      halfmawScales:
        name: ハーフモーの鱗
      halfmawTeeth:
        name: ハーフモーの歯
    crafting:
      rope:
        name: より糸
        desc: サバイバルキットにより糸は欠かせない。基本的な道具を作るのに必須だ。
      kelpRope:
        name: 昆布のより糸
      hydrilium:
        name: ハイドリリウム
      ironweedTwine:
        name: 鉄草のより糸
    carpentry:
      birchPlank:
        name: シラカバの板材
        desc: 滑らかで淡い色のシラカバの板材。明るくすっきりとした木肌は、簡素ながら優雅だ。
      pinePlank:
        name: マツの板材
        desc: 温かみのある土色が特徴のマツの板材は、自然な木目模様で素朴な魅力を放っている。
      oakPlank:
        name: オークの板材
        desc: 豊かな土色と、くっきりとした複雑な木目模様が特徴の、木工作品の定番となる板材。
      woodScrap:
        name: 木屑
        desc: 質の低い木の端材。
      mahoganyPlank:
        name: マホガニーの板材
        desc: あらゆる頑丈な建造物に使える、高品質な板材。
      sprucePlank:
        name: トウヒの板材
        desc: きめ細かな木目を持つトウヒの板材は、すっきりとした古典的な見た目で優雅さを感じさせる。
      maplePlank:
        name: カエデの板材
        desc: 美しく心惹かれるカエデの板材は、滑らかで明るい色の表面を持ち、どんな作品にも洗練された趣を添える。
      willowPlank:
        name: ヤナギの板材
        desc: 繊細で淡い見た目と控えめな木目模様を持つヤナギの板材は、木工作品に幻想的な美しさを添える。
      teakPlank:
        name: チークの板材
        desc: 耐久性と、つややかな金褐色の色合いで知られるチークの板材は、丈夫で美しい品を作るための最高の選択肢だ。
      mangrovePlank:
        name: マングローブの板材
        desc: しなやかで風雨に強いマングローブの板材は、屋外の木工仕事にうってつけで、強さと独特の南国の魅力を兼ね備えている。
      coralPlank:
        name: サンゴの板材
        desc: 最も大きなサンゴから作られた板材。水上でも水中でも頑丈だ。
      bambooPlank:
        name: 竹の板材
        desc: 少し手間はかかったが、しなやかな板材を成形して構造材に仕上げた。
      yewPlank:
        name: イチイの板材
    trinketry:
      spiderTrinket:
        name: クモの小物
        desc: クモの小物は光を受けて明るく輝いている。いつかアミュレットに役立ちそうだ。
      circularRootTrinket:
        name: 輪になった根の小物
        desc: 輪になった根の小物は光を受けて明るく輝いている。いつかアミュレットに役立ちそうだ。
      measuringSpoonsTrinket:
        name: 計量スプーンの小物
        desc: 計量スプーンの小物は光を受けて明るく輝いている。いつかアミュレットに役立ちそうだ。
      beaverTrinket:
        name: ビーバーの小物
        desc: ビーバーの小物は光を受けて明るく輝いている。いつかアミュレットに役立ちそうだ。
      pinkPearlTrinket:
        name: ピンク真珠の小物
        desc: ピンク真珠の小物は光を受けて明るく輝いている。いつかアミュレットに役立ちそうだ。
      coolingIceTrinket:
        name: ひんやりつららの小物
        desc: ひんやりつららの小物は光を受けて明るく輝いている。いつかアミュレットに役立ちそうだ。
      batTrinket:
        name: コウモリの小物
        desc: コウモリの小物は光を受けて明るく輝いている。いつかアミュレットに役立ちそうだ。
      shrimpTrinket:
        name: エビの小物
      compassTrinket:
        name: コンパスの小物
        desc: コンパスの小物は光を受けて明るく輝いている。いつかアミュレットに役立ちそうだ。
      eelTrinket:
        name: ウナギの小物
      sharkToothTrinket:
        name: サメの歯の小物
      heronTrinket:
        name: サギの小物
      luckyRabbitFootTrinket:
        name: 幸運のウサギの足の小物
    smithing:
      steelBar:
        name: 鋼インゴット
        desc: 決意の炎で鍛えられた鋼インゴットは、この世のものとは思えない光沢を放っている。
      copperBar:
        name: 銅インゴット
        desc: 赤みがかった橙色の光沢を放つ銅インゴット。金属としての強さを備え、さまざまな用途に使える。
      metalScrap:
        name: 金属屑
        desc: 質の低い金属の端材。
      silverBar:
        name: 銀インゴット
        desc: ナゲットを使っても鉱石を使っても、銀インゴットは銀の標準純度92.5%に達する。
      bronzeBar:
        name: 青銅インゴット
        desc: ドワーフの鍛冶場の遺物である青銅インゴットは、素朴な魅力と耐久性を漂わせ、熟練の手で溶け合わされた銅とスズの秘密を宿している。
      goldBar:
        name: 金インゴット
        desc: ナゲットを使っても鉱石を使っても、金インゴットは細工工場が定める333の純度基準に達する。
      ironBar:
        name: 鉄インゴット
        desc: 重く揺るがない、大地の芯の強さを示す証だ。
      tarsiliumBar:
        name: タルシリウムインゴット
        desc: タルシリウムインゴットは夜空のようにきらめき、表面は油のような質感に覆われている。
      farganiteBar:
        name: ファーガナイトインゴット
        desc: 鮮やかな青色のインゴット。
      hydriliumBar:
        name: ハイドリリウムインゴット
      violiteBar:
        name: バイオライトインゴット
      adamantBar:
        name: アダマントインゴット
    cooking:
      milk:
        name: ミルク
        desc: 牛やヤギ、ラクダから搾りたて。それとも木の実から搾ったもの？どこで見つけたかは本人だけが知っている。
      honey:
        name: ハチの巣
        desc: この生のハチの巣からは、新鮮なハチミツがしたたっている。
      mushroom:
        name: キノコ
      carrot:
        name: ニンジン
    hunting:
      feather:
        name: 羽根
        desc: 美しく軽く、空気をよく切る鳥の羽根。
      bones:
        name: 骨
        desc: 骨のかけらがいくつか。
      darkfeather:
        name: 黒い羽根
        desc: 鳥の黒い羽根。おそらくカラスやワタリガラス、またはほかの黒い鳥のものだ。
      animalMeat:
        name: 獣肉
        desc: 肉食は殺生だ。
      animalFur:
        name: 獣の毛皮
        desc: この獣の毛皮は手触りが柔らかく、服に仕立てればとても暖かいに違いない。
      ectoScraps:
        name: エクトプラズムの切れ端
      lizardTail:
        name: トカゲの尻尾
    tailoring:
      aerodynamicThread:
        name: 風切りの糸
  crafted:
    skilling:
      mining:
        copperPickaxe:
          name: 銅のツルハシ
          desc: 採掘用の、もろくて軽いツルハシ。仕事はちゃんとこなす。
        basicPickaxe:
          name: 初級ツルハシ
          desc: 鉱夫のささやかな道具、初級ツルハシ。棒と石を紐で縛りつけただけの代物にすぎない。
        bronzePickaxe:
          name: 青銅のツルハシ
          desc: 素朴な魅力と揺るぎない力強さを備えた、青銅のツルハシ。
        ironPickaxe:
          name: 鉄のツルハシ
          desc: 重い頭部をもつこのツルハシは、荒野を切り拓く者や未知に挑む者の頼れる相棒だ。
        steelPickaxe:
          name: 鋼のツルハシ
          desc: 鋼のツルハシは作り手の決意を映して輝き、その命令をいつでも待っている。
        bectoPickaxe:
          name: 霊体のツルハシ
        tarsiliumPickaxe:
          name: タルシリウムのツルハシ
        hydriliumPickaxe:
          name: ハイドリリウムのツルハシ
        farganitePickaxe:
          name: ファーガナイトのツルハシ
        hydriliumMagnet:
          name: ハイドリリウムの磁石
      fishing:
        basicFishingPole:
          name: 木の釣り竿
          desc: よく言うだろう、湖で過ごす最悪の日も、職場で過ごす最高の日に勝る、と。
        smallFishingNet:
          name: 初級漁網
          desc: 素朴な漁師のささやかな道具、初級漁網。数本のロープを結び合わせただけの代物にすぎない。
        largeFishingNet:
          name: 大きな漁網
          desc: 海辺の人々が生み出した大きな漁網。絶えず移ろう潮の上に、願いを込めて大きく投げ広げられる。
        pineFishingRod:
