        desc: 
          小さく簡素なバッジだが、煮炊き厨房のボランティアである証だ。身に着けるのは誇らしく、厨房ごとに独自のバッジがもらえる。さあ、全部集めに行こう。ジムを全部制覇して……じゃなくて、すべての厨房を手伝って。
