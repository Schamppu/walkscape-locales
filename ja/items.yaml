        name: 銀の懐中時計
        desc: 
          この時計は針も歯車もなく、規格外の大きさのガラス蓋は割れ、おまけに銀の鎖も外装も黒ずんでいた。簡単ではなかったが、新品同様に修理した。今では家宝として、何世代にもわたって受け継げそうだ。
