singulars:
  hunting:
    bows:
      birchHuntingBow:
        name: シラカバの狩猟弓を作る
        desc: シラカバの素朴な木から、基本的な狩猟弓を作る。
        activityDesc: シラカバの木片を慎重に選び、ぶれない手つきで弓の形に削る。最後に弓弦を張れば、素朴な狩猟道具の完成だ。
      oakHuntingBow:
        name: オークの狩猟弓を作る
        desc: オークの心材から頑丈な狩猟弓を作る。
      bambooHuntingBow:
        name: 竹の狩猟弓を作る
        desc: しなやかで強い竹から、軽くて扱いやすい狩猟弓をこしらえる。
      spectralHuntingBow:
        name: 霊体の狩猟弓を作る
    arrows:
      simpleBowstring:
        name: 簡素な弓の弦を作る
        desc: 弓に力を与える簡素な弦を作る。
        activityDesc: 
          ぶれない手つきで強い繊維を選び、丹念により合わせていく。きちんとそろえた一本一本が、弦の強さとしなやかさを増していく。
      copperArrows:
        name: 銅の矢を作る
        desc: 銅の矢じりをつけた細身の矢を作る。
        activityDesc: 集中して銅を矢じりの形に整える。鋭い切っ先が光を受けてきらめく。
      bronzeArrows:
        name: 青銅の矢を作る
        desc: 青銅の矢じりをつけた頑丈な矢を作る。
      ironArrows:
        name: 鉄の矢を作る
        desc: 鉄の矢じりをつけた頑丈な矢を作る。
      steelArrows:
        name: 鋼の矢を作る
        desc: 鋼の矢じりをつけた上等な矢を作る。
      tarsiliumArrows:
        name: タルシリウムの矢を作る
        desc: 黒いタルシリウムの矢じりをつけた、不吉な矢を作る。
      farganiteArrows:
        name: ファーガナイトの矢を作る
        desc: ファーガナイトの矢じりをつけた矢を作る。
      strongBowstring:
        name: 強靭な弓の弦を作る
    traps:
      boxtraps:
        boxtrap:
          name: 箱罠を作る
          desc: 小さな獲物を一度だけ捕らえると壊れてしまう箱罠を作る。
      net:
        kelpDriftNet:
          name: 昆布の流し網を作る
          desc: しなやかで強い昆布で頑丈な網を編む。海の恵みを獲るのにぴったりだ。
  trinketry:
    amulets:
      jarvonianFlowerNecklace:
        name: ジャーボニアの花の首飾りを作る
        desc: ムーンデイジーとスノードロップを合わせて花のネックレスにする。
        activityDesc: 花をひとつなぎにしていくと、魔法の解けた森で過ごした最初の日々が思い出され、心がなごむ。
      amuletOfTheFinding:
        name: 発見のアミュレットを作る
        desc: コンパスの小物をアミュレットにはめ込む。
      amuletOfTheEel:
        name: ウナギのアミュレットを作る
      amuletOfTheHeron:
        name: サギのアミュレットを作る
      amuletOfTheBat:
        name: コウモリのアミュレットを作る
      amuletOfTheSharkTooth:
        name: サメの歯のアミュレットを作る
      amuletOfTheCoolingIce:
        name: 冷たい氷のアミュレットを作る
      amuletOfTheSpider:
        name: クモのアミュレットを作る
      amuletOfTheAnimalKingdom:
        name: 動物王国のアミュレットを作る
      amuletOfTheRoot:
        name: 輪になった根のアミュレットを作る
      amuletOfTheMeasuringSpoons:
        name: 計量スプーンのアミュレットを作る
      amuletOfTheShrimp:
        name: エビのアミュレットを作る
      amuletOfThePinkPearl:
        name: ピンク真珠のアミュレットを作る
      amuletOfTheBeaver:
        name: ビーバーのアミュレットを作る
      amuletOfTheLuckyRabbitFoot:
        name: 幸運のウサギの足のアミュレットを作る
    gems:
      shapeOpal:
        name: オパールを作る
        desc: 原石から炎のように輝くオパールを切り出す。
        activityDesc: 不要なポッチ（母岩の屑）から貴重なオパールの欠片を慎重に取り出す。丁寧な仕事へのご褒美は、ひらめく炎のような輝きだ。
      shapeStarPearl:
        name: 星真珠を作る
        desc: 星真珠を削り、内部の繊細な構造をあらわにする。
      shapeWrentmarine:
        name: ウレントマリンを作る
        desc: ごつごつした母岩からウレントマリンを切り出す。
      shapeTopaz:
        name: トパーズを作る
        desc: 原石からトパーズを削り出す。
      shapeJade:
        name: ヒスイを作る
        desc: 内包物のないヒスイを一片切り出す。
      shapeRuby:
        name: ルビーを作る
      shapeSunStone:
        name: 太陽石を作る
      shapeEthernite:
        name: エーテル石を作る
    rings:
      silverRing:
        name: 銀の指輪を作る
        desc: 定番の銀の指輪を作る。
      silverOpalRing:
        name: 銀のオパール指輪を作る
        desc: 炎のように輝くオパールを銀の指輪にはめ込む。
      silverStarPearlRing:
        name: 銀の星真珠指輪を作る
        desc: 光を放つ星真珠を銀の指輪にはめ込む。
      goldRing:
        name: 金の指輪を作る
        desc: 簡素ながら価値のある金の指輪を作る。
      goldOpalRing:
        name: 金のオパール指輪を作る
        desc: 金の指輪に炎のように輝くオパールをはめ込む。
      silverWrentmarineRing:
        name: 銀のウレントマリン指輪を作る
        desc: カットしたウレントマリンを銀の指輪にはめ込む。
      goldStarPearlRing:
        name: 金の星真珠指輪を作る
        desc: 金の指輪に光を放つ星真珠をはめ込む。
      silverTopazRing:
        name: 銀のトパーズ指輪を作る
      goldWrentmarineRing:
        name: 金のウレントマリン指輪を作る
      silverJadeRing:
        name: 銀のヒスイ指輪を作る
      silverRubyRing:
        name: 銀のルビー指輪を作る
      goldTopazRing:
        name: 金のトパーズ指輪を作る
      silverSunStoneRing:
        name: 銀の太陽石指輪を作る
      goldJadeRing:
        name: 金のヒスイ指輪を作る
      silverEtherniteRing:
        name: 銀のエーテル石指輪を作る
      goldRubyRing:
        name: 金のルビー指輪を作る
      goldSunStoneRing:
        name: 金の太陽石指輪を作る
      goldEtherniteRing:
        name: 金のエーテル石指輪を作る
  carpentry:
    planks:
      birchPlank:
        name: シラカバの板材を作る
        desc: シラカバの木を慎重に切って、役に立つ用途の広い板材にする。
        activityDesc: 正確な手つきでシラカバの木を用途の広い板材に成形し、シラカバの板材を作っていく。
      pinePlank:
        name: マツの板材を作る
        desc: マツの木を、頑丈で頼れる板材に変える。
      sprucePlank:
        name: トウヒの板材を作る
        desc: 強さと用途の広さで知られるトウヒの板材を作る。
      oakPlank:
        name: オークの板材を作る
        desc: 丈夫さと美しさで重宝されるオークの板材を作る。
      maplePlank:
        name: カエデの板材を作る
        desc: カエデの木をなめらかで優美な板材に成形する。
      teakPlank:
        name: チークの板材を作る
        desc: 丈夫さと強さで大切にされるチークの板材を作る。
      willowPlank:
        name: ヤナギの板材を作る
        desc: ヤナギの板材を作る。この木は軽さで重宝されている。
      bambooPlank:
        name: 竹の板材を作る
        desc: しなやかで用途の広い、竹の板材を作る。
      coralPlank:
        name: サンゴの板材を作る
        desc: サンゴの強靭な骨格から作られた頑丈な建材。慎重な採取と加工が必要だ。
      mangrovePlank:
        name: マングローブの板材を作る
        desc: マングローブの板材を作る。硬く密度の高いこの木は、過酷な環境で役に立つ。
      yewPlank:
        name: イチイの板材を作る
      mahoganyPlank:
        name: マホガニーの板材を作る
    scrap:
      birchPlankScrap:
        name: シラカバの板材を作る（屑）
        desc: 木屑を慎重に加工して、役に立つ用途の広い板材にする。
        activityDesc: 正確な手つきで屑を用途の広い板材に成形し、シラカバの板材を作っていく。
      pinePlankScrap:
        name: マツの板材を作る（屑）
        desc: 木屑を、頑丈で頼れる板材に変える。
      sprucePlankScrap:
        name: トウヒの板材を作る（屑）
        desc: 強さと用途の広さで知られるトウヒの板材を作る。
      oakPlankScrap:
        name: オークの板材を作る（屑）
        desc: 丈夫さと美しさで重宝されるオークの板材を作る。
      maplePlankScrap:
        name: カエデの板材を作る（屑）
        desc: 屑をなめらかで優美な板材に成形する。
      teakPlankScrap:
        name: チークの板材を作る（屑）
        desc: 丈夫さと強さで大切にされるチークの板材を作る。
      willowPlankScrap:
        name: ヤナギの板材を作る（屑）
        desc: ヤナギの板材を作る。この木は軽さで重宝されている。
    tools:
      pineToolbox:
        name: マツの道具箱を作る
        desc: 木工の腕を生かして、マツの道具箱を作る。
      bambooToolbox:
        name: 竹の道具箱を作る
        desc: 木工の腕を生かして、竹の道具箱を作る。
    misc:
      ectoplasm:
        name: エクトプラズムを作る
  cooking:
    fish:
      cookedPerch:
        name: 調理済みのパーチを作る
        desc: 水辺のおいしい獲物、パーチのフライの味わいを楽しもう。
        activityDesc: 腕前を発揮してパーチをカリッと揚げ、絶品のパーチのフライに仕上げる。
      cookedShrimp:
        name: 調理済みのエビを作る
        desc: 揚げたエビの味を堪能しよう。うれしい海の幸のごちそうだ。
        activityDesc: 手際よくエビを完璧に揚げ、おいしいエビフライに仕上げる。
      cookedCarp:
        name: 調理済みのコイを作る
        desc: 淡泊な味とやわらかな身で知られるコイのフライを味わおう。
        activityDesc: 丁寧にコイを完璧に揚げ、絶品のコイのフライに仕上げる。
      cookedPike:
        name: 調理済みのカワカマスを作る
        desc: ほろりとほぐれるやわらかな身で知られる、カワカマスのフライを味わおう。
      cookedTrout:
        name: 調理済みのマスを作る
        desc: 虹色に輝くうろこと絶妙な味わいのマス。そのフライの魅惑の風味を味わおう。
      cookedJellyfish:
        name: 調理済みのクラゲを作る
        desc: 独特の食感と風味をもつクラゲのフライを試してみよう。料理界の珍品だ。
      cookedSalmon:
        name: 調理済みのサケを作る
        desc: 濃厚でバターのようにまろやかなサケのフライを堪能しよう。
      cookedLobster:
        name: 調理済みのロブスターを作る
        desc: ジューシーで風味豊かなロブスターのフライを堪能しよう。定番の海の幸のごちそうだ。
      cookedSwordfish:
        name: 調理済みのメカジキを作る
        desc: 
          完璧に火を通したメカジキのステーキの、濃厚でバターのような風味を堪能しよう。外は黄金色でカリッと、中はやわらかくほろりと。あっという間にできる美食だ。
      cookedSquid:
        name: 調理済みのイカを作る
      cookedStingray:
        name: 調理済みのエイを作る
      cookedShark:
        name: 調理済みのサメを作る
      cookedLargemouthBass:
        name: 調理済みのオオクチバスを作る
      cookedAnglerfish:
        name: 調理済みのアンコウを作る
    consumables:
      nettleTea:
        name: イラクサ茶を作る
        desc: 生または乾燥のイラクサの葉を湯に浸して作る、風味豊かで体によいかもしれないお茶。
        activityDesc: 生または乾燥のイラクサを熱湯に浸し、元気が出るハーブティーを作る。
      bread:
        name: パンを作る
        desc: 一から作る手作りパン。小麦粉、水、酵母、塩を合わせてこね、発酵させ、成形し、皮がパリッとしたきつね色になるまで焼く。
        activityDesc: 
          小麦粉、水、酵母、塩を量って混ぜて生地にし、なめらかになるまでこねる。発酵させてから形を整え、皮がパリッとしたきつね色になるまで焼く。
      porridge:
        name: 麦がゆを作る
        desc: ミルクか水で煮て、好みの甘い具やしょっぱい具をのせた、温かくてほっとする麦がゆ。
      pancakes:
        name: パンケーキを作る
        desc: 軽くてふわふわのパンケーキは、おいしい朝食にぴったり。メープルシロップやバター、好きなトッピングと一緒にどうぞ。
      wine:
        name: ワインを作る
        desc: 果物を発酵させて作る奥深い飲み物。甘い果汁が、独特の風味と香りをもつ酒へと変わる。
      cookedMeat:
        name: 調理済みの肉を作る
        desc: 完璧なステーキを焼くための定番の技法。
      crabRolls:
        name: カニロールを作る
        desc: シンプルながら満足感のある海の幸のごちそう。
      beer:
        name: ビールを作る
        desc: 麦芽を使って風味豊かな酒を造る、複雑な工程。
      chocolateMilk:
        name: チョコレートミルクを作る
        desc: クリーミーでおいしいチョコレートミルクは定番のごちそう。冷たいミルクにチョコレートと甘味料を加えれば、さわやかな飲み物になる。
      bagel:
        name: ベーグルを作る
        desc: 外はもっちり、中はふんわり軽い手作りベーグルは、うれしいごちそうだ。好きなスプレッドを塗って召し上がれ！
      pickles:
        name: ピクルスを作る
        desc: パリッとして酸味の効いたピクルス。サンドイッチにも、軽食にもぴったりだ。新鮮なキュウリと風味豊かな漬け汁で作る。
      milk:
        name: ミルクを作る
        desc: ジュースはいらない、お茶もいらない、ミルクをちょうだい、モーモーモーモー。
      mushroomCurry:
        name: キノコカレーを作る
        desc: やわらかいキノコをクリーミーで香り高いソースで仕上げた、濃厚で風味豊かな料理。ご飯やナンと一緒にどうぞ。
      troutSoup:
        name: マスのスープを作る
        desc: 新鮮なマスと野菜、濃厚なだし汁で作る、食べごたえのある風味豊かなスープ。ほっとする食事にぴったりだ。
      mudPie:
        name: 泥だんごを作る
        desc: 想像力の乏しい人なら誰でも作れる、楽しくて手が汚れるお菓子。
      jellySandwich:
        name: ジャムサンドイッチを作る
        desc: 甘いジャムとやわらかいパンの定番の組み合わせ。手軽で満足できる軽食だ。
      dynamite:
        name: ダイナマイトを作る
        desc: 不安定な結晶、強力な油、頑丈な外筒からなる危険な調合品。慎重な取り扱いと正確なタイミングが求められる。
      sweetCarrotPie:
        name: 甘いニンジンパイを作る
      kelpRolls:
        name: 昆布巻きを作る
        desc: さわやかでヘルシーな軽食。ご飯や野菜、肉や魚などを好みに組み合わせ、甘い昆布のシートで巻いた一品だ。
      salmonPie:
        name: サーモンパイを作る
      underwaterSalad:
        name: 水中サラダを作る
      roastedBellPepper:
        name: ローストパプリカを作る
      saltrum:
        name: ソルトラムを作る
      friedFishSandwich:
        name: 魚フライのサンドイッチを作る
      fortifiedWine:
        name: 酒精強化ワインを作る
      fireballWine:
        name: 火球ワインを作る
      jelliedStreamEel:
        name: 渓流ウナギのゼリー寄せを作る
  smithing:
    wooden:
      woodenShield:
        name: 木の盾を作る
        desc: 板材から木の盾を作る。
        activityDesc: 板材から木の盾を作る。
      woodenSword:
        name: 木の剣を作る
        desc: 板材から木の剣を作る。
        activityDesc: 板材から木の剣を作る。
    bars:
      copperBar:
        name: 銅インゴットを作る
        desc: 銅を熱して成形し、さまざまな用途に使える頑丈なインゴットにする。
        activityDesc: 確かな技術で銅を製錬して、耐久性に優れた銅インゴットを作っていく。
      silverBar:
        name: 銀インゴットを作る
        desc: 銀ナゲットか鉱石を製錬して、銀インゴットを作る。
        activityDesc: かなりの量が要るが、銀の塊を炉で熱し続けると、やがてインゴットになる。
      bronzeBar:
        name: 青銅インゴットを作る
        desc: 銅とスズを溶かし合わせて、用途の広い青銅インゴットを作る。
      goldBar:
        name: 金インゴットを作る
        desc: 金ナゲットか鉱石を製錬して、金インゴットを作る。
      ironBar:
        name: 鉄インゴットを作る
        desc: 鉄鉱石を、頑丈で役に立つ鉄インゴットに変える。
      steelBar:
        name: 鋼インゴットを作る
        desc: さまざまな重作業に使える、頑丈な鋼インゴットを鍛える。
      tarsiliumBar:
        name: タルシリウムインゴットを作る
      hydriliumBar:
        name: ハイドリリウムインゴットを作る
      farganiteBar:
        name: ファーガナイトインゴットを作る
      adamantBar:
        name: アダマントインゴットを作る
    scrap:
      copperBarScrap:
        name: 銅インゴットを作る（屑）
        desc: 金属屑を熱して成形し、さまざまな用途に使える頑丈なインゴットにする。
        activityDesc: 正しい技術で、金属屑を製錬して丈夫な銅インゴットにしていく。
      bronzeBarScrap:
        name: 青銅インゴットを作る（屑）
        desc: 金属屑を溶かして、用途の広い青銅インゴットを作る。
      ironBarScrap:
        name: 鉄インゴットを作る（屑）
        desc: 金属屑を、頑丈で役に立つ鉄インゴットに変える。
      steelBarScrap:
        name: 鋼インゴットを作る（屑）
        desc: さまざまな重作業に使える、頑丈な鋼インゴットを鍛える。
      tarsiliumBarScrap:
        name: タルシリウムインゴットを作る（屑）
    copper:
      copperShield:
        name: 銅の盾を作る
        desc: 銅インゴットから銅の盾を作る。
        activityDesc: 銅インゴットから銅の盾を作る。
      copperSword:
        name: 銅の剣を作る
        desc: 銅インゴットから銅の剣を作る。
        activityDesc: 銅インゴットから銅の剣を作る。
    bronze:
      bronzeShield:
        name: 青銅の盾を作る
        desc: 青銅インゴットから青銅の盾を作る。
