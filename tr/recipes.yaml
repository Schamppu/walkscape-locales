      desc: Kamuflaj yüz boyasını parlak çiçeklerle geliştir.
      activityDesc: Her çiçeğin taç yaprağını güzelce öğütüp kamuflaj yüz boyanla
        karıştırarak daha parlak renkler elde ediyorsun.
    gemTippedPliers:
      name: Cevher uçlu pense yapımı
      desc: Zarif penseyi birkaç cevherle geliştir.
      activityDesc: Eski pense ucunu söküp yerine cevherlerden yaptığın ucu takarak
        penseyi daha kuvvetli bir hale getiriyorsun.
    tintedWoodworkingGlasses:
      name: Renkli camlı marangoz gözlüğü yapımı
      desc: Marangöz gözlüğünü camlarına renk katarak geliştir.
      activityDesc: Öncelikle marangöz gözlüğünden camlarını söküyorsun. Sonra bu
        camları eritip koyu renkli malzemelerle karıştırıyorsun. Karışımın rengini
        daha da koyultmak için birazcık da katrilyum ekliyorsun. Elde ettiğin sonuç
        hem havalı hem de profesyonel bir gözlük oluyor.
