      name: Demir aşçı şapkası yapımı
      desc: Biraz demirotu sicimin yardımıyla bir aşçı şapkasını demir aşçı şapkasına
        çevir.
      activityDesc: Aşçı şapkasına demirotu sicimi işleyerek şapkayı sağlamlaştırıyor,
        daha uzun bir şekil vererek daha sağlam ve ağır bir hale getiriyorsun.
