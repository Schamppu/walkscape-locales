singulars:
  carpentry:
    planks:
      birchPlank:
        name: Huş kereste kesimi
      mangrovePlank:
        name: Mangrov kereste kesimi
      maplePlank:
        name: Akçaağaç kereste kesimi
      oakPlank:
        name: Meşe kereste kesimi
      pinePlank:
        name: Çam kereste kesimi
      sprucePlank:
        name: Ladin kereste kesimi
      teakPlank:
        name: Tik kereste kesimi
      willowPlank:
        name: Söğüt kereste kesimi
      coralPlank:
        name: Mercan kereste kesimi
      bambooPlank:
        name: Bambu kereste kesimi
      elmPlank:
        name: Karaağaç kereste kesimi
      yewPlank:
        name: Porsuk ağacı kereste kesimi
      mahoganyPlank:
        name: Maun kereste kesimi
    scrap:
      mangrovePlankShavings:
        name: Yongadan mangrov kereste yapımı
      teakPlankScrap:
        name: Kırpıntıdan tik kereste yapımı
      sprucePlankScrap:
        name: Kırpıntıdan ladin kereste yapımı
      pinePlankScrap:
        name: Kırpıntıdan çam kereste yapımı
      willowPlankScrap:
        name: Kırpıntıdan söğüt kereste yapımı
      birchPlankScrap:
        name: Kırpıntıdan huş kereste yapımı
      maplePlankScrap:
        name: Kırpıntıdan akçaağaç kereste yapımı
      oakPlankScrap:
        name: Kırpıntıdan meşe kereste yapımı
    misc:
      ectoplasm:
        name: Dışplazma kesimi
    tools:
      pineToolbox:
        name: Çam alet kutusu yapımı
      bambooToolbox:
        name: Bambu alet kutusu yapımı
  crafting:
    tools:
      basicHatchet:
        activityDesc: Dikkatlice yonttuğun taşı çubuğa takarak ilkel bir nacak yapıyorsun.
        desc: Çubuk ve taş kullanarak ağaç kesmek için basit bir alet yapabilirsin.
        name: Basit nacak yapımı
      basicPickaxe:
        activityDesc: Olabildiğince sivrilttiğin taşı sopaya takarak basit bir kazma
          yapıyorsun.
        desc: Sıradan bir sopa ve birkaç taş kullanarak maden çıkarmak için basit
          bir alet yapabilirsin.
        name: Basit kazma yapımı
      bronzeHatchet:
        desc: Ağır odunculuk işleri için sağlam bir bronz nacak üret.
        name: Bronz nacak yapımı
        activityDesc: Özenle şekil verdiğin bronzu bir odunculuk aleti haline getirerek
          bronz bir nacak üretiyorsun.
      stoneSickle:
        desc: Toprağın cömertliğini toplamaya başlamak için basit bir taş orak üret.
        name: Basit orak yapımı
        activityDesc: Bilediğin bir taş parçasını çubuğun ucuna bağlayarak basit bir
          toplama aleti yapıyorsun.
      tarsiliumHatchet:
        desc: Gece semasının karanlığına benzeyen bir nacak üret.
        name: Katrilyum nacak yapımı
        activityDesc: Metale ağaçları kolaylıkla kesebileceği bir şeklin ağır ağır
          verildiği, iyice bilenmiş bir nacak.
      tarsiliumPickaxe:
        desc: Keşiflerini toprağın daha derinlerine taşımak için katrilyum bir kazma
          üret.
        name: Katrilyum kazma yapımı
        activityDesc: Kara metalin üzerine binen onca emek yeni aletini üretebilmeni
          sağlar. Katrilyum kazma işe başlamaya hazır.
      hydriliumHatchet:
        name: Hidrilyum nacak yapımı
        desc: Odun kesip yontmak için tasarlanmış, hidrilyum külçeden yapılma çok
          yönlü bir alet.
        activityDesc: Hidrilyum külçeyi yumuşatmak için demirhanede ısıtıyor, dikkatlice
          nacak başı şekline sokuyorsun. Daha sonra tahtadan bir sap takıyor, güçlü
          bir odunculuk aleti olması için kenarını güzelce biliyorsun.
      hydriliumPickaxe:
        name: Hidrilyum kazma yapımı
        desc: Yer altındaki keşiflerin cefalarına dayanabilecek şekilde tasarlanmış,
          hidrilyum külçesinden yapılan sağlam bir madencilik aleti.
        activityDesc: Hidrilyum külçeyi yumuşatmak için üzerinde çalışıyor, dikkatlice
          kazma başı şekline sokuyorsun. Daha sonra mercandan bir sap takıyor, güçlü
          bir madencilik aleti olması için ucunu güzelce sivritiyorsun.
      hydriliumSickle:
        name: Hidrilyum orak yapımı
        desc: Kusursuzca şekil verilen hidrilyum külçesinden yapılmış keskin ve dayanıklı
          bir toplama aleti.
        activityDesc: Hidrilyum külçeyi yumuşatmak için üzerinde çalışıyor ve orağın
          kıvrımını vererek dikkatlice şekillendiriyorsun. Sonra da kenarını bileyerek
          keskin ve etkili bir toplama aleti yapıyorsun.
      copperSickle:
        name: Bakır orak yapımı
        desc: Çayır çimeni kesmek için basit bir alet olan bir bakır orak üret.
        activityDesc: Bakırı şekillendirerek senin ellerinde birazcık daha verimli
          olacağını vadeden bir orak yapıyorsun.
      ironSickle:
        name: Demir orak yapımı
        desc: Sıradan toplayıcılık işlerinde güvenebileceğin sağlam bir demir orak
          üret.
        activityDesc: Demiri şekillendirerek hem sağlam hem de keskin bir orak yapıyorsun.
      steelSickle:
        name: Çelik orak yapımı
        desc: Daha geniş kullanım alanları olan keskin ve etkili bir çelik orak üret.
        activityDesc: Kızıl yıldızın altındaki tarlaları selamlayarak toplumsal emeğin
          yardımına hazır bir orağı dikkatlice dövüyorsun.
      copperPickaxe:
        name: Bakır kazma yapımı
        desc: Daha verimli madencilik yapmak için sağlam bir bakır kazma üret.
        activityDesc: Bakırı dikkatlice muhteşem bir madencilik aletine çevirerek
          bir bakır kazma üretiyorsun.
      bronzePickaxe:
        name: Bronz kazma yapımı
        desc: Ağır madencilik işleri için ideal olan dayanıklı bir bronz kazma üret.
        activityDesc: Bronz alaşımını büyük bir maharetle dayanıklı bir madencilik
          aletine çevirerek bronz bir kazma üretiyorsun.
      ironPickaxe:
        name: Demir kazma yapımı
        desc: Derinlerdeki madencilik maceraları için güvenilir bir demir kazma üret.
        activityDesc: Demiri ustalıkla şekillendirip itimatlı bir madencilik aletine
          çevirerek demir bir kazma üretiyorsun.
      copperHatchet:
        name: Bakır nacak yapımı
        desc: Daha verimli odunculuk yapmak için bakır bir nacak üret.
        activityDesc: Bakırı titizlikle keskin bir odunculuk aletine çevirerek bakır
          bir nacak üretiyorsun.
      ironHatchet:
        name: Demir nacak yapımı
        desc: Titiz odunculuk işleri için demir bir nacak üret.
        activityDesc: Hünerli bir şekilde, demiri güvenilir bir odunculuk aleti haline
          getirerek demir bir nacak üretiyorsun.
      farganiteHatchet:
        name: Farganit nacak yapımı
        desc: En büyük ağaçların bile kudretine üstün gelebilecek bir nacak yap.
        activityDesc: Ter dökerek nacak yaptığın bu metal, ağaç uzmanı olmaktaki kararlılığının
          gerçek sembolüdür.
      jellyfishingNet:
        name: Denizanası ağı yapımı
        desc: Sağlam malzemeler ve güzel bir ağ kullanarak yapılmış olan denizanası
          yakalama aleti.
        activityDesc: Dayanıklı bir ip kullanarak ördüğün kuvvetli ağı sağlam bir
          sopanın ucuna geçiriyorsun. Ağ aralıklarının suyun kolayca geçebileceği
          kadar geniş ancak denizanalarının yakalanacağı kadar dar olup olmadığını
          kontrol ederek su altında keşif yapmak için kullanışlı bir alet üretiyorsun.
      hydriliumLogSplitter:
        name: Hidrilyum odun yarıcı yapımı
        desc: Hidrilyumun gücünü katarak sağlamlaştırdığın aleti en yüce kütükleri
          bile kolaylıkla ikiye ayırabilen bir hale getir.
        activityDesc: Her çekiç darbesiyle hidrilyumu odun yarıcının içine işliyor,
          onu muazzam kuvvete sahip bir alete çeviriyorsun. Işıl ışıl parlayan metale
          bakarken yeryüzünden aldığın enerjinin damarlarında dolaştığını hissediyorsun.
      steelPickaxe:
        name: Çelik kazma yapımı
        desc: En sert madenleri çıkarabilmek için sapasağlam bir çelik kazma üret.
        activityDesc: Çeliğe titizlikle şekil verip kuvvetli bir madencilik aletine
          çevirerek çelik bir kazma üretiyorsun.
      farganitePickaxe:
        name: Farganit kazma yapımı
        activityDesc: Sağlam metal uyguladığın işlemlere ne kadar dirençli olsa da
          sonunda boyun eğerek toprağa dokunmaya yeniden layık olan bir alet şekline
          giriyor.
        desc: Yer altındaki yolculuklarında daha verimli keşiflerde bulunmanı sağlayacak
          bir farganit kazma üret.
      steelHatchet:
        name: Çelik nacak yapımı
        activityDesc: Çeliğe dikkatlice şekil vererek keskin bir odunculuk aleti yapıyor
          ve çelik bir nacak üretiyorsun.
        desc: Hızlı odunculuk işleri için kuvvetli bir çelik nacak üret.
      hydriliumMinersMagnet:
        name: Hidrilyum mıknatıs yapımı
        desc: Dünyanın derinlerindeki gizli hazineleri kolaylıkla çekip açığa çıkarabilecek
          olan manyetik bir aleti geliştir.
        activityDesc: Bütün dikkatini verdiğin mıknatısı hidrilyumla geliştiriyor
          ve yer altı diyarının sırlarını meydana çıkarabilecek bir alet yapabilmeyi
          umuyorsun.
      theKakesWalkingStick:
        name: Seyyah bastonu yapımı
        desc: Alelade bir yürüyüş bastonunu biraz gümüş kullanarak geliştirip ona
          yepyeni bir yol arkadaşı kimliği kazandır.
        activityDesc: Biraz gümüşle boyadığın bastonu yepyeni bir alet haline getiriyorsun.
          Değerli metal işlemeleri parıldamaya başlayınca yürüyüşlerine ayrı bir hava
          katacağını hissetmeye başlıyorsun.
      bectoFishingRod:
        name: Ruhani olta yapımı
        desc: Biraz kemik ve dışplazmayı bir araya getirerek hayaletli bir balıkçılık
          aleti yap.
        activityDesc: Bir sürü küçük kemik parçasını uç uca ekleyerek uzun ve esnek
          bir olta yapıyorsun. Daha sonra dışplazmayı olabildiğince incelterek elde
          ettiğin misinayı bu oltanın ucuna yerleştiriyorsun.
      adamantPickaxe:
        name: Sertaş kazma yapımı
        activityDesc: Sertaşı kazma başı şekline sokmak için uğraşıyorsun. İlk başta
          fazlasıyla zor gelse de sonunda istediğin şekli alıyor. Az kalsın porsuk
          ağacı kerestesiyle de uğraşman gerektiğini unutuyordun. Ancak onu da buyruğun
          altına alıp yeni bir sap şekline sokuyorsun. Bir araya gelince yepyeni bir
          sertaş kazma oluyorlar.
        desc: Sertaş madeni ve porsuk ağacını buluşturarak madencilik yapmak için
          bir kazma üret.
      violiteSickle:
        name: Lilayit orak yapımı
        desc: Lilayit madeni ve maun ağacını buluşturarak toplayıcılık yapmak için
          bir orak üret.
        activityDesc: Fazlazıyla uğraş gerektirse de nihayet demirotu sicimini kullanarak
          kendi yaptığın kıvrımlı lilayit bıçağı maun sapa bağlamayı başarıyorsun.
          Orağın bıçağı bu tutsaklığa duyduğu hiddetle titreyip daha da kıvrılıyor.
      bectoWrench:
        name: Ruhani somun anahtarı yapımı
        activityDesc: Birbirine geçirdiğin kemiklerden oluşturduğun uzun sapın ucuna
          dışplazmadan yaptığın kıskaçları yerleştiriyorsun.
        desc: Biraz kemik ve dışplazmayı bir araya getirerek hayaletli bir zanaatkarlık
          aleti yap.
      bronzeWrench:
        name: Bronz somun anahtarı yapımı
        desc: Bir somun anahtarını bronz kaplayarak geliştir.
        activityDesc: Basit aletin dışına ince bir bronz kaplama ekliyorsun. Umalım
          da bu işlem somun anahtarını geliştirsin.
      hydriliumWrench:
        name: Hidrilyum somun anahtarı yapımı
        desc: Basit somun anahtarını hidrilyum olarak bilinen su altı malzemesiyle
          geliştir.
        activityDesc: Somun anahtarının dışını esnek hidrilyumla kaplayarak üreticinin
          asıl tasarımının çok ötesine taşıyorsun. Garanti kapsamından çıkardığın
          kesin.
      bronzePan:
        name: Bronz tava yapımı
        desc: Bir tavayı bronz metal kaplama ile geliştir.
        activityDesc: Orijinal tavanın tabanına bronz kaplama uyguladıktan sonra eski
          sapına daha da sıkı şekilde geri takıyorsun. Sanki bir kalkana sap takmışsın
          gibi oldu.
      jadeTippedSteelPan:
        name: Yeşim uçlu çelik tava yapımı
        desc: Sapına yeşim cevheri işlediğin tavayı yepyeni bir çelik tabanla geliştir.
        activityDesc: Bütün parçaları bir araya getirerek oluşturduğun dayanıklı ve
          de kullanışlı tavayı sapına eklediğin yeşim cevheriyle tamamlıyorsun.
      bronzeChisel:
        name: Bronz keski yapımı
        desc: Takıcılık ve marangozluk yaparken kullanmak için basit bir keskiyi bronz
          bıçak ekleyerek geliştir.
        activityDesc: Hem takıcılık hem de marangozluk yapmak için kullanışlı bir
          alet üretmek için keskinin ucunu bronzla geliştirdikten sonra parçalarını
          yeniden bir araya getiriyorsun.
      topazTippedChisel:
        name: Topaz kenarlı keski yapımı
        desc: Bir keskiyi topazla birleştirerek geliştir.
        activityDesc: Zaten fazlasıyla keskin olan keskiye topaz uç ekleyerek son
          derece incelikli bir alet haline getiriyorsun.
      bectoPickaxe:
        name: Ruhani kazma yapımı
        desc: Biraz kemik ve dışplazmayı bir araya getirerek hayaletli bir madencilik
          aleti yap.
        activityDesc: Kemikleri birleştirip büyük bir sap haline getirdikten sonra
          iki sivri uçlu şekil verdiğin dışplazmayı bu sapın bir ucuna yerleştiriyorsun.
      bectoHatchet:
        name: Ruhani nacak yapımı
        desc: Biraz kemik ve dışplazmayı bir araya getirerek hayaletli bir odunculuk
          aleti yap.
        activityDesc: Kemikleri birleştirip büyük bir sap haline getirdikten sonra
          kalın ve büyük bir bıçak şekli verdiğin dışplazmayı bu sapın bir ucuna yerleştiriyorsun.
      bectoSickle:
        name: Ruhani orak yapımı
        desc: Biraz kemik ve dışplazmayı bir araya getirerek hayaletli bir toplayıcılık
          aleti yap.
        activityDesc: Kemikleri birleştirip uzun ve sağlam bir sap haline getirdikten
          sonra yine uzun ve kıvrımlı bir bıçak şekli verdiğin dışplazmayı bu sapın
          bir ucuna yerleştiriyorsun.
      bectoFishingCagespear:
        name: Ruhani kafesli balık mızrağı yapımı
        desc: Biraz kemik ve dışplazmayı bir araya getirerek hayaletli bir çok amaçlı
          balıkçılık aleti yap.
        activityDesc: Kemikleri zorla bir araya getirerek daha da uzun bir şekle sokuyor,
          dışplazmaya ise birkaç kancadan oluşan bir şekil veriyorsun. Daha sonra
          hepsini bir araya getirerek kafesimsi bir kutu elde ediyorsun.
      bectoHammer:
        name: Ruhani çekiç yapımı
        desc: Biraz kemik ve dışplazmayı bir araya getirerek hayaletli bir demircilik
          aleti yap.
        activityDesc: Kemikleri birleştirip kuvvetli bir sap haline getirdikten sonra
          bu sapın ucuna kalın dışplazma kütlesini yerleştiriyor, böylece sağlam bir
          çekiç başı elde ediyorsun.
      bectoSaw:
        name: Ruhani testere yapımı
        desc: Biraz kemik ve dışplazmayı bir araya getirerek hayaletli bir marangozluk
          aleti yap.
        activityDesc: Bir kemik kümesini kullanarak kuvvetli bir sap elde edip düzleştirerek
          tırtıklı bir kenar verdiğin dışplazmaya ekliyorsun.
      bectoPan:
        name: Ruhani tava yapımı
        desc: Biraz kemik ve dışplazmayı bir araya getirerek hayaletli bir aşçılık
          aleti yap.
        activityDesc: Kemikleri birleştirip güzel bir sap haline getirdikten sonra
          düzleştirip de kenarlarına eşit şekilde kıvrım verdiğin dışplazmaya ekliyorsun.
      bectoChisel:
        name: Ruhani keski yapımı
        desc: Biraz kemik ve dışplazmayı bir araya getirerek hayaletli bir takıcılık
          ve marangozluk aleti yap.
        activityDesc: Kemikleri birleştirip küçük bir sap haline getirdikten sonra
          uzun ve yassı bir uç şekli verdiğin dışplazmaya ekliyorsun.
      bronzeSaw:
        name: Bronz testere yapımı
        desc: Basit bir testereyi bronz kullanarak geliştir.
        activityDesc: İlk testerenin bıçağını bronz kullanarak geliştiriyorsun.
      tarsiliumSaw:
        name: Katrilyum testere yapımı
        desc: Katrilyum metalinin gücüyle bir testereyi geliştir.
        activityDesc: Tahta sapına geri yerleştirmeye çalışırken son derece keskin
          olan katrilyum testerenin bıçağıyla birkaç yerini kazara kesiyorsun.
      bronzeHammer:
        name: Bronz çekiç yapımı
        desc: Basit çekicini geliştirip bronz çekice çevir.
        activityDesc: Neredeyse yumuşak sayılacak bronz ile dışını kapladığın çekiç
          başını tahta sapına geri takıyorsun.
      tarsiliumHammer:
        name: Katrilyum çekiç yapımı
        desc: Çekicini kuvvetli katrilyumla geliştir.
        activityDesc: Katrilyum her ne kadar keskinliğiyle tanınıyor olsa da aynı
          zamanda çekiç başı gibi küt cisimler yaparken de güvenilir bir malzemedir.
          Bunun gibi düşünceleri aklından geçirirken katrilyum çekici bir araya getiriyorsun.
      adamantHatchet:
        name: Sertaş nacak yapımı
        desc: Sertaş madeni ve porsuk ağacını buluşturarak odunculuk yapmak için bir
          nacak üret.
        activityDesc: Bu defa sertaşı zorla dize getirmek yerine yemek ısmarlayarak
          gönlünü almayı deniyorsun. Ne yazık ki sadece bir metal külçesi olduğu için
          pek de umurunda olmuyor. Mırın kırın ederek nacak başı şeklini aldıktan
          sonra porsuk ağacından yapılma sapa takılıyor. Beraber geçirdiğiniz zamanı
          daima hatırlayacaksın.
      violitePickaxe:
        name: Lilayit kazma yapımı
        desc: Lilayit madeni ve maun ağacını buluşturarak madencilik yapmak için bir
          kazma üret.
        activityDesc: 'Kazma başı şeklini alana kadar eline geçen her aleti lilayit
          külçeler üzerinde deniyorsun. Sonra aynı işlemi kazma sapına dönüşene kadar
          maun kereste üzerinde de uyguluyorsun. Yeni kazmanın başıyla sapını birleştirir
          birleştirmez hissedebiliyorsun: Canı maden çekiyor.'
      violiteHatchet:
        name: Lilayit nacak yapımı
        desc: Lilayit madeni ve maun ağacını buluşturarak odunculuk yapmak için bir
          nacak üret.
        activityDesc: Lilayiti maun sapa takacağın kalın ve keskin bir bıçak şekline
          sokana kadar hararetle çalışıyorsun. Ağaçlara karşı öyle güçlü bir şey çıkıyor
          ki bir daha isyana kalkışamazlar.
    misc:
      hydrilium:
        desc: Hidrilyum yapmak için su yosunuyla volkanik taşı birleştir.
        name: Hidrilyum yapımı
        activityDesc: Hidrilyum yapmak için su yosunuyla volkanik taşı birleştiriyorsun.
      bagofRocks:
        name: Taş çantası yapımı
        desc: Kocaman bir taşı sağlam bir dalın ucunda taşıyan bir taş çantası üret.
        activityDesc: Taşlar dalın ucunda taşınıyor. Öyle ağır ki.
      elderhideRope:
        name: Bayrıpost sicim yapımı
        desc: En yerinde duramayan şeyleri bile sabitleyebilecek kadar güçlü bir sicimi
          sert post kullanarak ör.
        activityDesc: Kararlı eller ve odaklanmış bir zihinle, bayrıpostu örerek oldukça
          sağlam ve dayanıklı bir sicim yapıyorsun.
      kelpRope:
        name: Su yosunu sicim yapımı
        desc: Kurutulmuş su yosunu ipliklerini bir arada eğirerek sağlam ve esnek
          bir sicim üret.
        activityDesc: Su yosunu ipliklerini güzelce temizleyerek fazlalıkları ayıklıyorsun.
          Daha sonra bir araya getirip dikkatlice eğirerek kıyı boyunca pek çok şey
          için kullanabileceğin dayanıklı bir sicime dönüştürüyorsun.
      trash:
        name: Çöp geri dönüşümü
        desc: Çöpü elden geçirerek kullanışlı bir şeye çevir.
        activityDesc: Her fikre açık bir şekilde çöpü inceleyip başka ne için kullanabileceğini
          buluyorsun.
      hardenedKelp:
        name: Su yosunu kurutma
        desc: Taze su yosununu daha sonra kullanmak üzere kurutarak okyanusun hazinesini
          muhafaza et.
        activityDesc: Taze su yosununu güzelce temizleyerek fazlalıkları ayıklıyorsun.
          Sonra onları kuru ve havadar bir yere serip nemden uzak tutuyorsun. Su yosununun
          iyice kuruyup raf ömrü uzun bir malzemeye dönüşmesini sabırla bekliyorsun.
      rope:
        name: Keten eğirme
        desc: Keten eğirerek biraz sicim yap.
        activityDesc: Çıkrıkta sıkılaşan keten örülerek sağlam bir sicim oluyor.
      ironweedTwine:
        name: Demirotu sicim yapımı
        desc: Demirotunu örerek kuvvetli bir sicime çevir.
        activityDesc: Bin bir zahmetle demirotunu ince ipliklere ayırıp tekrar örerek
          kuvvetli bir sicim demetine çeviriyorsun.
    fishing:
      basicFishingRod:
        name: Basit olta yapımı
        desc: Birkaç kereste ve biraz misina yardımıyla basit bir olta üret.
        activityDesc: Keresteleri dikkatlice inceltip birbirine ekledikten sonra ucuna
          misinayı takarak basit bir balık oltası yapıyorsun.
      oakFishingRod:
        name: Meşe olta yapımı
        desc: Birkaç kereste ve biraz misina yardımıyla bir meşe olta üret.
        activityDesc: Meşe odununun sıkı ve sert bir yapısı vardır. Dolayısıyla oltanın
          sapını yapman biraz sürüyor ancak sağlam bir oltayla müfakatını alıyorsun.
      lobsterPot:
        name: Istakoz kafesi yapımı
        desc: Birkaç kereste ve metal külçe yardımıyla bir ıstakoz kafesi üret.
        activityDesc: Bu iş senin için yepyeni bir şey olsa bile farklı bir şey inşa
          edebilecek kadar ilerlediğini düşünüyorsun.
      smallFishingNet:
        name: Basit balık ağı örme
        activityDesc: Sicimi örerek ufak düğümler atıyor ve küçük bir balık ağına
          çeviriyorsun.
        desc: Biraz sicim kullanarak basit bir balık ağı yap.
      largeFishingNet:
        name: Büyük balık ağı örme
        activityDesc: Sicimi örüp kocaman düğümlerden oluşan özenli bir örüntü kurarak
          büyük bir balık ağına çeviriyorsun.
        desc: Biraz sicim kullanarak daha büyük bir balık ağı yap.
      advancedFishingRod:
        name: Gelişmiş olta yapımı
        desc: Birkaç kereste ve biraz misina yardımıyla bir gelişmiş olta üret.
        activityDesc: Birkaç farklı odun üzerinde çalıştıktan sonra eski oltanı nasıl
          daha iyi hale getirebileceğini çözmen gayet kolay oluyor. Misinayı heyecanla
          ekleyerek gelişmiş oltanı tamamlıyorsun.
      coralFishingSpear:
        name: Mercan balık mızrağı yapımı
        desc: Mercan ve hidrilyum kullanarak üretilen, su altında avlanmak için tasarlanmış
          dayanıklı bir silah.
        activityDesc: Sağlam bir mercan parçasını mızrağın gövdesi olarak kullanmak
          için seçiyorsun. Ucuna sivriltilmiş bir hidrilyum mızrak ucu takarak su
          altındaki avlarını delip geçebilecek etkileyici bir balık mızrağı üretiyorsun.
      elderhideFishingNet:
        name: Bayrıpost balık ağı yapımı
        desc: Sert bayrıpostu kullanarak en kıvrak balıkları bile yakalayabilecek
          bir ağ ör.
        activityDesc: Sabır ve titizlik içinde bayrıpostu örerek bir ağ yapıyor, attığın
          her düğümle zengin bir ödülü garantiliyorsun. Bu ağın kendine has özellikleri
          en ürkek balıkları bile kendine çekecektir.
      pineFishingRod:
        name: Çam olta yapımı
        desc: Birkaç kereste ve biraz misina yardımıyla bir çam olta üret.
        activityDesc: Çam odunu öyle yumuşak ki işin bir çırpıda ilerliyor. Misinayı
          da taktıktan sonra yeni oltan kullanıma hazır.
      willowFishingRod:
        name: Söğüt olta yapımı
        desc: Birkaç kereste ve biraz misina yardımıyla bir söğüt olta üret.
        activityDesc: Hafif ama sağlam söğüt keresteler titiz işler çıkarmanı mümkün
          kılar. Misinayı da ekleyerek yeni oltanı tamamlıyorsun.
      fishingSpear:
        name: Balık mızrağı yapımı
        desc: Sağlam bir odun sap ile sivri bir metal uçtan oluşan su altında avlanma
          aleti.
        activityDesc: Mızrağın sapını yapmak için seçtiğin yeterince uzun bir odunu
          istediğin şekle sokuyorsun. Bir ucuna sivriltilmiş bir metal uç ekleyerek
          basit bir balık mızrağı üretiyorsun.
    diving:
      kelpDivingMask:
        name: Yosun dalış maskesi dikimi
        desc: Su altında görmeyi kolaylaştırmak için kurutulmuş su yosunundan yapılan,
          üzerinde göz delikleri bulunan ve yüzüne tam oturan bir maske.
