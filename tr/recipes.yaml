      name: Ekstra becerikli pantolon yapımı
      desc: Zanaatkar pantolonunu birkaç aletle geliştir.
      activityDesc: Zanaatkar pantolonuna sürgülü cetvel ve basit somun anahtarını
        mucizevi bir şekilde ekleyerek ekstra becerikli bir pantolon yapıyorsun.
