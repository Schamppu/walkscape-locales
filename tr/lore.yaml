singulars:
  firstBirthdayLetter:
    p1: "Selamlar!\n\nBen iyi dostun Herbert! Sen Arenum'da boy göstereli bir sene
      geçtiğine inanamıyorum doğrusu.\n\nEminim bayağı bir ilerleme katetmişsindir
      ve daha da gelişmeye devam edeceksindir. Tahminimce artık pek ihtiyacın olmasa
      bile fazladan birkaç tahta çubuk, taş ve sicimin ne zaman lazım olursa burada
      seni beklediğini bilesin.\n\nOlur da uğrayabilirsen şöminemin karşısında ısınırken
      bana maceralarından bahsedebilirsin. Artık o maceralara geri dönmen gerekir
      diye düşündüğüm için mektubumu burada bitiriyorum.\n\nKendine çok iyi bak <icon
      i=\"Favorited\" />, daha sonra görüşmek üzere!\n\n-*Herbert*\n"
  secondBirthdayLetter:
    p1: "Tekrar merhaba!\n\nBir sene daha geçti mi yahu? Ne de çabuk geçiyorlar, göz
      açıp kapayıncaya kadar bir tanesi daha geçecek sanırım.\n\nUmuyorum ki güzelce
      ilerleyip kendini geliştirmişsindir. Ara sıra bana bir uğrayıp başından geçenleri
      mutlaka bizzat anlatmalısın.\n\nEminim çoğu tüccarın gitmeye yeltenebileceğinden
      daha uzaklara gitmişsindir artık. Tüccar demişken, buradakiler yine kulübemi
      satın almak istediler. Yerine kocaman bir market mi ne açmak için harika bir
      yermiş ama benim hiçbir yere gitmeye niyetim yok. Sonuçta yolculuğun sırasında
      dinlenmek için uğrayabileceğin bir yere intiyacın olabilir!\n\nEh, ihtiyar adamın
      gevezeliği bu kadar yeter, kendine dikkat et!\n-*Herbert*\n"
