singulars:
  firstBirthdayLetter:
    p1: "이봐!\n\n나야, 자네의 친구 허버트라네. 벌써 자네가 아레눔에 나타난게 일년 전이라니 믿을수 없군.\n\n그동안 자네가 유의미한
      성장을 했을거라 믿네. 앞으로도 계속 발전할 일만 남았겠군. 이제 자네에게 큰 쓸모가 없을 수도 있지만, 여전히 이곳에는 내가 찾은 자투리
      막대기와 돌멩이들 그리고 노끈들이 준비되어 있다네.\n\n몸을 녹일곳이 필요하다면 언제든 들려 자네의 여행 이야기를 들려주게나. 바쁠테니
      이만 줄이겠네.\n\n몸 잘 챙기게 <icon i=\"Favorited\" />, 다음에 또 얘기하자구! \n\n- *허버트*\n"
