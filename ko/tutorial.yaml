singulars:
  welcomeMessage:
    pages:
      p0:
        sections:
          s0: "클로즈베타에 참여해 주셔서 감사합니다, <c><player/><c/>.\n\n아시다시피, 이게임은 아직 개발중에 있으며
            플레이 가능한 부분은 게임의 코어에 제한되어 있지만 부족한 컨텐츠는 베타기간중에 지속적으로 추가하고 있습니다.\n\n버그, 시스템
            허점, 밸런스 문제등이 발견될 수 있늡니다. 이에 따른 결과로 롤백 혹은 서버리셋이 요구될 수 있습니다. 두 방법 모두 최악의
            경우의 방법이지만 가능성을 염두하여 주십시오.\n\n참여해 주시고 테스트 유저가 되어 주셔서 감사합니다. 페이지 하단의 <hl>다음</hl>
            버튼을 눌러 튜토리얼을 계속하거나 나가기를 택할 수 있습니다. 독특한 게임방식인 만큼 처음 플레이 할시, 튜토리얼을 완료하시기를
            추천합니다.\n"
        title: 워크스케이프 세계에 오신걸 환영합니다!
