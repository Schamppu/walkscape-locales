singulars:
  welcomeMessage:
    pages:
      p0:
        sections:
          s0: "클로즈베타에 참여해 주셔서 감사합니다, <c><player/><c/>.\n\n아시다시피, 이게임은 아직 개발중에 있으며
            플레이 가능한 부분은 게임의 코어에 제한되어 있지만 부족한 컨텐츠는 베타기간중에 지속적으로 추가하고 있습니다.\n\nThere
            might also be issues: bugs, exploits and unbalanced content found in the
            game. Some of these might result in needing to either roll back or restart
            the server - both of which we want to avoid as much as possible, but important
            to keep in mind that they're a possibility.\n\nWith all of that out of
            the way, thank you for joining us, and helping to test the game. You can
            continue this tutorial by either pressing <hl>NEXT</hl> at the bottom
            of the page, or pressing to quit the tutorial. I highly recommend to play
            through the tutorial, as the game is quite different.\n"
        title: 워크스케이프 세계에 오신걸 환영합니다!
