maps:
  tips:
    "5": Przycisk szczypiec u dołu ekranu otwiera <hl>interfejs 
      rzemieślniczy</hl>.
    "8": Znalezione znajdźki dostarczają tobie 1 <hl>punkt osiągnięć</hl> za 
      każdy przedmiot!
    "9": Wielu NPC-ów może podzielić się z tobą <hl>plotkami</hl>, które pomogą 
      Ci znaleźć przedmioty w grze.
    "12": Upewnij się, że <hl>wyposażyłeś</hl> swoje przedmioty, aby uzyskać ich
      efekty, większość z nich nie działa wyłącznie z ekwipunku.
    "18": Poziomy umiejętności przekraczające główne wymagania umiejętności dla 
      danej <hl>aktywności</hl> zapewniają +1,25% dodatkowej <hl>wydajność 
      pracy</hl> w wykonywanej przez Ciebie pracy, aż do 20 poziomów.
    "1": Podstawowa szansa na znalezienie <itemTag tag="fine"/> materiału wynosi
      <hl>1/100</hl>, którą możesz zwiększyć za pomocą lepszego wyposażenia i 
      narzędzi.
    "2": Podstawowa szansa na znalezienie skrzyni wynosi <hl>1/250</hl>, którą 
      możesz zwiększyć za pomocą lepszego wyposażenia i narzędzi.
    "0": Nadmierne przeciążenie jedynie spowalnia Twoje działania, ale nie ma 
      wpływu na podróżowanie.
    "3": 'Atrybuty zawierające symbol procentu <hl>%</hl> są mnożone (na przykład:
      +10% do wyszukiwania materiałów świetnej jakości daje wynik 1,1/100).'
    "4": Długie przytrzymanie palca na przedmiocie otwiera opcje wielokrotnego 
      wyboru w ekwipunku.
    "16": Znalazłeś coś niedziałającego poprawnie lub masz sugestię? Zgłoś to 
      nam na <a href="https://discord.gg/Kk6VecJFEk" 
      c="lightPurple">Discord</a>! Twoje zgłoszenia pomagają ulepszać grę!
    "10": W <hl>rozwijane menu</hl> w prawym dolnym rogu (lub w lewym dolnym 
      rogu w trybie dla leworęcznych) znajduje się <hl>WalkPedia</hl>, która 
      pomoże Ci śledzić całkowite postępy.
    "6": Po naciśnięciu minimapy w prawym górnym rogu zostanie wyświetlona pełna
      mapa zawierająca opcje podróży.
    "7": Możesz zobaczyć <hl>osiągnięcia</hl> i <hl>znajdźki</hl> dotykając 
      swojej postaci w lewym górnym rogu.
    "11": Zwróć uwagę na szczegóły osiągnięć – niektóre liczą się jako 
      odblokowane tylko wtedy, gdy przedmiot pochodzi bezpośrednio z określonej 
      aktywności.
    "13": Miejsce w banku jest nieograniczone, jeśli martwisz się o zużycie 
      czegoś, zdeponuj to!
    "15": Sprawdź nasz <a href="https://portal.walkscape.app" 
      c="lightGreen">Portal</a>, <a href="https://www.reddit.com/r/walkscape" 
      c="lightRed">Reddit</a> i <a href="https://discord.gg/Kk6VecJFEk" 
      c="lightPurple">Discord</a>, aby być na bieżąco z ogłoszeniami, 
      aktualnościami i blogami o rozwoju.
    "17": <hl>Wynik jakości</hl> pomoże zwiększyć szanse na uzyskanie 
      przedmiotów lepszej jakości, widocznych na dole jako <hl>przepisy</hl> w 
      <hl>interfejsie rzemieślniczy</hl>.
    "14": Jeśli trwają prace konserwacyjne, nie martw się – Twoje kroki 
      zazwyczaj nadal będą liczone podczas przerwy. Sprawdź ogłoszenia na <a 
      href="https://discord.gg/Kk6VecJFEk" c="lightPurple">Discord</a>, aby się 
      upewnić!
    "19": Poziomy umiejętności przekraczające główne wymagania <hl>przepis</hl> 
      w <hl>interfejs rzemieślniczy</hl> zapewniają dodatkowy <hl>wynik 
      jakości</hl>.
    "20": Założenie zestawu wyposażenia podczas pobytu w banku automatycznie 
      spowoduje pobranie wszystkich przedmiotów z banku.
    "22": Chcesz znaleźć coś konkretnego w grze i nie przeszkadzają ci spoilery?
      Sprawdź <a href="https://wiki.walkscape.app" c="yellow">Wiki</a>!
    "24": Aktywności łowieckie wymagające materiałów dają <hl>podwójne</hl> 
      wyniki rzutów w głównej tabeli łupów!
    "21": Aktywności łowieckie wymagające materiałów otrzymują <hl>bonusy</hl> 
      za korzystanie z ich <itemTag tag="fine"/> wersji! Sprawdź w interfejsie, 
      co oferują!
    "23": Podoba Ci się gra? To zasługa wszystkich naszych fanów, którzy 
      wspierali nas na <a href="https://www.patreon.com/WalkScape" 
      c="yellow">Patreonie</a> i <a href="https://buymeacoffee.com/walkscape" 
      c="yellow">Buy Me A Coffee</a>!
    "25": Umiejętności tego samego rodzaju współdzielą czas odnowienia i nie 
      kumulują się w przypadku posiadania kilku egzemplarzy tego samego typu.
  skillTypes:
    "artisan": Umiejętności rzemieślnicze obejmują <skill skill="cooking"/>, 
      <skill skill="crafting"/>, <skill skill="carpentry"/>, <skill 
      skill="smithing"/> , <skill skill="tailoring"/>oraz<skill 
      skill="trinketry"/>.
    "gathering": Umiejętności zbierackie obejmują <skill skill="foraging"/>, 
      <skill skill="fishing"/>, <skill skill="hunting"/>, <skill 
      skill="mining"/> oraz <skill skill="woodcutting"/>.
    "utility": Umiejętności użyteczne obejmują <skill skill="agility"/>.
singulars:
  info:
    lockFavoriteItem: "<icon i=\"Favorited\"/> <c i=0>Favorite</c>: Nie możesz upuścić
      ani sprzedać tego przedmiotu. Nadal możesz go używać do rzemiosła, zleceń i
      innych działań.\n\n<icon i=\"Locked\"/> <c i=1>Lock</c>: Nie możesz sprzedać,
      upuścić ani zdeponować tego przedmiotu, gdy jest zablokowany. Nadal możesz go
      używać do rzemiosła, zleceń i innych działań.\n\nZablokowanie lub dodanie przedmiotu
      do ulubionych dotyczy wszystkich podobnych przedmiotów w Twoim ekwipunku i banku.
      Możesz również odblokować lub usunąć przedmioty z ulubionych w swoim ekwipunku
      lub banku."
    bankUsage: "Długie naciśnięcie przycisku wpłaty lub wypłaty umożliwia wpłatę lub
      wypłatę do <c i=0>1000</c> pozycji jednocześnie. Możesz skorzystać z wyszukiwarki
      banku, aby szybko znaleźć pozycje. Możesz wyszukiwać według <c i=0>nazwy, słów
      kluczowych, umiejętności lub pozycji</c>.\n\n<c i=0>Twój bank ma nieograniczoną
      pojemność!</c>\n\nMożesz również użyć przełącznika <icon i=\"Favorited\"/> <c
      i=1>Favorite</c>, aby wyświetlić tylko ulubione pozycje."
    inventoryUsage: "Długie wciśnięcie stacków <c i=0>open multi-selection mode</c>,
      umożliwiając jednoczesne wybranie wielu stacków do upuszczenia lub zdeponowania.\n\
      \nThe <c i=0>Options</c> Ten przycisk na dole ekranu umożliwia zmianę sposobu
      wyświetlania stacków przedmiotów.\n\n<bp/><icon i=\"Deposit\"/> <hl>All</hl>:
      Deponuje wszystkie przedmioty z Twojego ekwipunku do banku, jeśli jest on dostępny
      w Twojej lokacji.\n\n<bp/><icon i=\"Bank small\"/> <hl>Bank</hl>: Otwiera Twój
      bank i umożliwia dokonywanie wpłat lub wypłat, jeśli jest on dostępny w Twojej
      lokacji.\n\n<bp/><icon i=\"Sort\"/> <hl>Sort</hl>: Sortuje Twój ekwipunek.\n"
    inventoryFull: Twój ekwipunek jest pełny! W przypadku wszystkich aktywności,
      z wyjątkiem podróży, nadmierne obciążenie spowolni twoje działania. Możesz
      albo udać się do banku, aby zdeponować przedmioty, albo wyrzucić trochę 
      przedmiotów w ekwipunku, aby zrobić miejsce.
    claimPet: Po odebraniu zwierzaka zostanie on dodany do Twoich pupili i 
      będziesz mógł go wykluć i przywołać w dowolnym momencie. Nie możesz 
      wymieniać się odebranymi zwierzakami, ponieważ stają się one <c>przypisane
      do Twojej postaci</c>.
    attributeTypes: "<bp/><icon i=\"Gear alt\"/>  <c i=0>Założone wyposażenie</c>:
      atrybuty z aktualnie założonego wyposażenia.\n\n<bp/><icon i=\"Tools alt\"/>\
      \  <c i=1>Założone narzędzia</c>: atrybuty z aktualnie założonych narzędzi.\n\
      \n<bp/><icon i=\"Collectible\"/>  <c i=2>Znajdźki</c>: trwałe atrybuty ze znajdziek.\n\
      \n<bp/><icon i=\"Dev services\"/>  <c i=3>Usługi</c>: atrybuty z dostępnych
      usług w danej lokacji.\n\n<bp/><icon i=\"Pets\"/>  <c i=4>Pupile</c>: atrybuty
      z twoich przyzwanych pupili.\n\n<bp/><icon i=\"Fine material\"/>  <c i=5>Bonus
      świetnych materiałów</c>: bonus otrzymywany z użycia świetnych materiałów.\n\
      \n<bp/><icon i=\"Material\"/>  <c i=6>Wkład materiałów</c>: atrybuty otrzymane
      z użytych do aktywności materiałów.\n\n<bp/><icon i=\"Consumables\"/>  <c i=7>Przedmioty
      używalne</c>: atrybuty otrzymane z przedmiotów używalnych, które są aktywowane.\n\
      \n<bp/><icon i=\"Level up\"/>  <c i=8>Poziom umiejętności</c>: atrybuty otrzymywane
      z poziomu umiejętności (np. z posiadania poziomu ponad wymagany).\n\n<bp/><icon
      i=\"Abilities\"/>  <c i=9>Zdolności</c>: atrybuty otrzymane ze zdolności.\n\n\
      <bp/><icon i=\"Player effect\"/>  <c i=10>Aktywne efekty</c>: atrybuty otrzymywane
      z aktywnych efektów.\n"
    mailbox: Możesz odebrać przedmioty, które otrzymujesz z wydarzeń, handlu z 
      innymi graczami oraz ze swojej skrzynki.
    swapToItemSources: 'Ten atrybut przekształca te przedmioty w momencie ich znalezienia:'
    swapToXpSources: 'Ten atrybut zamienia przedmioty na punkty doświadczenia po ich
      znalezieniu:'
    swapToTablesSources: 'Ten atrybut sprawia, że przedmioty stają się wyjątkowym
      znaleziskiem w momencie ich odnalezienia:'
    worldMapIcons: "<image id=\"bank\"/> <hl>Bank</hl>: Wpłacaj i wypłacaj przedmioty
      w banku.\n\n<image id=\"deposit\"/> <hl>Skrytka</hl>: Podobnie jak wyżej, ale
      umożliwia tylko wpłacanie przedmiotów.\n\n<image id=\"store\"/> <hl>Sklep</hl>:
      Kupuj i sprzedawaj różne rzeczy!\n\n<image id=\"mysteriousMerchant\"/> <hl>Tajemniczy
      kupiec</hl>: Dostawca egzotycznych towarów.\n\n<image id=\"jobBoard\"/> <hl>Tablica
      ogłoszeń</hl>: Codzienne zlecenia dla wędrowców poszukujących nagród i reputacji.\n\
      \n<image id=\"barber\"/> <hl>Fryzjer</hl> oraz <image id=\"wardrobe\"/> <hl>Garderoba</hl>:
      Zmień swój wygląd.\n\n<image id=\"forge\"/> <image id=\"kitchen\"/><image id=\"\
      workshop\"/> <image id=\"sawmill\"/><image id=\"loom\"/> <image id=\"trinketry\"\
      /> <hl>Stanowiska rzemieślnicze</hl>: Miejsca do kowalstwa, gotowania, wytwarzania
      przedmiotów, stolarstwa, krawiectwa oraz tworzenia drobiazgów.\n\nKolor obwódki
      ikony wskazuje na poziom danej usługi: <image id=\"forge\"/> <serviceTier tier=\"\
      basic\"/> (podstawowy) lub <image id=\"forgeAdvanced\"/> <serviceTier tier=\"\
      advanced\"/> (zaawansowany).\n\n<icon path=\"assets/icons/location_badges/unexplored_badge.png\"\
      \ size=\"16\"/> <hl>Nieodkryte</hl>: jeszcze nie odwiedziłeś tej lokacji.\n\n\
      <icon path=\"assets/icons/location_badges/rumor_badge.png\" size=\"16\"/> <hl>Znane
      z pogłosek</hl>: słyszałeś plotki o tej lokacji."
    claimCosmeticDrop: Przypisując kosmetyczny przedmiot, który ci wypadł 
      <c>zużywasz go</c> i trwale odblokowujesz ten przedmiot dla swojej 
      postaci, możesz wtedy założyć go w garderobie. Nie można tego cofnąć, a 
      przedmioty kosmetyczne, któe już posiadasz więcej nie będą wypadać.
    claimBlueprint: Przypisując schemat <c>zużywasz go</c> i trwale odblokowuje 
      on recepturę, której uczy. Stale możesz posiadać tylko jedną kopię 
      schematu, a przypisanie go nie może być cofnięte.
    swapXpFromEffort: 'Ten atrybut przekształca przedmioty w doświadczenie. Oto, co
      otrzymasz z różnych przedmiotów:'
    trading: |
      Wyświetl wszystkie aktywne wymiany i ich status.
      <bp/> Wymiany można dokonywać z dowolnego miejsca. Przedmioty dodane do wymiany są pobierane z Twojego <icon i="Bank small"/> banku. Przedmioty dodane do wymiany są pobierane z Twojego banku, a ich usunięcie powoduje ich zwrot do tego miejsca.
      <bp/> Wymiany są inicjowane przez wybór postaci poprzez stronę <socialPage /> i wysyłając <c>zaproszenie do wymiany</c>.
      <bp/> Wymiana zostaje sfinalizowana, gdy obie strony <icon i="Accept"/> zaakceptują przedstawione oferty. Wszelkie zmiany wprowadzone przez drugą stronę wymagają ponownej akceptacji.
      <bp/> Przedmioty z wymiany ukończonej <icon i="Accept small"/> lub odrzuconej <icon i="Cross small"/> są wysłane do twojej skrzynki <icon i="Mailbox general"/>.
      <bp/> Z danym graczem możesz prowadzić tylko jedną wymianę jednocześnie.
      <bp/> Odwiedź nasz <a href="https://discord.gg/Kk6VecJFEk" c="lightPurple">Discord</a>, by pomóc w tworzeniu negocjacji handlowych i ofert sprzedaży lub kupna, których szukasz.
    wealthEarned: |-
      <c>Zdobyty majątek</c> to wartość monet, którą zdobywasz grając: zdobywając materiały, tworząc przedmioty, zdobywając skrzynie oraz sprzedając rzeczy sklepom. Ta wartość może tylko rosnąć.

      Wymiany i poczta się nie wlicza, więc pożyczanie lub otrzymywanie przedmiotów tej wartości nie zwiększy.
    wealthSpent: |-
      <c>Majątek zużyty</c> to wartość w monetach, które zużywasz w akcjach: materiały zużyte do wytwarzania, jedzenie i mikstury, przedmioty wyrzucone oraz płacenie za przedmioty więcej niż są warte. Zysk netto to wypracowany majątek pomniejszony o koszty.

      Wymiany i poczta nie wlicza się, dawanie przedmiotów nie zwiększa tej kwoty.
    netEarnings: |-
      <c>Zysk netto</c> to twój majątek pomniejszony o majątek wydany: to jak rośnie twoje bogactwo, poprzez granie.

      Wymiany i poczta nie wliczają się.
    tradeBalance: |-
      <c>Balans wymiany</c> to wskaźnik ukazujący, jak wymiany z innymi graczami dodały się do twojego majątku, na dzisiejsze ceny: przedmioty i złoto, które otrzymujesz minus te, które rozdajesz. Przedmioty, które powróciły tą samą metodą, którą zostały wysłane nie wliczają się, więc zwrócone pożyczki nie mają wpływu.

      Ta wartość jest częścią twojego całkowitego majątku, ale nie całkowitego zyskanego majątku i może być ujemna, gdy więcej oddasz niż otrzymasz.
