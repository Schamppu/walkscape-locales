singulars:
  realms:
    jarvonia:
      desc: Zamarznięta i zimna kraina w północno-zachodnim krańcu Arenum.
      name: Jarvonia
    gdte:
      name: Wielkie Księstwo Trellin-Erdwise
      desc: Wielkie księstwo znajdujące się wokół Wielkich Bagien, rządzone 
        przez diarchię dwóch księstw.
    syrenthia:
      name: Syrenthia
      desc: Podwodna kraina położona pomiędzy Jarvonią a Wielkim Księstwem 
        Trellin-Erdwise.
    wallisia:
      name: Królestwo Wallisii
      desc: Imperium Wallisii, potężne państwo, które podbiło Wielkie Księstwo, 
        Galeforge i Wrentmark.
    galeforge:
      name: Galeforge
      desc: Miasto-państwo podbite przez Wallisię, znane ze swoich innowacji i 
        technologii.
    wrentmark:
      name: Wrentmark
      desc: Mniejsze królestwo na południu, podbite przez Wallisię. Wrentmark 
        słynie z palących pustyń i kopalni klejnotów.
    ewerethien:
      name: Ewerethien
    braemercia:
      name: Braemercia
    painful_islands:
      name: Wyspy Cierpienia
    rid_raddak:
      name: Rid Raddak
    ethereal:
      name: Ethereal
  factions:
    trellin:
      name: Trellin
      desc: Zachodnie księstwo Wielkiego Księstwa Trellin-Erdwise, które 
        sprawuje władzę nad Wielkimi Bagnami z Salsfirth.
    erdwise:
      name: Erdwise
      desc: Wschodnie księstwo Wielkiego Księstwa Trellin-Erdwise, sprawujące 
        władzę nad bogatymi nadmorskimi miastami księstwa.
    halflingRebels:
      name: Rebelianci Niziołków
      desc: Duży buntowniczy ruch niziołków walczących o wolność spod władzy 
        Wielkiego Księstwa Trellin-Erdwise.
    tutorialArea:
      desc: Niewielki obszar, w którym nowi poszukiwacze przygód mogą nauczyć 
        się podstawowych zasad poruszania się w pobliżu Chaty Pomocnego Herberta
        w Jarvonii.
      name: Przewodnik Turystyczny Herberta
