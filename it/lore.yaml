singulars:
  firstBirthdayLetter:
    p1: "Ciao!\n\nSono il tuo caro amico Herbert! Non riesco a credere che sia già
      passato un anno intero da quando sei arrivato qui ad Arenum.\n\nScommetto che
      hai fatto dei bei progressi e che continuerai a migliorare. Anche se forse non
      ti servono più molto, sappi che i bastoncini di legno, le pietre e lo spago
      di riserva che trovo ogni giorno sono qui a tua disposizione, pronti per essere
      presi ogni volta che ne hai bisogno.\n\nSe passi da queste parti, puoi sempre
      scaldarti davanti al mio focolare e raccontarmi le tue avventure. Sono sicuro
      che ora devi tornare alle tue imprese, quindi chiudo qui.\n\nAbbi cura di te
      <icon i=\"Favorited\" />, ci sentiamo più tardi!\n\n- *Herbert*\n"
  secondBirthdayLetter:
    p1: "Bentornato!\n\nÈ già passato un altro anno? Il tempo vola, sono sicuro che
      ne passerà un altro in men che non si dica.\n\nSpero che tu abbia fatto dei
      bei progressi e che ti sia migliorato. Dovresti passare a trovarmi qualche volta
      per raccontarmi di persona le tue avventure.\n\nScommetto che a questo punto
      sei arrivato più lontano di quanto la maggior parte dei mercanti abbia osato
      avventurarsi. A proposito di mercanti, quelli del posto sono tornati a cercare
      di comprare la mia capanna. Dicono che sarebbe un posto perfetto per un emporio
      di grandi dimensioni, ma io non ho intenzione di andarmene da qui: potresti
      aver bisogno di un posto dove riposarti durante il tuo viaggio!\n\nBeh, per
      ora basta con le chiacchiere di un vecchio, stammi bene!\n- *Herbert*\n"
  thirdBirthdayLetter:
    p1: "Ma guarda un po’!\n\nÈ già il tuo terzo anno qui! La maggior parte degli
      altri non resiste così a lungo, quindi hai fatto bene a non mollare.\n\nDi solito
      a questo punto si arrendono e mi supplicano di porre fine alle loro sofferenze;
      è piuttosto scoraggiante quando si arriva a quel punto.\n\nTi andrebbe di passare
      a trovarmi qualche volta per rassicurarmi che te la cavi ancora bene, raccontandomi
      qualche aneddoto delle tue avventure? Potremmo festeggiare il tuo anniversario
      con un delizioso tè e dei dolcetti.\n\nAbbi cura di te e cerca di non cedere
      all’oscurità: si insinua lentamente anche se la combatti.\n\n- *Herbert*"
