  goose:
    rareName: Oca lunga
    rareDesc: Questa oca sembra essere particolarmente amichevole, sembra 
      persino <c>allungare il collo</c> verso di te!
    name: Oca
    desc: Un'oca più amichevole, forse una delle poche oche che non ti 
      attaccherà a vista.
    defaultNames:
      "0": Giuliva
      "1": Lucia
      "2": Cobo
      "3": Rudi
      "4": Ares
  snake:
    name: Serpente
    desc: Un serpente dispettoso, riesci a tenerlo nascosto?
    rareName: Serpente cornuto
    rareDesc: Un serpente come questo non può avere buone intenzioni, ha persino
      delle <c>corna appuntite</c>!
    defaultNames:
      "0": SirBis
      "2": Jena
      "1": Plissken
      "3": Schiaf
      "4": Uoro
      "5": Medusa
  tiger:
    name: Tigre
    desc: Una tigre potente, che vanta forza, agilità e velocità tutte in un 
      unico animale.
    rareName: Tigre regale
    rareDesc: Una tigre <c>dorata</c>! Dovresti sentirti davvero fortunato ad 
      essere nelle grazie di una creatura del genere.
    defaultNames:
      "0": Toni
