    rareDesc: Questa mummia è avvolta in una raffinata <c>seta</c>! Sembra 
      davvero all'ultima moda per l'epoca.
  pixie:
    name: Folletto
    desc: Un folletto tutto eccitato, o forse è una fata? Pronto per la festa 
      della sua vita. Faresti meglio a prepararti a tutto.
    rareName: Folletto festaiolo
    rareDesc: Si dice che se ti capita di incontrare un folletto delle feste, è 
      meglio che ti prepari a non fare nulla il giorno dopo. Riuscirai a 
      sopravvivere?
