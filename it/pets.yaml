      "8": Dancer
  mummy:
    name: Mummia
    desc: Una mummia imperturbabile può sembrare vestita di stracci, ma sa bene 
      come farli durare.
    rareName: Mummia setosa
    defaultNames:
      "0": Mumford
      "1": Ramses
      "2": Nyarlathotep
