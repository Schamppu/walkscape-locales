  reindeer:
    rareName: Renna festosa
    rareDesc: Questa renna è piena di energia ed è particolarmente 
      <c>festosa</c>! Sembra che possa volare, ma probabilmente non dovresti 
      metterlo alla prova.
    name: Renna
    desc: Una renna allegra, può saltellare con facilità sui terreni innevati e 
      avere ancora energia da vendere.
    defaultNames:
      "0": Saltarello
