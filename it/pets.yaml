  dolphin:
    rareName: Delfino acrobata
    desc: Un delfino intelligente, capace di muoversi velocemente nell'acqua. Ti
      ringrazierà sempre per tutto il pesce.
    name: Delfino
    rareDesc: Questo delfino raccoglie sempre oggetti con cui <c>rimbalzare e 
      fare acrobazie</c>! Guardalo come si muove!
    defaultNames:
      "1": Eco
