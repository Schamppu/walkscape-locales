      "3": Scar
      "5": Artemide
      "6": Hobbes
      "7": Tiggre
      "8": Zara
      "9": Derpy
  tortoise:
    name: Tartaruga
    desc: Una tartaruga riservata, che mantiene la calma. Lentamente, ma con 
      costanza.
    rareName: Tartaruga preziosa
    rareDesc: Il guscio di questa tartaruga ha la lucentezza dei <c>metalli 
      preziosi a forma di fiore</c>!
    defaultNames:
      "0": Leonardo
