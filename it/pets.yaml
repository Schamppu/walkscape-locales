    name: Rocky
  goldenFrog:
    name: Rana dorata
    rareName: Rana d'argento
    rareDesc: Fatti nuovi amici, ma non dimenticare quelli di sempre. Gli uni 
      sono d’argento, gli altri d’oro. Quindi, con queste rane, non hai bisogno 
      di altri amici.
    defaultNames:
      "0": Kermit
      "1": Gamabunta
      "2": Sgushh
      "3": Poly
      "4": Treznor
      "6": Craccky
      "8": Evuka
      "9": Tommit
      "5": Glen
      "7": Diana
    desc: Una rana dal colore dorato che, secondo alcuni, porta fortuna! Altri 
      dicono che sia buonissima da mangiare. Già, a loro non piacciono quelle 
      altre persone.
  sawmantis:
    defaultNames:
      "3": Edward
      "0": Victor
      "1": Fede
      "2": Monty
      "4": Manny
      "5": Mandy
      "6": Jig
      "7": Dusty
      "8": Carrie
      "9": Tretij
    desc: 'Una sfuggente mantide sega: di solito è difficile trovarla, grazie alla
      sua pelliccia mimetica. I suoi affilati arti a forma di sega tagliano il legname
      con facilità.'
    name: Mantide sega
    rareName: Mantide sega psichica
    rareDesc: '<c>Mantide sega psichica</c>? Attento a cosa pensi: si dice che queste
      mantidi sega con la <c>maschera antigas</c> siano telepatiche. Vuoi che ti aiuti
      con la falegnameria, vero?'
  termite:
    desc: 'Una termite amante del legname che ti aiuterà volentieri a sbarazzarti
      dei trucioli che hai in giro. Non giocare a riportare il bastoncino con lei:
      non lo rivedrai più.'
    name: Termite
    rareName: Termite terminale
    rareDesc: È raro trovarne una, ma si dice che a Galeforge si incontrino più 
      spesso. In qualche modo mangiano ancora legno, nonostante abbiano una 
      specie di <c>terminale</c> al posto della faccia.
    defaultNames:
      "0": Might
      "1": Moe
      "2": Woody
      "3": Termina
      "4": Splinter
      "5": Twiggy
      "6": Hazel
      "7": Willow
      "8": Yagi
      "9": Tammi
  livingFlame:
    name: Fiamma vivente
    desc: 'Una calda fiamma vivente: può sopravvivere con qualsiasi cosa infiammabile.
      Questa sembra aver appena trasformato qualunque cosa fosse in carbone.'
    rareName: Fiamma marshmallow
    rareDesc: 'Una dolce fiamma <c>marshmallow</c>! Tieni lontano il cioccolato: attirerebbe
      creature che potrebbero volerla mangiare, e tra queste potresti esserci anche
      tu, se non stai attento.'
