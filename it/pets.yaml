  gecko:
    rareName: Geco granato
    rareDesc: Questo geco ha un aspetto un po' più imponente rispetto agli 
      altri. Ha un <c>colore unico e una cresta a forma di spuntoni</c>!
    name: Geco
    desc: Un misterioso geco custodisce ogni sorta di segreto che è tenuto a 
      mantenere.
    defaultNames:
      "0": Meco
      "2": Punta
