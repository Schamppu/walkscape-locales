singulars:
  achievements:
    info:
      viewDescription: Sblocca obiettivi per guadagnare <hl>Punti 
        Obiettivo</hl>. Quando la barra Punti Obiettivo è piena, ottieni 
        qualcosa di speciale per tutti i tuoi personaggi! Alcuni obiettivi danno
        anche delle ricompense extra.
      specialItems: Gli oggetti speciali, come <icon i="Collectible"/> 
        <c>collezionabili</c> e <icon i="Lore Item"/> <c>oggetti della 
        storia</c>, vengono raccolti durante il tuo viaggio in WalkScape. Puoi 
        visualizzarli qui. I collezionabili ti consentono di accumulare punti 
        obiettivo.
      noCollectibleItems: Non hai oggetti collezionabili.
      totalProgressUnlocks: Otterrai questi premi in base ai tuoi progressi 
        totali negli obiettivi e perderai l'accesso agli oggetti se saranno 
        disponibili più punti obiettivo.
      checkPointUnlocks: Questi obiettivi sono disponibili in determinati punti 
        di controllo dei punti obiettivo. Non perderai l'accesso a questi anche 
        se saranno disponibili più punti obiettivo.
      collectibleItems: I collezionabili sono oggetti rari che puoi ottenere nel
        gioco principalmente attraverso le attività. <c i=0>Ogni collezionabile 
        ti garantisce</c> <c i=1>un</c> <icon i="Achievement Point"/> <c 
        i=1>punto obiettivo</c>. I collezionabili non occupano spazio 
        nell'inventario e rimangono sempre con il tuo personaggio.
      loreItems: Gli oggetti di storia sono oggetti come libri, lettere e altri 
        materiali scritti che puoi trovare. Non occupano spazio nell'inventario 
