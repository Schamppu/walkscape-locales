      installHealthConnectExplanation: Health Connect è necessario per leggere i
        passi dai tuoi dispositivi indossabili. Devi prima installarlo premendo 
        il pulsante sopra, quindi collegarti ad esso.
      samsungHealthConnectedInfo: Samsung Health è connesso! Il gioco leggerà 
        sia i passi registrati dai tuoi dispositivi indossabili connessi a 
        Samsung Health sia quelli registrati dal tuo telefono.
      continueWillEnable: Il pulsante Continua sarà abilitato dopo aver concesso
