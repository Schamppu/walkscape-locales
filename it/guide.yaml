maps:
  tips:
    "14": 'Se sono in corso lavori di manutenzione, non preoccuparti: di solito i
      tuoi passi continuano a essere conteggiati anche durante il periodo di inattività.
      Controlla gli annunci su <a href="https://discord.gg/Kk6VecJFEk" c="lightPurple">Discord</a>
      per esserne sicuro!'
    "18": I livelli di abilità che superano il requisito di <hl>abilità</hl> principale
      di un'attività conferiscono un bonus del +1,25% all'<hl>efficienza lavorativa</hl>
      per ciò che stai facendo, fino a un massimo di 20 livelli.
    "0": Essere sovraccarichi rallenta solo le tue attività, ma non influisce sui
      viaggi.
    "1": La probabilità base di trovare materiali <hl>OTTIMI</hl> è <hl>1%</hl>, ma
      è possibile aumentarla utilizzando attrezzature e strumenti migliori.
    "2": La probabilità base di trovare la maggior parte dei forzieri è <hl>1/250</hl>,
      che puoi aumentare con attrezzature e strumenti migliori.
    "3": 'Gli attributi che contengono il simbolo di percentuale <hl>%</hl> sono moltiplicativi
      (ad esempio: +10% di ricerca di materiali pregiati dà 1,1/100).'
    "4": Premendo a lungo su un oggetto si aprono le opzioni di selezione multipla
      nell'inventario.
    "5": Il pulsante a forma di pinza nella parte inferiore dello schermo apre l'<hl>interfaccia
      di creazione</hl>.
    "6": Premendo sulla mini-mappa in alto a destra si apre la mappa completa con
      le opzioni di viaggio.
    "7": Puoi trovare i <hl>traguardi</hl> e gli <hl>oggetti collezionabili</hl> ottenuti
      toccando il tuo personaggio in alto a sinistra.
    "8": Gli oggetti collezionabili che trovi ti danno 1 <hl>punto obiettivo</hl>
      extra per ogni oggetto!
    "9": Molti PNG possono raccontarti <hl>voci</hl> che ti aiutano a trovare oggetti
      nel gioco.
    "10": Il <hl>menu hamburger</hl> in basso a destra (o in basso a sinistra nella
      modalità per mancini) contiene la tua <hl>WalkPedia</hl> che ti aiuta a tenere
      traccia dei tuoi progressi complessivi.
    "11": "Presta attenzione alle specifiche di un risultato: alcuni contano ai fini
      dello sblocco solo se il rilascio proviene direttamente da un'attività."
    "12": Assicurati di <hl>equipaggiare</hl> i tuoi oggetti per ottenere i loro effetti,
      la maggior parte non funziona solo dall'inventario.
    "13": Lo spazio in banca è illimitato, se sei indeciso sull'utilizzo di qualcosa,
      mettilo in banca!
    "15": Dai un'occhiata al nostro <a href="https://portal.walkscape.app" c="lightGreen">Portal</a>,
      <a href="https://www.reddit.com/r/walkscape" c="lightRed">Reddit</a> e <a href="https://discord.gg/Kk6VecJFEk"
      c="lightPurple">Discord</a> per annunci, aggiornamenti e blog di sviluppo.
    "16": Hai trovato un bug o hai un suggerimento? Segnalacelo su <a href="https://discord.gg/Kk6VecJFEk"
      c="lightPurple">Discord</a>! Le tue segnalazioni ci aiutano a migliorare il
      gioco!
    "17": <hl>Risultato di qualità</hl> contribuirà ad aumentare le possibilità di
      ottenere oggetti di qualità superiore visualizzati nella parte inferiore delle
      <hl>ricette</hl> nell'<hl>interfaccia di creazione</hl>.
    "19": I livelli di abilità che superano il requisito di abilità principale di
      una <hl>ricetta</hl> nell'<hl>interfaccia di creazione</hl> forniscono un <hl>risultato
      di qualità</hl> aggiuntivo.
    "20": Equipaggiare un set di equipaggiamento mentre ci si trova in banca preleverà
      automaticamente tutti gli oggetti dalla banca.
    "22": Vuoi scoprire qualche dettaglio particolare sul gioco e non ti preoccupano
      gli spoiler? Dai un'occhiata alla <a href="https://wiki.walkscape.app" c="yellow">Wiki</a>!
    "24": Le attività di caccia che richiedono risorse forniscono <hl>il doppio</hl>
      dei dadi della loro tabella dei bottini principale!
    "23": Ti piace il gioco? È grazie a tutti i nostri sostenitori che ci hanno aiutato
      su <a href="https://www.patreon.com/WalkScape" c="yellow">Patreon</a> e <a href="https://buymeacoffee.com/walkscape"
      c="yellow">Buy Me A Coffee</a>!
    "21": Le attività di caccia che richiedono risorse ottengono <hl>bonus</hl> utilizzando
      le versioni <hl>PREGIATE</hl> di tali risorse! Controlla l'interfaccia per scoprire
      quali vantaggi offrono!
  skillTypes:
    "gathering": Le abilità di raccolta includono <skill skill="foraging"/>,<skill
      skill="fishing"/>,<skill skill="hunting"/>,<skill skill="mining"/> e <skill
      skill="woodcutting"/>.
    "artisan": Le abilità di manifattura comprendono <skill skill="cooking"/>, <skill
      skill="crafting"/>, <skill skill="carpentry"/>, <skill skill="smithing"/>,<skill
      skill="tailoring"/> e <skill skill="trinketry"/>.
    "utility": Le abilità funzionali includono <skill skill="agility"/>.
singulars:
  info:
    inventoryFull: Il tuo inventario è pieno! Per tutte le attività, eccetto il viaggio,
      essere sovraccarichi rallenterà le tue azioni. Puoi andare in banca per depositare
      gli oggetti, oppure eliminare alcuni oggetti dal tuo inventario per fare spazio.
    bankUsage: "Premendo a lungo i pulsanti di deposito o prelievo è possibile depositare
      o prelevare fino a <c i=0>1000</c> oggetti alla volta. È possibile utilizzare
      la ricerca nella banca per trovare rapidamente gli oggetti. È possibile effettuare
      la ricerca per <c i=0>nome, parole chiave, abilità o slot</c>.\n\n<c i=0>La
      tua banca ha spazio illimitato!</c>\n\nPuoi anche utilizzare il pulsante <icon
      i=\"Favorited\"/> <c i=1>Preferiti</c> per visualizzare solo i tuoi oggetti
      preferiti."
    lockFavoriteItem: "<icon i=\"Favorited\"/> <c i=0>Preferito</c>: Non puoi abbandonare
      né vendere questo oggetto. Puoi comunque utilizzarlo per la creazione, gli incarichi
      e altre azioni.\n\n<icon i=\"Locked\"/> <c i=1>Blocco</c>: non puoi vendere,
      abbandonare o depositare questo oggetto finché è bloccato. Puoi comunque utilizzarlo
      per la creazione di oggetti, gli incarichi e altre azioni.\n\nIl blocco o l'aggiunta
      ai preferiti di un oggetto si applica a tutti gli oggetti simili presenti nel
      tuo inventario e nella banca. Puoi sbloccare o rimuovere dagli oggetti preferiti
      anche quelli presenti nel tuo inventario o nella banca."
    inventoryUsage: "Una pressione prolungata su una pila di oggetti <c i=0>aprirà
      la modalità di selezione multipla</c>, consentendoti di selezionare più pile
      contemporaneamente per abbandonarle o depositarle.\n\nIl pulsante <c i=0>Opzioni</c>
      nella parte inferiore ti consente di modificare la modalità di visualizzazione
      delle pile di oggetti.\n\n<bp /><icon i=\"Deposit\" /> <hl>Tutto</hl>: deposita
      tutti gli oggetti nel tuo inventario in banca, se disponibile nella tua posizione.\n\
      \n<bp /><icon i=\"Bank small\" /> <hl>Banca</hl>: apre la tua banca e ti consente
      di effettuare depositi o prelievi, se disponibili nella tua posizione.\n\n<bp
      /><icon i=\"Sort\" /> <hl>Ordina</hl>: ordina il tuo inventario.\n"
    claimPet: Una volta reclamato il tuo animale domestico, questo verrà aggiunto
      alla tua collezione e potrai farlo nascere e invocarlo in qualsiasi momento.
      Non è possibile scambiare gli animali domestici reclamati, poiché diventano
      <c>legati al tuo personaggio</c>.
    attributeTypes: "<bp /><icon i=\"Gear alt\"/>  <c i=0>Equipaggiamento indossato</c>:
      attributi dell'equipaggiamento attualmente indossato.\n\n<bp /><icon i=\"Tools
      alt\"/>  <c i=1>Strumenti equipaggiati</c>: attributi degli strumenti attualmente
      equipaggiati.\n\n<bp /><icon i=\"Collectible\"/>  <c i=2>Collezionabili</c>:
      attributi permanenti dei collezionabili.\n\n<bp /><icon i=\"Dev services\"/>\
      \  <c i=3>Servizi</c>: attributi dei servizi nella tua posizione attuale.\n\n\
      <bp /><icon i=\"Pets\"/>  <c i=4>Animali domestici</c>: attributi dal tuo animale
      domestico evocato.\n\n<bp /><icon i=\"Fine material\"/>  <c i=5>Bonus input
      materiale pregiato</c>: bonus derivante dall'uso di materiali pregiati.\n\n\
      <bp /><icon i=\"Material\"/>  <c i=6>Input materiali</c>: attributi dai materiali
      di input selezionati per un'attività.\n\n<bp /><icon i=\"Consumables\"/>  <c
      i=7>Consumabili</c>: attributi derivanti dai tuoi consumabili che vengono consumati.\n\
      \n<bp /><icon i=\"Level up\"/>  <c i=8>Livello abilità</c>: attributi derivanti
      dal tuo livello di abilità (ad es. superare il requisito di livello di abilità).\n\
      \n<bp /><icon i=\"Abilities\"/>  <c i=9>Abilità</c>: attributi delle tue abilità.\n\
      \n<bp /><icon i=\"Player effect\"/>  <c i=10>Effetti attivi</c>: attributi degli
      effetti attualmente attivi.\n"
    mailbox: Puoi ritirare dalla tua casella di posta gli oggetti che ricevi dagli
      eventi, dagli scambi con altri giocatori e così via.
    claimCosmeticDrop: Riscattare un cosmetico da bottino <c>lo consuma</c> e sblocca
      in modo permanente il cosmetico per il tuo personaggio, così potrai indossarlo
      dal guardaroba. L'operazione non può essere annullata e un cosmetico già sbloccato
      non verrà più trovato.
    claimBlueprint: Riscattare un progetto <c>lo consuma</c> e sblocca in modo permanente
      le ricette che insegna. Puoi possedere una sola copia di ciascun progetto e
      il riscatto non può essere annullato.
    swapXpFromEffort: 'Questo attributo converte gli oggetti in esperienza. Ecco cosa
      ottieni dai diversi oggetti:'
    swapToItemSources: 'Questo attributo converte questi oggetti quando li trovi:'
    swapToXpSources: 'Questo attributo converte questi oggetti in esperienza quando
      li trovi:'
    swapToTablesSources: 'Questo attributo converte questi oggetti in un ritrovamento
      speciale quando li trovi:'
    worldMapIcons: "<image id=\"bank\"/> <hl>Banca</hl>: deposita e preleva oggetti.\n\
      \n<image id=\"deposit\"/> <hl>Cassetta di deposito</hl>: permette solo di depositare
      oggetti.\n\n<image id=\"store\"/> <hl>Negozio</hl>: compra e vendi di tutto!\n\
      \n<image id=\"mysteriousMerchant\"/> <hl>Mercante Misterioso</hl>: un raffinato
      fornitore di merci esotiche.\n\n<image id=\"barber\"/> <hl>Barbiere</hl> e <image
      id=\"wardrobe\"/> <hl>Guardaroba</hl>: cambia il tuo aspetto.\n\n<image id=\"\
      forge\"/> <image id=\"kitchen\"/><image id=\"workshop\"/> <image id=\"sawmill\"\
      /><image id=\"loom\"/> <image id=\"trinketry\"/> <hl>Stazioni di creazione</hl>:
      crea ricette di forgiatura, cucina, artigianato, falegnameria, sartoria e oreficeria.\n\
      \nIl colore del bordo di un'icona indica il livello del servizio: <image id=\"\
      forge\"/> <serviceTier tier=\"basic\"/> o <image id=\"forgeAdvanced\"/> <serviceTier
      tier=\"advanced\"/>.\n\n<icon path=\"assets/icons/location_badges/unexplored_badge.png\"\
      \ size=\"16\"/> <hl>Inesplorato</hl>: non hai ancora visitato questo luogo.\n\
      \n<icon path=\"assets/icons/location_badges/rumor_badge.png\" size=\"16\"/>
      <hl>Voci</hl>: hai sentito delle voci su questo luogo."
    trading: "Visualizza tutti gli scambi attivi e il loro stato.\n<bp/> Puoi fare
      scambi da qualsiasi luogo. Gli oggetti aggiunti a uno scambio vengono prelevati
      dalla tua <icon i=\"Bank small\"/> banca e, se li rimuovi dallo scambio, vi
      ritornano. Gli scambi si avviano selezionando un personaggio nelle classifiche
      o nei menu social.\n<bp/> Uno scambio è completato quando entrambi i partecipanti
      hanno <icon i=\"Accept\"/> accettato le offerte sul tavolo. Qualsiasi modifica
      dell'altra parte richiede che tu accetti di nuovo. Gli oggetti di uno scambio
      completato vengono inviati alla tua casella di posta.\n<bp/> Puoi avere un solo
      scambio attivo alla volta con ciascun giocatore.\n"
