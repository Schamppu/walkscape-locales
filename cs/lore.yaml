singulars:
  firstBirthdayLetter:
    p1: |
      Ahoj!

      Tady je tvůj dobrý kamarád Herbert! Nemůžu uvěřit, že už uplynul celý rok od chvíle, kdy ses poprvé objevil tady v Arenu.

      Vsadím se, že jsi udělal pořádný pokrok a budeš se jen dál zlepšovat. I když už je možná moc nepotřebuješ, věz, že ty dřevěné tyčky, kameny a provázky, které každý den najdu, jsou tady pro tebe – vezmi si je, kdykoli budeš potřebovat.

      Když se zastavíš, můžeš se kdykoli ohřát u mého krbu a povyprávět mi o svých dobrodružstvích. Jsem si jistý, že se k nim teď musíš vrátit, takže to tady ukončím.

      Měj se hezky <icon i="Favorited" />, promluvíme si později!

      - *Herbert*
  secondBirthdayLetter:
    p1: |
      Vítej zpátky!

      To už uplynul další rok? Čas letí, jsem si jistý, že další rok bude tu dřív, než se naděješ.

      Doufám, že jsi udělal pořádný pokrok a zdokonalil ses. Měl bys někdy zaskočit a povyprávět mi z první ruky o svých dobrodružstvích.

      Vsadím se, že jsi se dostal dál, než se většina obchodníků odvážila zatoulat. Když už mluvíme o obchodnících, ti místní se zase zastavili a snažili se koupit mou chatrč. Říkají, že by to bylo skvělé místo pro nějaký velký obchod se smíšeným zbožím, ale já se nikam chystat nehodlám – možná budete během své cesty potřebovat místo na odpočinek!

      No, to by prozatím stačilo z blábolů starého muže, měj se hezky!

      - *Herbert*
  thirdBirthdayLetter:
    p1: |-
      No, to se podívejme!

      Už jsi tu třetí rok! Většina ostatních to tak dlouho nevydrží, takže jsi si vedl dobře, že jsi vydržel.

      Obvykle to už touhle dobou vzdají a prosí mě, abych konečně ukončil jejich utrpení; je to docela skličující, když to dojde až tak daleko.

      Nechtěl bys někdy přijít a ujistit mě, že se ti stále daří dobře, a povyprávět mi nějaké příběhy o svých dobrodružstvích? Můžeme oslavit tvé výročí u lahodného čaje a pečiva.

      Dávej na sebe pozor a nenech se přemoci temnotou – ta se vkrádá pomalu, i když s ní bojuješ.

      - *Herbert
